apiVersion: v1
kind: Namespace
metadata:
  name: envplane-e2e-base
  labels:
    envplane.io/e2e-fixture: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-base-workload
  namespace: envplane-e2e-base
  labels:
    app.kubernetes.io/name: e2e-base-workload
    envplane.io/e2e-fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-base-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-base-workload
    spec:
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
