# Operator configuration for the existing bethunder-local minikube profile.
# The image-pull Secret contains credentials and is created in the cluster;
# this file stores only its name.
# LOCAL DEVELOPMENT ONLY: this profile intentionally disables TLS and Secure
# cookies for a disposable minikube cluster; never use it for shared access.
allowInsecureLocalDevelopment: true
global:
  envplane:
    registry:
      mode: existing
      existingSecret: envplane-ghcr
      imagePullSecrets:
        - name: envplane-ghcr
    auth:
      # OAuth is now activated in the managed authentication store. Do not
      # re-run the legacy bootstrap migration on every local restart.
      mode: disabled
      existingSecret: ""
    firstStartRegistration:
      mode: managed
      cluster:
        id: bethunder-local
    # Project-owned local Agent/Runner releases are reconciled only in this
    # pre-created namespace. No credential material is stored in this file.
    sameClusterProjectExecutors:
      enabled: true
      namespace: envplane-executors
      allowInsecureControlPlane: true
      registry:
        existingSecret: envplane-ghcr
        imagePullSecret: envplane-ghcr

envplane-control-plane:
  # LOCAL DEVELOPMENT ONLY: canonical callback origin for the minikube ingress.
  publicURL: http://envplane.local
  env:
    # LOCAL DEVELOPMENT ONLY: this profile intentionally uses HTTP on a
    # disposable minikube host. Production/operator values must omit this.
    ENVPLANE_OAUTH_COOKIE_SECURE: "false"
    ENVPLANE_PUBLIC_URL_ALLOW_HTTP_LOCAL_DEVELOPMENT: "true"
    # The local GitLab-backed Flux project uses direct commit mode. Keep the
    # repository writer enabled so rendered environment manifests are pushed
    # for Flux to reconcile.
    ENVPLANE_ENABLE_GIT_COMMIT: "true"
    ENVPLANE_ENABLE_GIT_PUSH: "true"
  rbac:
    sameClusterProjectExecutors:
      enabled: true
      namespace: envplane-executors
  postgres:
    auth:
      # The control-plane chart creates and owns this Secret on first install,
      # then preserves its generated password across upgrades.
      existingSecret: ""
    tls:
      # LOCAL DEVELOPMENT ONLY: the disposable minikube PostgreSQL instance
      # does not provision a CA/server certificate.
      enabled: false

# Run the EnvPlane execution plane in the same minikube cluster as the control
# plane. The managed first-start registration above supplies the one-time
# credentials used by both workloads.
agent:
  enabled: true

runner:
  enabled: true

access:
  mode: ingress
  ingress:
    # LOCAL DEVELOPMENT ONLY: required by the umbrella chart when TLS is off.
    allowInsecureHttp: true
    host: envplane.local
    className: nginx
    tls:
      enabled: false

envplane-agent:
  controlPlane:
    # LOCAL DEVELOPMENT ONLY: the disposable minikube ingress exposes the
    # control plane over HTTP. Production profiles must keep this false.
    allowInsecure: true

envplane-runner:
  controlPlane:
    # LOCAL DEVELOPMENT ONLY: the disposable minikube ingress exposes the
    # control plane over HTTP. Production profiles must keep this false.
    allowInsecure: true

platformDependencies:
  ingress:
    mode: existing
    provider: nginx
    existingClassName: nginx
    namespace: ingress-nginx
    ownership: external
