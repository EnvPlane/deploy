{{- $postgresMode := default (ternary "internal" "disabled" .Values.postgres.enabled) .Values.postgres.mode -}}
{{- $redisMode := default (ternary "internal" "disabled" .Values.redis.enabled) .Values.redis.mode -}}
{{- $global := default (dict) .Values.global -}}
{{- $globalEnvPlane := default (dict) (get $global "envpilot") -}}
{{- $platformDependencyStatus := default (dict) (get $globalEnvPlane "platformDependencyStatus") -}}
{{- $platformDependencyStatusEnabled := default false $platformDependencyStatus.enabled -}}
{{- $platformDependencyStatusConfigMap := include "envpilot-control-plane.platformDependencyStatusConfigMapName" . -}}
{{- $platformDependencyStatusStaleAfter := default 300 (get $platformDependencyStatus "staleAfterSeconds") -}}
{{- $remoteClusterReconciler := default (dict) (get $globalEnvPlane "remoteClusterReconciler") -}}
{{- $remoteClusterReconcilerEnabled := default false $remoteClusterReconciler.enabled -}}
{{- $sameClusterProjectExecutors := default (dict) (get $globalEnvPlane "sameClusterProjectExecutors") -}}
{{- $sameClusterProjectExecutorsEnabled := default false $sameClusterProjectExecutors.enabled -}}
{{- $sameClusterProjectExecutorsNamespace := trim (default "" $sameClusterProjectExecutors.namespace) -}}
{{- $executorReconcilerEnabled := or $remoteClusterReconcilerEnabled $sameClusterProjectExecutorsEnabled -}}
{{- $registry := default (dict) (get $globalEnvPlane "registry") -}}
{{- $projectExecutorRegistry := default (dict) (get $sameClusterProjectExecutors "registry") -}}
{{- $executorRegistrySecret := trim (default (default "" (get $registry "existingSecret")) (get $projectExecutorRegistry "existingSecret")) -}}
{{- $executorImagePullSecret := trim (default $executorRegistrySecret (get $projectExecutorRegistry "imagePullSecret")) -}}
{{- $remoteClusterReconcilerConfig := default (dict) .Values.remoteClusterReconciler -}}
{{- $leaderElection := default (dict) (get $remoteClusterReconcilerConfig "leaderElection") -}}
{{- $leaderElectionNamespace := trim (default "" (get $leaderElection "namespace")) -}}
{{- $remoteCompatibilityConfigMap := include "envpilot-control-plane.remoteClusterCompatibilityConfigMapName" . -}}
{{- $firstStart := default (dict) (get $globalEnvPlane "firstStartRegistration") -}}
{{- $firstStartMode := default "disabled" $firstStart.mode -}}
{{- if and $sameClusterProjectExecutorsEnabled (or (eq $firstStartMode "disabled") (not $sameClusterProjectExecutorsNamespace)) -}}
{{- fail "sameClusterProjectExecutors requires enabled firstStartRegistration and a pre-existing namespace" -}}
{{- end -}}
{{- if and $sameClusterProjectExecutorsEnabled (not $executorRegistrySecret) -}}
{{- fail "sameClusterProjectExecutors requires registry.existingSecret for signed OCI child charts" -}}
{{- end -}}
{{- if and $sameClusterProjectExecutorsEnabled (not $executorImagePullSecret) -}}
{{- fail "sameClusterProjectExecutors requires registry.imagePullSecret in the pre-existing executor namespace" -}}
{{- end -}}
{{- $e2eFixture := default (dict) (get $globalEnvPlane "e2eFixture") -}}
{{- $e2eFixtureRecovery := default (dict) (get $e2eFixture "recovery") -}}
{{- $firstStartSecret := "" -}}
{{- $agentBootstrap := default (dict) .Values.agentBootstrap -}}
{{- $agentBootstrapImage := default (dict) $agentBootstrap.image -}}
{{- $agentBootstrapChart := default (dict) $agentBootstrap.chart -}}
{{- $legacyRemoteControlPlane := default (dict) .Values.remoteControlPlane -}}
{{- $globalRemoteControlPlane := default (dict) (get $globalEnvPlane "remoteControlPlane") -}}
{{- $managementEndpointProfile := default (dict) (get $globalEnvPlane "managementEndpointProfile") -}}
{{- $managementEndpointBootstrap := default (dict) (get $managementEndpointProfile "bootstrap") -}}
{{- $globalRemoteTLS := default (dict) (get $globalRemoteControlPlane "tls") -}}
{{- $globalRemoteCARef := default (dict) (get $globalRemoteTLS "caSecretRef") -}}
{{- $bootstrapTLS := default (dict) (get $managementEndpointBootstrap "tls") -}}
{{- $bootstrapCARef := default (dict) (get $bootstrapTLS "caSecretRef") -}}
{{- $legacyRemoteCASecret := default "" (get $legacyRemoteControlPlane "caSecret") -}}
{{- $remoteCASecret := default (default $legacyRemoteCASecret (get $globalRemoteCARef "name")) (get $bootstrapCARef "name") -}}
{{- $remoteCAKey := default "ca.crt" (get $legacyRemoteControlPlane "caKey") -}}
{{- if get $bootstrapCARef "name" -}}
{{- $remoteCAKey = default "ca.crt" (get $bootstrapCARef "key") -}}
{{- else if and (not $legacyRemoteCASecret) $remoteCASecret -}}
{{- $remoteCAKey = default "ca.crt" (get $globalRemoteCARef "key") -}}
{{- end -}}
{{- $remoteControlPlane := dict
  "url" (default (default (get $legacyRemoteControlPlane "url") (get $globalRemoteControlPlane "endpoint")) (get $managementEndpointBootstrap "endpoint"))
  "caSecret" $remoteCASecret
  "caKey" $remoteCAKey
  "clusterID" (get $legacyRemoteControlPlane "clusterID")
-}}
{{- $remoteServerName := default "" (get $bootstrapTLS "serverName") -}}
{{- $legacyAgentBootstrapEndpoint := default "" (get .Values.env "ENVPILOT_AGENT_CONTROL_PLANE_URL") -}}
{{- $legacyAgentBootstrapRepository := default "" (get .Values.env "ENVPILOT_AGENT_IMAGE_REPOSITORY") -}}
{{- $legacyAgentBootstrapTag := default "" (get .Values.env "ENVPILOT_AGENT_IMAGE_TAG") -}}
{{- $legacyAgentBootstrapChartRef := default "" (get .Values.env "ENVPILOT_AGENT_HELM_CHART_REF") -}}
{{- $legacyAgentBootstrapChartVersion := default "" (get .Values.env "ENVPILOT_AGENT_HELM_CHART_VERSION") -}}
{{- $agentBootstrapEndpoint := default (printf "http://%s.%s.svc:%v" (include "envpilot-control-plane.fullname" .) .Release.Namespace .Values.service.port) (default $legacyAgentBootstrapEndpoint $agentBootstrap.controlPlaneURL) -}}
{{- $agentBootstrapRepository := default "ghcr.io/envpilot/agent" (default $legacyAgentBootstrapRepository $agentBootstrapImage.repository) -}}
{{- $agentBootstrapTag := default "0.1.4" (default $legacyAgentBootstrapTag $agentBootstrapImage.tag) -}}
{{- $agentBootstrapChartRef := default $legacyAgentBootstrapChartRef $agentBootstrapChart.ref -}}
{{- $agentBootstrapChartVersion := default $legacyAgentBootstrapChartVersion $agentBootstrapChart.version -}}
{{- $environment := omit (deepCopy .Values.env) "ENVPILOT_AGENT_CONTROL_PLANE_URL" "ENVPILOT_AGENT_IMAGE_REPOSITORY" "ENVPILOT_AGENT_IMAGE_TAG" "ENVPILOT_AGENT_HELM_CHART_REF" "ENVPILOT_AGENT_HELM_CHART_VERSION" -}}
{{- if eq $firstStartMode "existing" -}}
{{- $firstStartSecret = required "global.envpilot.firstStartRegistration.existingSecret is required when mode=existing" $firstStart.existingSecret -}}
{{- else if eq $firstStartMode "managed" -}}
{{- $firstStartSecret = default (printf "%s-first-start-registration" .Release.Name) $firstStart.secretName -}}
{{- end -}}
{{- $podAnnotations := mergeOverwrite (deepCopy (default (dict) .Values.podAnnotations)) (include "envpilot-control-plane.imageMetadata" . | fromYaml) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envpilot-control-plane.fullname" . }}
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "envpilot-control-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "envpilot-control-plane.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "envpilot-control-plane.serviceAccountName" . }}
      {{- $pullSecrets := include "envpilot-control-plane.imagePullSecrets" . }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{ $pullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.dependencyWait.enabled }}
      initContainers:
        {{- if eq $postgresMode "internal" }}
        - name: wait-postgres
          image: {{ include "envpilot-control-plane.postgresImage" . | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              until pg_isready -h {{ include "envpilot-control-plane.postgresName" . }} -p {{ .Values.postgres.service.port }} -U {{ .Values.postgres.auth.username | quote }} -d {{ .Values.postgres.auth.database | quote }}; do
                echo "waiting for postgres"
                sleep 2
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "envpilot-control-plane.postgresName" .) .Values.postgres.auth.existingSecret }}
                  key: {{ .Values.postgres.auth.passwordKey | quote }}
        {{- end }}
        {{- if eq $redisMode "internal" }}
        - name: wait-redis
          image: {{ include "envpilot-control-plane.redisImage" . | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              until redis-cli -h {{ include "envpilot-control-plane.redisName" . }} -p {{ .Values.redis.service.port }} ping | grep -q PONG; do
                echo "waiting for redis"
                sleep 2
              done
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "envpilot-control-plane.image" . | quote }}
          imagePullPolicy: {{ include "envpilot-control-plane.imagePullPolicy" . }}
          {{- if $platformDependencyStatusEnabled }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-platform-dependency-status" .Release.Name | quote }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- if $platformDependencyStatusEnabled }}
            # The declared contract comes from envFrom above. This separate,
            # read-only ConfigMap watch supplies observed reconciler state.
            - name: ENVPILOT_PLATFORM_DEPENDENCY_STATUS_CONFIG_MAP
              value: {{ $platformDependencyStatusConfigMap | quote }}
            - name: ENVPILOT_PLATFORM_DEPENDENCY_STATUS_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ENVPILOT_PLATFORM_DEPENDENCY_STATUS_STALE_AFTER_SECONDS
              value: {{ $platformDependencyStatusStaleAfter | quote }}
            {{- end }}
            # Bootstrap Agent instructions must use a pod-reachable endpoint,
            # never the browser ingress host. A remote target cluster sets the
            # explicit agentBootstrap.controlPlaneURL override.
            - name: ENVPILOT_AGENT_CONTROL_PLANE_URL
              value: {{ $agentBootstrapEndpoint | quote }}
            - name: ENVPILOT_AGENT_IMAGE_REPOSITORY
              value: {{ $agentBootstrapRepository | quote }}
            - name: ENVPILOT_AGENT_IMAGE_TAG
              value: {{ $agentBootstrapTag | quote }}
            - name: ENVPILOT_AGENT_HELM_CHART_REF
              value: {{ $agentBootstrapChartRef | quote }}
            - name: ENVPILOT_AGENT_HELM_CHART_VERSION
              value: {{ $agentBootstrapChartVersion | quote }}
            - name: ENVPILOT_RUNNER_COMMAND_LEASE_SECONDS
              value: {{ .Values.runnerCommand.leaseSeconds | quote }}
            - name: ENVPILOT_RUNNER_COMMAND_MAX_ATTEMPTS
              value: {{ .Values.runnerCommand.maxAttempts | quote }}
            - name: ENVPILOT_REMOTE_CLUSTER_RECONCILER_ENABLED
              value: {{ $remoteClusterReconcilerEnabled | quote }}
            {{- if $remoteClusterReconcilerEnabled }}
            # Always derive the normal leader-election namespace from the Pod,
            # not from a hard-coded default. This keeps the Lease and its
            # namespaced Role aligned when the umbrella is installed outside
            # the Kubernetes default namespace.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $leaderElectionNamespace }}
            - name: ENVPILOT_REMOTE_CLUSTER_RECONCILER_NAMESPACE
              value: {{ $leaderElectionNamespace | quote }}
            {{- end }}
            {{- end }}
            {{- if $executorReconcilerEnabled }}
            # OCI chart resolution must use the writable cache mounted below.
            # Same-cluster project executors use the same Helm SDK path as
            # remote executors and cannot write the image user's home.
            - name: HOME
              value: /tmp/envpilot-home
            - name: XDG_CACHE_HOME
              value: /tmp/envpilot-home/cache
            - name: XDG_CONFIG_HOME
              value: /tmp/envpilot-home/config
            {{- if $executorRegistrySecret }}
            # This read-only Docker config is consumed only by Helm's OCI
            # client. Registry credentials never enter project state or API.
            - name: HELM_REGISTRY_CONFIG
              value: /etc/envpilot/helm-registry/config.json
            {{- end }}
            {{- end }}
            {{- if $sameClusterProjectExecutorsEnabled }}
            - name: ENVPILOT_SAME_CLUSTER_PROJECT_EXECUTORS_ENABLED
              value: "true"
            - name: ENVPILOT_SAME_CLUSTER_PROJECT_EXECUTORS_NAMESPACE
              value: {{ $sameClusterProjectExecutorsNamespace | quote }}
            - name: ENVPILOT_SAME_CLUSTER_PROJECT_EXECUTORS_IMAGE_PULL_SECRET
              value: {{ $executorImagePullSecret | quote }}
            {{- end }}
            {{- if and $executorReconcilerEnabled $remoteCompatibilityConfigMap }}
            - name: ENVPILOT_REMOTE_CLUSTER_COMPATIBILITY_MANIFEST
              value: /etc/envpilot/compatibility/release.json
            {{- end }}
            {{- if $remoteControlPlane.clusterID }}
            - name: ENVPILOT_CONTROL_PLANE_CLUSTER_ID
              value: {{ $remoteControlPlane.clusterID | quote }}
            {{- end }}
            {{- if $remoteControlPlane.url }}
            - name: ENVPILOT_MANAGEMENT_ENDPOINT_BOOTSTRAP_URL
              value: {{ $remoteControlPlane.url | quote }}
            {{- if $remoteServerName }}
            - name: ENVPILOT_MANAGEMENT_ENDPOINT_BOOTSTRAP_TLS_SERVER_NAME
              value: {{ $remoteServerName | quote }}
            {{- end }}
            {{- end }}
            {{- if $remoteControlPlane.caSecret }}
            - name: ENVPILOT_MANAGEMENT_ENDPOINT_BOOTSTRAP_CA_SECRET
              value: {{ $remoteControlPlane.caSecret | quote }}
            - name: ENVPILOT_MANAGEMENT_ENDPOINT_BOOTSTRAP_CA_KEY
              value: {{ $remoteControlPlane.caKey | quote }}
            {{- end }}
            {{- if eq $postgresMode "internal" }}
            - name: ENVPILOT_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "envpilot-control-plane.postgresName" .) .Values.postgres.auth.existingSecret }}
                  key: {{ .Values.postgres.auth.passwordKey | quote }}
            - name: ENVPILOT_DATABASE_URL
              value: "postgres://{{ .Values.postgres.auth.username }}:$(ENVPILOT_POSTGRES_PASSWORD)@{{ include "envpilot-control-plane.postgresName" . }}:{{ .Values.postgres.service.port }}/{{ .Values.postgres.auth.database }}?sslmode=disable"
            {{- else if eq $postgresMode "external" }}
            - name: ENVPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.external.existingSecret is required when postgres.mode=external" .Values.postgres.external.existingSecret | quote }}
                  key: {{ .Values.postgres.external.urlKey | quote }}
            {{- end }}
            {{- if eq $redisMode "internal" }}
            - name: ENVPILOT_REDIS_URL
              value: "redis://{{ include "envpilot-control-plane.redisName" . }}:{{ .Values.redis.service.port }}/0"
            {{- else if eq $redisMode "external" }}
            - name: ENVPILOT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "redis.external.existingSecret is required when redis.mode=external" .Values.redis.external.existingSecret | quote }}
                  key: {{ .Values.redis.external.urlKey | quote }}
            {{- end }}
            {{- range $key, $value := $environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if ne $firstStartMode "disabled" }}
            - name: ENVPILOT_SAME_CLUSTER_REGISTRATION_ENABLED
              value: "true"
            - name: ENVPILOT_SAME_CLUSTER_PROJECT_ID
              value: {{ $firstStart.project.id | quote }}
            - name: ENVPILOT_SAME_CLUSTER_PROJECT_NAME
              value: {{ $firstStart.project.name | quote }}
            - name: ENVPILOT_SAME_CLUSTER_PRODUCT_ID
              value: {{ $firstStart.project.productId | quote }}
            - name: ENVPILOT_SAME_CLUSTER_APP_REPOSITORY_ID
              value: {{ $firstStart.project.appRepositoryId | quote }}
            - name: ENVPILOT_SAME_CLUSTER_GITOPS_REPOSITORY_ID
              value: {{ $firstStart.project.gitopsRepositoryId | quote }}
            - name: ENVPILOT_SAME_CLUSTER_CLUSTER_ID
              value: {{ $firstStart.cluster.id | quote }}
            - name: ENVPILOT_SAME_CLUSTER_AGENT_ID
              value: {{ $firstStart.agent.id | quote }}
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_ID
              value: {{ $firstStart.runner.id | quote }}
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_NAMESPACE
              value: {{ default .Release.Namespace $firstStart.runner.namespace | quote }}
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_DEPLOYMENT_MODE
              value: {{ $firstStart.runner.deploymentMode | quote }}
            - name: ENVPILOT_SAME_CLUSTER_REGISTRATION_TOKEN_TTL_SECONDS
              value: {{ $firstStart.tokenTTLSeconds | quote }}
            - name: ENVPILOT_SAME_CLUSTER_AGENT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $firstStartSecret | quote }}
                  key: agent-registration-token
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $firstStartSecret | quote }}
                  key: runner-registration-token
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_PROJECT_CONFIG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $firstStartSecret | quote }}
                  key: runner-project-config-token
            {{- end }}
            {{- if $e2eFixture.enabled }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_ENABLED
              value: "true"
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_RECOVERY_ENABLED
              value: {{ default false $e2eFixtureRecovery.enabled | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_BASE_NAMESPACE
              value: {{ $e2eFixture.baseNamespace | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_FEATURE_NAMESPACE
              value: {{ $e2eFixture.featureNamespace | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_CHART_REF
              value: {{ $e2eFixture.chartRef | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_CHART_VERSION
              value: {{ $e2eFixture.chartVersion | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_APP_REPOSITORY_URL
              value: {{ $e2eFixture.appRepositoryURL | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_GITOPS_REPOSITORY_URL
              value: {{ $e2eFixture.gitopsRepositoryURL | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_SCM_PROVIDER
              value: {{ $e2eFixture.scmProvider | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_APP_DEFAULT_BRANCH
              value: {{ $e2eFixture.appDefaultBranch | quote }}
            - name: ENVPILOT_SAME_CLUSTER_FIXTURE_GITOPS_DEFAULT_BRANCH
              value: {{ $e2eFixture.gitopsDefaultBranch | quote }}
            {{- end }}
            {{- if .Values.secretEnv }}
            {{- range $key, $_ := .Values.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "envpilot-control-plane.fullname" $ }}-env
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/envpilot/data
          {{- if and $executorReconcilerEnabled $remoteCompatibilityConfigMap }}
            - name: remote-cluster-compatibility
              mountPath: /etc/envpilot/compatibility
              readOnly: true
          {{- end }}
          {{- if $executorReconcilerEnabled }}
            - name: remote-cluster-helm-cache
              mountPath: /tmp/envpilot-home
          {{- end }}
          {{- if $executorRegistrySecret }}
            - name: executor-registry-config
              mountPath: /etc/envpilot/helm-registry
              readOnly: true
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "envpilot-control-plane.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- if and $executorReconcilerEnabled $remoteCompatibilityConfigMap }}
        - name: remote-cluster-compatibility
          configMap:
            name: {{ $remoteCompatibilityConfigMap | quote }}
      {{- end }}
      {{- if $executorReconcilerEnabled }}
        - name: remote-cluster-helm-cache
          emptyDir: {}
      {{- end }}
      {{- if $executorRegistrySecret }}
        - name: executor-registry-config
          secret:
            secretName: {{ $executorRegistrySecret | quote }}
            items:
              - key: .dockerconfigjson
                path: config.json
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
