{{- $postgresMode := default (ternary "internal" "disabled" .Values.postgres.enabled) .Values.postgres.mode -}}
{{- $redisMode := default (ternary "internal" "disabled" .Values.redis.enabled) .Values.redis.mode -}}
{{- $global := default (dict) .Values.global -}}
{{- $globalEnvPilot := default (dict) (get $global "envpilot") -}}
{{- $platformDependencyStatus := default (dict) (get $globalEnvPilot "platformDependencyStatus") -}}
{{- $platformDependencyStatusEnabled := default false $platformDependencyStatus.enabled -}}
{{- $firstStart := default (dict) (get $globalEnvPilot "firstStartRegistration") -}}
{{- $firstStartMode := default "disabled" $firstStart.mode -}}
{{- $firstStartSecret := "" -}}
{{- $agentBootstrap := default (dict) .Values.agentBootstrap -}}
{{- $agentBootstrapImage := default (dict) $agentBootstrap.image -}}
{{- $agentBootstrapChart := default (dict) $agentBootstrap.chart -}}
{{- $legacyAgentBootstrapEndpoint := default "" (get .Values.env "ENVPILOT_AGENT_CONTROL_PLANE_URL") -}}
{{- $legacyAgentBootstrapRepository := default "" (get .Values.env "ENVPILOT_AGENT_IMAGE_REPOSITORY") -}}
{{- $legacyAgentBootstrapTag := default "" (get .Values.env "ENVPILOT_AGENT_IMAGE_TAG") -}}
{{- $legacyAgentBootstrapChartRef := default "" (get .Values.env "ENVPILOT_AGENT_HELM_CHART_REF") -}}
{{- $legacyAgentBootstrapChartVersion := default "" (get .Values.env "ENVPILOT_AGENT_HELM_CHART_VERSION") -}}
{{- $agentBootstrapEndpoint := default (printf "http://%s.%s.svc:%v" (include "envpilot-control-plane.fullname" .) .Release.Namespace .Values.service.port) (default $legacyAgentBootstrapEndpoint $agentBootstrap.controlPlaneURL) -}}
{{- $agentBootstrapRepository := default "ghcr.io/envpilot/agent" (default $legacyAgentBootstrapRepository $agentBootstrapImage.repository) -}}
{{- $agentBootstrapTag := default "0.1.4" (default $legacyAgentBootstrapTag $agentBootstrapImage.tag) -}}
{{- $agentBootstrapChartRef := default $legacyAgentBootstrapChartRef $agentBootstrapChart.ref -}}
{{- $agentBootstrapChartVersion := default $legacyAgentBootstrapChartVersion $agentBootstrapChart.version -}}
{{- $environment := omit (deepCopy .Values.env) "ENVPILOT_AGENT_CONTROL_PLANE_URL" "ENVPILOT_AGENT_IMAGE_REPOSITORY" "ENVPILOT_AGENT_IMAGE_TAG" "ENVPILOT_AGENT_HELM_CHART_REF" "ENVPILOT_AGENT_HELM_CHART_VERSION" -}}
{{- if eq $firstStartMode "existing" -}}
{{- $firstStartSecret = required "global.envpilot.firstStartRegistration.existingSecret is required when mode=existing" $firstStart.existingSecret -}}
{{- else if eq $firstStartMode "managed" -}}
{{- $firstStartSecret = default (printf "%s-first-start-registration" .Release.Name) $firstStart.secretName -}}
{{- end -}}
{{- $podAnnotations := mergeOverwrite (deepCopy (default (dict) .Values.podAnnotations)) (include "envpilot-control-plane.imageMetadata" . | fromYaml) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envpilot-control-plane.fullname" . }}
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "envpilot-control-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "envpilot-control-plane.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "envpilot-control-plane.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.dependencyWait.enabled }}
      initContainers:
        {{- if eq $postgresMode "internal" }}
        - name: wait-postgres
          image: {{ include "envpilot-control-plane.postgresImage" . | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              until pg_isready -h {{ include "envpilot-control-plane.postgresName" . }} -p {{ .Values.postgres.service.port }} -U {{ .Values.postgres.auth.username | quote }} -d {{ .Values.postgres.auth.database | quote }}; do
                echo "waiting for postgres"
                sleep 2
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "envpilot-control-plane.postgresName" .) .Values.postgres.auth.existingSecret }}
                  key: {{ .Values.postgres.auth.passwordKey | quote }}
        {{- end }}
        {{- if eq $redisMode "internal" }}
        - name: wait-redis
          image: {{ include "envpilot-control-plane.redisImage" . | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              until redis-cli -h {{ include "envpilot-control-plane.redisName" . }} -p {{ .Values.redis.service.port }} ping | grep -q PONG; do
                echo "waiting for redis"
                sleep 2
              done
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "envpilot-control-plane.image" . | quote }}
          imagePullPolicy: {{ include "envpilot-control-plane.imagePullPolicy" . }}
          {{- if $platformDependencyStatusEnabled }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-platform-dependency-status" .Release.Name | quote }}
          {{- end }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # Bootstrap Agent instructions must use a pod-reachable endpoint,
            # never the browser ingress host. A remote target cluster sets the
            # explicit agentBootstrap.controlPlaneURL override.
            - name: ENVPILOT_AGENT_CONTROL_PLANE_URL
              value: {{ $agentBootstrapEndpoint | quote }}
            - name: ENVPILOT_AGENT_IMAGE_REPOSITORY
              value: {{ $agentBootstrapRepository | quote }}
            - name: ENVPILOT_AGENT_IMAGE_TAG
              value: {{ $agentBootstrapTag | quote }}
            - name: ENVPILOT_AGENT_HELM_CHART_REF
              value: {{ $agentBootstrapChartRef | quote }}
            - name: ENVPILOT_AGENT_HELM_CHART_VERSION
              value: {{ $agentBootstrapChartVersion | quote }}
            {{- if eq $postgresMode "internal" }}
            - name: ENVPILOT_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "envpilot-control-plane.postgresName" .) .Values.postgres.auth.existingSecret }}
                  key: {{ .Values.postgres.auth.passwordKey | quote }}
            - name: ENVPILOT_DATABASE_URL
              value: "postgres://{{ .Values.postgres.auth.username }}:$(ENVPILOT_POSTGRES_PASSWORD)@{{ include "envpilot-control-plane.postgresName" . }}:{{ .Values.postgres.service.port }}/{{ .Values.postgres.auth.database }}?sslmode=disable"
            {{- else if eq $postgresMode "external" }}
            - name: ENVPILOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.external.existingSecret is required when postgres.mode=external" .Values.postgres.external.existingSecret | quote }}
                  key: {{ .Values.postgres.external.urlKey | quote }}
            {{- end }}
            {{- if eq $redisMode "internal" }}
            - name: ENVPILOT_REDIS_URL
              value: "redis://{{ include "envpilot-control-plane.redisName" . }}:{{ .Values.redis.service.port }}/0"
            {{- else if eq $redisMode "external" }}
            - name: ENVPILOT_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "redis.external.existingSecret is required when redis.mode=external" .Values.redis.external.existingSecret | quote }}
                  key: {{ .Values.redis.external.urlKey | quote }}
            {{- end }}
            {{- range $key, $value := $environment }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if ne $firstStartMode "disabled" }}
            - name: ENVPILOT_SAME_CLUSTER_REGISTRATION_ENABLED
              value: "true"
            - name: ENVPILOT_SAME_CLUSTER_PROJECT_ID
              value: {{ $firstStart.project.id | quote }}
            - name: ENVPILOT_SAME_CLUSTER_PROJECT_NAME
              value: {{ $firstStart.project.name | quote }}
            - name: ENVPILOT_SAME_CLUSTER_PRODUCT_ID
              value: {{ $firstStart.project.productId | quote }}
            - name: ENVPILOT_SAME_CLUSTER_APP_REPOSITORY_ID
              value: {{ $firstStart.project.appRepositoryId | quote }}
            - name: ENVPILOT_SAME_CLUSTER_GITOPS_REPOSITORY_ID
              value: {{ $firstStart.project.gitopsRepositoryId | quote }}
            - name: ENVPILOT_SAME_CLUSTER_CLUSTER_ID
              value: {{ $firstStart.cluster.id | quote }}
            - name: ENVPILOT_SAME_CLUSTER_AGENT_ID
              value: {{ $firstStart.agent.id | quote }}
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_ID
              value: {{ $firstStart.runner.id | quote }}
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_NAMESPACE
              value: {{ default .Release.Namespace $firstStart.runner.namespace | quote }}
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_DEPLOYMENT_MODE
              value: {{ $firstStart.runner.deploymentMode | quote }}
            - name: ENVPILOT_SAME_CLUSTER_REGISTRATION_TOKEN_TTL_SECONDS
              value: {{ $firstStart.tokenTTLSeconds | quote }}
            - name: ENVPILOT_SAME_CLUSTER_AGENT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $firstStartSecret | quote }}
                  key: agent-registration-token
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $firstStartSecret | quote }}
                  key: runner-registration-token
            - name: ENVPILOT_SAME_CLUSTER_RUNNER_PROJECT_CONFIG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $firstStartSecret | quote }}
                  key: runner-project-config-token
            {{- end }}
            {{- if .Values.secretEnv }}
            {{- range $key, $_ := .Values.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "envpilot-control-plane.fullname" $ }}-env
                  key: {{ $key }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/envpilot/data
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "envpilot-control-plane.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
