{{- if and .Values.rbac .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "envpilot-control-plane.fullname" . }}-helm-direct
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "envpilot-control-plane.fullname" . }}-helm-direct
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "envpilot-control-plane.fullname" . }}-helm-direct
subjects:
  - kind: ServiceAccount
    name: {{ include "envpilot-control-plane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
