{{- $redisMode := default (ternary "internal" "disabled" .Values.redis.enabled) .Values.redis.mode -}}
{{- if eq $redisMode "internal" }}
{{- $name := printf "%s-redis-auth" (include "envpilot-control-plane.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if $existing }}
{{- $password = default "" (index $existing.data "password") -}}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
type: Opaque
data:
  password: {{ $password | quote }}
{{- end }}
