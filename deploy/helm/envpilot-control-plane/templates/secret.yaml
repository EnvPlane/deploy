{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envpilot-control-plane.fullname" . }}-env
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
# Empty container for future installation-wide authentication state. Helm owns
# its lifecycle; neither this chart nor the control plane writes credentials
# during install. The name is fixed to this release unless a safe DNS-label
# override is supplied.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envpilot-control-plane.authenticationManagedSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: authentication
    envpilot.io/managed-secret: authentication
  annotations:
    envpilot.io/purpose: authentication-managed-store
type: Opaque
{{- $postgresMode := default (ternary "internal" "disabled" .Values.postgres.enabled) .Values.postgres.mode -}}
{{- if and (eq $postgresMode "internal") (not .Values.postgres.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envpilot-control-plane.postgresName" . }}
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  {{ .Values.postgres.auth.passwordKey }}: {{ required "postgres.auth.password or postgres.auth.existingSecret is required" .Values.postgres.auth.password | quote }}
{{- end }}
