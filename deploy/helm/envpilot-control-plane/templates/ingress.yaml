{{- if .Values.ingress.enabled -}}
{{- $domain := required "ingress.domain is required when ingress is enabled" .Values.ingress.domain -}}
{{- $tlsHosts := .Values.ingress.tls.hosts | default (list $domain) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "envpilot-control-plane.fullname" . }}
  labels:
    {{- include "envpilot-control-plane.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.certManager.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certManager.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $tlsHosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "envpilot-control-plane.fullname" .)) }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ default $domain .host | quote }}
      http:
        paths:
          {{- range $.Values.ingress.apiPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "envpilot-control-plane.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if $.Values.frontend.enabled }}
                name: {{ include "envpilot-control-plane.fullname" $ }}-frontend
                {{- else }}
                name: {{ include "envpilot-control-plane.fullname" $ }}
                {{- end }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
