replicaCount: 1

image:
  repository: ghcr.io/envpilot/api
  pullPolicy: IfNotPresent
  tag: "0.1.6"
  # When set, digest takes precedence over tag.
  digest: ""
  # Optional immutable build metadata rendered on the Pod template. CI sets
  # these independently from the image reference so operators can trace a
  # running workload back to its source revision and release.
  sourceRevision: ""
  release: ""

frontend:
  enabled: true
  # The control-plane chart consumes the canonical envpilot-frontend child
  # chart. These values preserve the existing standalone release resource
  # names and immutable selectors during an in-place upgrade from <= 0.1.x.
  fullnameOverride: envpilot-control-plane-frontend
  legacyControlPlaneSelector: true
  # Used by ingress.yaml; it must match fullnameOverride above.
  serviceName: envpilot-control-plane-frontend

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

command: []
args: []

service:
  type: ClusterIP
  port: 8080
  nodePort: null

ingress:
  enabled: false
  # Configure domain, className and provider-specific annotations explicitly
  # in an environment values file. The chart has no platform routing default.
  domain: ""
  className: ""
  annotations: {}
  certManager:
    enabled: false
    clusterIssuer: selfsigned-cluster-issuer
  apiPaths:
    - path: /api
      pathType: Prefix
    - path: /auth
      pathType: Prefix
    - path: /webhook
      pathType: Prefix
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: false
    secretName: envpilot-tls
    hosts: []

env:
  ENVPILOT_API_CONTRACT_VERSION: "1"
  ENVPILOT_ADDR: ":8080"
  ENVPILOT_DATA_DIR: "/var/lib/envpilot/data"
  ENVPILOT_GITOPS_DIR: "/var/lib/envpilot/data/gitops"
  ENVPILOT_POSTGRES_MIGRATIONS_DIR: "/var/lib/envpilot/migrations/postgres"
  ENVPILOT_GITHUB_WEBHOOK_DEBUG_PAYLOAD_LOG: "false"
  ENVPILOT_DEPENDENCY_WAIT_TIMEOUT_SECONDS: "120"
  ENVPILOT_DEPENDENCY_WAIT_INTERVAL_SECONDS: "2"

# A claimed Runner command has a bounded lease. On expiry the control plane
# requeues it with a new attempt ID; after maxAttempts delete becomes a visible
# retryable failure rather than an indefinitely claimed record.
runnerCommand:
  leaseSeconds: 120
  maxAttempts: 3

# Endpoint and image used in generated bootstrap Agent instructions. An empty
# endpoint resolves at render time to this chart's Service FQDN in the release
# namespace (for example http://envpilot-control-plane.envpilot.svc:8080).
# Set controlPlaneURL explicitly only for a remote Agent cluster.
agentBootstrap:
  controlPlaneURL: ""
  image:
    repository: ghcr.io/envpilot/agent
    tag: "0.1.4"
  # Standalone control-plane installs must explicitly provide a remote Agent
  # chart contract. The umbrella injects its signed release-compatible child
  # chart version into these fields.
  chart:
    ref: ""
    version: ""

# Deprecated compatibility bootstrap source. The umbrella's
# managementEndpointProfile.bootstrap is preferred and is migrated once into
# the API/UI-managed singleton profile; it is never RemoteCluster config.
remoteControlPlane:
  url: ""
  caSecret: ""
  caKey: ca.crt
  clusterID: ""

dependencyWait:
  enabled: true

secretEnv: {}

# Commercialization settings use the canonical EnvPlane aliases. Legacy
# ENVPILOT_* variables remain accepted by the application for upgrades.
commercialization:
  billing:
    provider: ""
    baseURL: ""
    apiKeySecretRef:
      name: ""
      key: api-key
    webhookSecretRef:
      name: ""
      key: webhook-secret
  license:
    publicKeysJSON: "{}"
    graceDays: 14

postgres:
  # Empty preserves legacy postgres.enabled semantics. Set explicitly to
  # internal, external or disabled for the provider-neutral umbrella contract.
  mode: ""
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
    digest: ""
  auth:
    database: envpilot
    username: envpilot
    password: envpilot
    existingSecret: ""
    passwordKey: password
  service:
    port: 5432
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
  external:
    # existingSecret must contain a complete PostgreSQL connection URL.
    existingSecret: ""
    urlKey: database-url
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  # Empty preserves legacy redis.enabled semantics. Set explicitly to
  # internal, external or disabled for the provider-neutral umbrella contract.
  mode: ""
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
    digest: ""
  service:
    port: 6379
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  external:
    # existingSecret must contain a complete Redis connection URL.
    existingSecret: ""
    urlKey: redis-url
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  annotations: {}
  # Namespace-scoped read-only access used only when the control plane resolves
  # Kubernetes/external-secret references. Empty means this release namespace.
  # Add namespaces deliberately; no ClusterRole is created by this chart.
  secretReader:
    enabled: true
    namespaces: []
  # Management-cluster Secret access used exclusively by the RemoteCluster API.
  # It can create/update only explicitly referenced credential Secrets; no
  # ConfigMap or cluster-wide secret permission is granted.
  remoteClusterCredentials:
    enabled: false
    namespaces: []
  remoteClusterReconciler:
    enabled: false
  # Allows the control plane to reconcile project-owned Agent/Runner releases
  # only inside this pre-existing namespace. It never creates a ClusterRole.
  sameClusterProjectExecutors:
    enabled: false
    namespace: ""
    # Finite operator-approved base namespaces. Project Agents use named
    # namespace GETs and namespaced Roles for this list; empty intentionally
    # keeps discovery blocked until an allowlist is configured.
    discovery:
      namespaces: []

remoteClusterReconciler:
  compatibilityConfigMapName: ""
  # Empty uses POD_NAMESPACE from the Downward API. Set only when an operator
  # intentionally keeps the leader-election Lease in another namespace; the
  # chart creates the matching namespaced Role and RoleBinding there.
  leaderElection:
    namespace: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
