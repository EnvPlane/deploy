# Overrides for running the EnvPilot control plane in a local minikube cluster.
# Images are built directly inside the minikube docker daemon, so nothing is
# pulled from GHCR and no image pull secret is required.

image:
  repository: envpilot/api
  tag: local
  pullPolicy: Never

frontend:
  enabled: true
  image:
    repository: envpilot/frontend
    tag: local
    pullPolicy: Never
  env:
    # Same-origin: the ingress routes /api, /auth and /webhook to the API service.
    NEXT_PUBLIC_ENVPILOT_API_BASE_URL: ""
    ENVPILOT_API_INTERNAL_URL: "http://envpilot-control-plane:8080"

imagePullSecrets: []

# The browser reaches the control plane through envpilot.local, but pods in a
# second minikube profile cannot. scripts/minikube-agent-access.sh exposes the
# API on this host gateway and serves the packaged local agent chart.
env:
  ENVPILOT_AGENT_CONTROL_PLANE_URL: "http://host.minikube.internal:18080"
  ENVPILOT_AGENT_HELM_CHART_REF: "http://127.0.0.1:18081/envpilot-agent-0.1.0.tgz"
  ENVPILOT_AGENT_HELM_CHART_VERSION: ""
  ENVPILOT_AGENT_IMAGE_REPOSITORY: "envpilot/api"
  ENVPILOT_AGENT_IMAGE_TAG: "local"
  ENVPILOT_AGENT_IMAGE_PULL_POLICY: "Never"

ingress:
  enabled: true
  domain: envpilot.local
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  tls:
    enabled: false

dependencyWait:
  enabled: true

postgres:
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: standard

redis:
  persistence:
    enabled: true
    size: 512Mi
    storageClassName: standard
