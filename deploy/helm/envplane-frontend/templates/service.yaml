apiVersion: v1
kind: Service
metadata:
  name: {{ include "envplane-frontend.fullname" . }}
  labels:
    {{- include "envplane-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "envplane-frontend.selectorLabels" . | nindent 4 }}
