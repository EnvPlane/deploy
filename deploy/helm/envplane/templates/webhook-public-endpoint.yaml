{{- if .Values.webhook.enabled }}
{{- $endpoint := default dict .Values.webhook.publicEndpoint -}}
{{- $mode := lower (default "local" $endpoint.mode) -}}
{{- $url := trim (default "" $endpoint.url) -}}
{{- $host := trim (default "" $endpoint.host) -}}
{{- $tls := default dict $endpoint.tls -}}
{{- $statusName := printf "%s-webhook-receiver-status" .Release.Name -}}
{{- $existingStatus := lookup "v1" "ConfigMap" .Release.Namespace $statusName -}}
{{- $existingStatusData := default dict (get $existingStatus "data") -}}
{{- if and (ne $mode "local") (ne $mode "ingress") (ne $mode "external") }}
{{- fail "webhook.publicEndpoint.mode must be local, ingress, or external" }}
{{- end }}
{{- if and (eq $mode "external") (not $url) }}{{- fail "webhook.publicEndpoint.url is required when mode=external" }}{{- end }}
{{- if eq $mode "ingress" }}
{{- if not $host }}{{- fail "webhook.publicEndpoint.host is required when mode=ingress" }}{{- end }}
{{- if not (trim (default "" $tls.secretName)) }}{{- fail "webhook.publicEndpoint.tls.secretName is required when mode=ingress" }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-webhook-receiver
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: webhook-receiver
  {{- with $endpoint.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $endpoint.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $tls.secretName | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: envplane-webhook
                port:
                  name: http
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $statusName }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: webhook-receiver
data:
  # See control-plane/docs/adr/20260909-webhook-readiness-proof-source.md.
  # Helm declares endpoint configuration and initial observed state. An external
  # controller may update the observed-state fields; EnvPlane never writes them.
  # They are diagnostic-only. Compile gating uses the per-project delivery proof.
  ENVPLANE_WEBHOOK_RECEIVER_MODE: {{ $mode | quote }}
  ENVPLANE_WEBHOOK_RECEIVER_PUBLIC_URL: {{- if eq $mode "ingress" }} {{ printf "https://%s" $host | quote }}{{- else if eq $mode "external" }} {{ $url | quote }}{{- else }} ""{{- end }}
  ENVPLANE_WEBHOOK_RECEIVER_INGRESS_STATE: {{ default (ternary "pending" (ternary "external" "not_configured" (eq $mode "external")) (eq $mode "ingress")) (get $existingStatusData "ENVPLANE_WEBHOOK_RECEIVER_INGRESS_STATE") | quote }}
  ENVPLANE_WEBHOOK_RECEIVER_DNS_STATE: {{ default "unknown" (get $existingStatusData "ENVPLANE_WEBHOOK_RECEIVER_DNS_STATE") | quote }}
  ENVPLANE_WEBHOOK_RECEIVER_TLS_STATE: {{ default (ternary "pending" (ternary "external" "not_applicable" (eq $mode "external")) (eq $mode "ingress")) (get $existingStatusData "ENVPLANE_WEBHOOK_RECEIVER_TLS_STATE") | quote }}
  ENVPLANE_WEBHOOK_RECEIVER_RUNTIME_STATE: {{ default (ternary "unknown" "external" (eq $mode "external")) (get $existingStatusData "ENVPLANE_WEBHOOK_RECEIVER_RUNTIME_STATE") | quote }}
  ENVPLANE_WEBHOOK_RECEIVER_READINESS: {{ default (ternary "pending" (ternary "external" "public_endpoint_required" (eq $mode "external")) (eq $mode "ingress")) (get $existingStatusData "ENVPLANE_WEBHOOK_RECEIVER_READINESS") | quote }}
  ENVPLANE_WEBHOOK_RECEIVER_OBSERVED_AT: {{ default "" (get $existingStatusData "ENVPLANE_WEBHOOK_RECEIVER_OBSERVED_AT") | quote }}
{{- end }}
