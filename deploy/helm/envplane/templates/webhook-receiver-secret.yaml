{{- if .Values.webhook.enabled }}
{{- $name := "envplane-webhook-receiver" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: webhook-receiver
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  receiver-token: {{- if and $existing (index $existing.data "receiver-token") }} {{ index $existing.data "receiver-token" }}{{ else }} {{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}
