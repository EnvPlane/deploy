{{- if eq (include "envplane.platformReconcilerEnabled" .) "true" }}
{{- $r := .Values.platformDependencyReconciler -}}
{{- $dependencies := include "envplane.effectivePlatformDependencies" . | fromJson -}}
{{- $sa := default (printf "%s-platform-reconciler" .Release.Name) $r.serviceAccount.name -}}
{{- $ingress := index $dependencies "ingress" -}}
{{- $ingressNginxManaged := and (or (eq (default "disabled" $ingress.mode) "auto") (eq (default "disabled" $ingress.mode) "managed")) (eq (default "" $ingress.provider) "nginx") -}}
{{- $ingressInstallerSA := default (printf "%s-ingress-installer" .Release.Name) $r.ingressInstaller.serviceAccount.name -}}
{{- $statusConfigMap := include "envplane.platformReconcilerStatusConfigMapName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-platform-reconciler-discovery
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # The namespace setup hook needs only to create provider namespaces. Secret
  # discovery remains isolated to the short-lived ingress installer below.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create"]
  {{- range $name := list "ingress" "dns" "storage" }}
  {{- $dependency := index $dependencies $name -}}
  {{- if and (or (eq (default "disabled" $dependency.mode) "auto") (eq (default "disabled" $dependency.mode) "managed")) $dependency.managed.rbacRules }}
  {{- range $rule := $dependency.managed.rbacRules }}
  - apiGroups: {{ toJson (default (list) $rule.apiGroups) }}
    resources: {{ toJson (default (list) $rule.resources) }}
    verbs: {{ toJson (default (list) $rule.verbs) }}
  {{- end }}
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-platform-reconciler-discovery
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-platform-reconciler-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if $ingressNginxManaged }}
---
# This identity is used only by the post-install/post-upgrade ingress-nginx
# hook. The regular platform reconciler intentionally has no Secret list/watch
# permission; these mirrored controller permissions are isolated here because
# Kubernetes requires them during delegated ClusterRole creation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $ingressInstallerSA }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress-installer
    app.kubernetes.io/managed-by: Helm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-platform-ingress-installer
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress-installer
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    resourceNames: ["{{ default (printf "%s-ingress-nginx" .Release.Name) $ingress.managed.releaseName }}", "{{ default (printf "%s-ingress-nginx" .Release.Name) $ingress.managed.releaseName }}-admission"]
    verbs: ["get", "update", "patch", "delete"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # These read/event permissions mirror the pinned ingress-nginx controller
  # contract and are granted only to this short-lived installer identity.
  - apiGroups: [""]
    resources: ["nodes", "services", "configmaps", "pods", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingresses/status"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-platform-ingress-installer
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress-installer
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-platform-ingress-installer
subjects:
  - kind: ServiceAccount
    name: {{ $ingressInstallerSA }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-platform-ingress-installer-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress-installer
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ .Release.Name }}-platform-dependency-reconciler"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-platform-ingress-installer-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingress-installer
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-platform-ingress-installer-config
subjects:
  - kind: ServiceAccount
    name: {{ $ingressInstallerSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-platform-reconciler-status
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    # The reconciler config and its revision-scoped (or operator-supplied)
    # observed-status map are named explicitly. Do not grant broad ConfigMap
    # create/delete permission.
    resourceNames: ["{{ .Release.Name }}-platform-dependency-reconciler", "{{ $statusConfigMap }}"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-platform-reconciler-status
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-platform-reconciler-status
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- $ingress := index $dependencies "ingress" -}}
{{- if and (or (eq (default "disabled" $ingress.mode) "auto") (eq (default "disabled" $ingress.mode) "managed")) (eq (default "" $ingress.provider) "nginx") }}
---
# Helm creates these namespaced resources while installing ingress-nginx. The
# Role is deliberately limited to the configured provider namespace and is
# bound to the short-lived ingress installer ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-platform-reconciler-ingress-installer
  namespace: {{ required "ingress namespace is required for nginx provider" $ingress.namespace }}
  annotations:
    # The provider namespace may not exist until the preceding namespace Job
    # completes. Keep this short-lived RBAC as a post-install hook; it is
    # deleted after the reconciler completes and is never release residue.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "events", "pods", "secrets", "serviceaccounts", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-platform-reconciler-ingress-installer
  namespace: {{ required "ingress namespace is required for nginx provider" $ingress.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-platform-reconciler-ingress-installer
subjects:
  - kind: ServiceAccount
    name: {{ $ingressInstallerSA }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
