{{- /*
Remove only support objects left by the pre-0.3.46 hook implementation. Those
objects were not tracked by Helm, so a normal manifest with the same name would
otherwise make a clean reinstall fail ownership validation. Each migration hook
is rendered only when lookup finds a resource without Helm's ownership label.
The hook's before-hook-creation policy deletes the legacy object, then its
hook-succeeded/hook-failed policy bounds the temporary replacement. Normal
templates subsequently create the release-owned replacement.
*/ -}}
{{- if eq (include "envplane.platformReconcilerEnabled" .) "true" }}
{{- $r := .Values.platformDependencyReconciler -}}
{{- $dependencies := include "envplane.effectivePlatformDependencies" . | fromJson -}}
{{- $sa := default (printf "%s-platform-reconciler" .Release.Name) $r.serviceAccount.name -}}
{{- $hookAnnotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded,hook-failed" -}}
{{- $legacy := dict "app.kubernetes.io/name" "envplane" "app.kubernetes.io/component" "platform-reconciler-migration" -}}
{{- $isLegacy := dict -}}
{{- $check := list
    (dict "apiVersion" "v1" "kind" "ServiceAccount" "namespace" .Release.Namespace "name" $sa)
    (dict "apiVersion" "v1" "kind" "ConfigMap" "namespace" .Release.Namespace "name" (printf "%s-platform-dependency-reconciler" .Release.Name))
    (dict "apiVersion" "v1" "kind" "ConfigMap" "namespace" .Release.Namespace "name" (printf "%s-platform-dependency-reconciler-status" .Release.Name))
    (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "ClusterRole" "namespace" "" "name" (printf "%s-platform-reconciler-discovery" .Release.Name))
    (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "ClusterRoleBinding" "namespace" "" "name" (printf "%s-platform-reconciler-discovery" .Release.Name))
    (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "Role" "namespace" .Release.Namespace "name" (printf "%s-platform-reconciler-status" .Release.Name))
    (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "RoleBinding" "namespace" .Release.Namespace "name" (printf "%s-platform-reconciler-status" .Release.Name))
  -}}
{{- $ingress := index $dependencies "ingress" -}}
{{- if and (or (eq (default "disabled" $ingress.mode) "auto") (eq (default "disabled" $ingress.mode) "managed")) (eq (default "" $ingress.provider) "nginx") -}}
  {{- $check = append $check (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "Role" "namespace" $ingress.namespace "name" (printf "%s-platform-reconciler-ingress-installer" .Release.Name)) -}}
  {{- $check = append $check (dict "apiVersion" "rbac.authorization.k8s.io/v1" "kind" "RoleBinding" "namespace" $ingress.namespace "name" (printf "%s-platform-reconciler-ingress-installer" .Release.Name)) -}}
{{- end -}}
{{- range $item := $check -}}
  {{- $object := lookup $item.apiVersion $item.kind $item.namespace $item.name -}}
  {{- $metadata := default (dict) (get (default (dict) $object) "metadata") -}}
  {{- $labels := default (dict) (get $metadata "labels") -}}
  {{- if and $object (ne (default "" (get $labels "app.kubernetes.io/managed-by")) "Helm") -}}
    {{- $_ := set $isLegacy (printf "%s/%s/%s" $item.kind $item.namespace $item.name) true -}}
  {{- end -}}
{{- end -}}
{{- if get $isLegacy (printf "ServiceAccount/%s/%s" .Release.Namespace $sa) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
{{- end }}
{{- if get $isLegacy (printf "ConfigMap/%s/%s" .Release.Namespace (printf "%s-platform-dependency-reconciler" .Release.Name)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-platform-dependency-reconciler
  namespace: {{ .Release.Namespace }}
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
data: {}
{{- end }}
{{- if get $isLegacy (printf "ConfigMap/%s/%s" .Release.Namespace (printf "%s-platform-dependency-reconciler-status" .Release.Name)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-platform-dependency-reconciler-status
  namespace: {{ .Release.Namespace }}
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
data: {}
{{- end }}
{{- if get $isLegacy (printf "ClusterRole//%s" (printf "%s-platform-reconciler-discovery" .Release.Name)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-platform-reconciler-discovery
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
rules: []
{{- end }}
{{- if get $isLegacy (printf "ClusterRoleBinding//%s" (printf "%s-platform-reconciler-discovery" .Release.Name)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-platform-reconciler-discovery
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-platform-reconciler-discovery
subjects: []
{{- end }}
{{- if get $isLegacy (printf "Role/%s/%s" .Release.Namespace (printf "%s-platform-reconciler-status" .Release.Name)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-platform-reconciler-status
  namespace: {{ .Release.Namespace }}
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
rules: []
{{- end }}
{{- if get $isLegacy (printf "RoleBinding/%s/%s" .Release.Namespace (printf "%s-platform-reconciler-status" .Release.Name)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-platform-reconciler-status
  namespace: {{ .Release.Namespace }}
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-platform-reconciler-status
subjects: []
{{- end }}
{{- if and (or (eq (default "disabled" $ingress.mode) "auto") (eq (default "disabled" $ingress.mode) "managed")) (eq (default "" $ingress.provider) "nginx") }}
  {{- $roleKey := printf "Role/%s/%s" $ingress.namespace (printf "%s-platform-reconciler-ingress-installer" .Release.Name) -}}
  {{- $bindingKey := printf "RoleBinding/%s/%s" $ingress.namespace (printf "%s-platform-reconciler-ingress-installer" .Release.Name) -}}
  {{- if get $isLegacy $roleKey }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-platform-reconciler-ingress-installer
  namespace: {{ $ingress.namespace }}
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
rules: []
  {{- end }}
  {{- if get $isLegacy $bindingKey }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-platform-reconciler-ingress-installer
  namespace: {{ $ingress.namespace }}
  annotations: {{ toYaml $hookAnnotations | nindent 4 }}
  labels: {{ toYaml $legacy | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-platform-reconciler-ingress-installer
subjects: []
  {{- end }}
{{- end }}
{{- end }}
