{{- $global := default (dict) .Values.global -}}
{{- $envplane := include "envplane.globalConfig" . | fromJson -}}
{{- $registry := default (dict) (get $envplane "registry") -}}
{{- $preflight := default (dict) (get $registry "preflight") -}}
{{- if and (eq (default "disabled" $registry.mode) "existing") (default true $preflight.enabled) }}
{{- $secretName := required "global.envplane.registry.existingSecret is required when registry.mode=existing" $registry.existingSecret -}}
{{- $image := default (dict) $preflight.image -}}
{{- $imageRef := printf "%s:%s" (default "busybox" $image.repository) (default "1.36" $image.tag) -}}
{{- if $image.digest }}{{- $imageRef = printf "%s@%s" (default "busybox" $image.repository) $image.digest -}}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-registry-preflight
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: registry-preflight
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envplane
        app.kubernetes.io/component: registry-preflight
    spec:
      restartPolicy: Never
      {{- $pullSecrets := include "envplane.registryImagePullSecrets" . }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{ $pullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: validate
          image: {{ $imageRef | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - test -s /registry-auth/.dockerconfigjson || { echo "registry Secret {{ $secretName }} is missing or empty" >&2; exit 1; }
          volumeMounts:
            - name: registry-auth
              mountPath: /registry-auth
              readOnly: true
      volumes:
        - name: registry-auth
          secret:
            secretName: {{ $secretName | quote }}
            items:
              - key: .dockerconfigjson
                path: .dockerconfigjson
{{- end }}
