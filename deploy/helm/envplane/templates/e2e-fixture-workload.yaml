{{- $global := default (dict) .Values.global -}}
{{- $envplane := include "envplane.globalConfig" . | fromJson -}}
{{- $fixture := default (dict) (get $envplane "e2eFixture") -}}
{{- if $fixture.enabled }}
{{- $baseNamespace := required "global.envplane.e2eFixture.baseNamespace is required when the E2E fixture is enabled" $fixture.baseNamespace -}}
{{- $featureNamespace := required "global.envplane.e2eFixture.featureNamespace is required when the E2E fixture is enabled" $fixture.featureNamespace -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $baseNamespace | quote }}
  labels:
    app.kubernetes.io/part-of: envplane
    envplane.io/e2e-fixture: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $featureNamespace | quote }}
  labels:
    app.kubernetes.io/part-of: envplane
    envplane.io/e2e-fixture: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-base-workload
  namespace: {{ $baseNamespace | quote }}
  labels:
    app.kubernetes.io/name: e2e-base-workload
    app.kubernetes.io/part-of: envplane
    envplane.io/e2e-fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-base-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-base-workload
        envplane.io/e2e-fixture: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: workload
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-base-workload
  namespace: {{ $baseNamespace | quote }}
  labels:
    app.kubernetes.io/name: e2e-base-workload
    app.kubernetes.io/part-of: envplane
    envplane.io/e2e-fixture: "true"
spec:
  selector:
    app.kubernetes.io/name: e2e-base-workload
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
