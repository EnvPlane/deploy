{{- $global := default (dict) .Values.global -}}
{{- $envplane := include "envplane.globalConfig" . | fromJson -}}
{{- $registration := default (dict) (get $envplane "firstStartRegistration") -}}
{{- if eq (default "disabled" $registration.mode) "managed" }}
{{- $name := include "envplane.firstStartRegistrationSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: envplane
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: first-start-registration
type: Opaque
data:
  agent-registration-token: {{- if and $existing (index $existing.data "agent-registration-token") }} {{ index $existing.data "agent-registration-token" }}{{ else }} {{ randAlphaNum 48 | b64enc }}{{ end }}
  runner-registration-token: {{- if and $existing (index $existing.data "runner-registration-token") }} {{ index $existing.data "runner-registration-token" }}{{ else }} {{ randAlphaNum 48 | b64enc }}{{ end }}
  runner-project-config-token: {{- if and $existing (index $existing.data "runner-project-config-token") }} {{ index $existing.data "runner-project-config-token" }}{{ else }} {{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
