# Requests public ingress access. The umbrella first reuses a healthy existing
# IngressClass/nginx; when it is absent, its platform dependency reconciler
# installs the pinned ingress-nginx provider and verifies its controller.
access:
  mode: ingress
  ingress:
    host: envplane.example.invalid
    className: nginx
    tls:
      enabled: true
      secretName: envplane-access-tls
global:
  envplane:
    registry:
      mode: existing
      existingSecret: envplane-registry
platformDependencies:
  # Leave ingress disabled here so the access profile can auto-detect nginx
  # and install the pinned provider only when the class is absent.
  ingress: { mode: disabled }
  dns: { mode: disabled }
  storage: { mode: disabled }
