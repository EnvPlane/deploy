# Generic Kubernetes: internal ClusterIP services only.
access:
  mode: disabled
platformDependencies:
  ingress: { mode: disabled }
  dns: { mode: disabled }
  storage: { mode: disabled }
envplane-control-plane:
  service: { type: ClusterIP, port: 8080 }
envplane-frontend:
  service: { type: ClusterIP, port: 3000 }
