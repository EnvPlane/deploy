# Test-only profile for a published one-umbrella install on an already
# provisioned local Kubernetes cluster. It does not create a cluster, ingress,
# DNS or StorageClass. The profile enables an idempotent disposable fixture so
# browser/API E2E can verify a positive Full-environment lifecycle.
agent:
  enabled: true
runner:
  enabled: true

envplane-control-plane:
  # The disposable browser gate reaches the UI through a fixed loopback
  # port-forward. Keep this exception in the dedicated local profile; normal
  # releases retain HTTPS and secure session cookies.
  allowInsecureLocalDevelopment: true
  publicURL: "http://127.0.0.1:13000"
  env:
    ENVPLANE_OAUTH_COOKIE_SECURE: "false"
    ENVPLANE_PUBLIC_URL_ALLOW_HTTP_LOCAL_DEVELOPMENT: "true"
    # The disposable browser gate validates anonymous local first-run. This
    # never belongs in a normal release values file.
    ENVPLANE_INSECURE_ALLOW_ANONYMOUS_API: "true"
  rbac:
    # Explicit consent for the current-cluster wizard path. The generated
    # ClusterRole can only read namespace, ingress-class, and storage-class
    # metadata; it grants no workload or Secret access.
    currentClusterDiscovery:
      enabled: true
  postgres:
    # Disposable local E2E profile: no PostgreSQL TLS CA Secret is provisioned.
    tls:
      enabled: false

global:
  envplane:
    firstStartRegistration:
      mode: managed
      project:
        id: envplane-e2e-fixture
        name: EnvPlane E2E fixture
        productId: generic
        appRepositoryId: github.com/envplane/envplane-e2e-workload
        gitopsRepositoryId: github.com/envplane/deploy
      cluster:
        id: local-e2e
      agent:
        id: envplane-e2e-agent
      runner:
        id: envplane-e2e-runner
        namespace: envplane
        deploymentMode: helm
    e2eFixture:
      enabled: true
      recovery:
        enabled: true
      baseNamespace: envplane-e2e-base
      featureNamespace: envplane-e2e-feature
      chartRef: oci://ghcr.io/envplane/envplane-e2e-workload
      chartVersion: "0.1.0"
      appRepositoryURL: https://github.com/envplane/envplane-e2e-workload
      gitopsRepositoryURL: https://github.com/envplane/deploy
      scmProvider: github
      appDefaultBranch: main
      gitopsDefaultBranch: main

envplane-agent:
  dependencyWait:
    connectivity:
      maxAttempts: 30
      initialBackoffSeconds: 2
      maxBackoffSeconds: 5
      deadlineSeconds: 300
  rbac:
    discovery:
      # Namespace objects are cluster-scoped. Permit only metadata GETs for
      # the selected namespaces; the Agent never receives namespace list or
      # watch access in this disposable profile.
      namespaceMetadataRead: true
      namespaces:
        - envplane-e2e-base
        - envplane-e2e-feature
  controlPlane:
    endpointMode: sameCluster
    serviceName: envplane-control-plane
    namespace: envplane
    port: 8080
    # The disposable Kind profile reaches the in-cluster HTTP Service. Remote
    # Agent installations retain the chart's HTTPS-only default.
    allowInsecure: true
  watch:
    namespaces:
      - envplane-e2e-base
  agent:
    authPersistence:
      createClaim: true

envplane-runner:
  dependencyWait:
    connectivity:
      maxAttempts: 30
      initialBackoffSeconds: 2
      maxBackoffSeconds: 5
      deadlineSeconds: 300
  controlPlane:
    endpointMode: sameCluster
    serviceName: envplane-control-plane
    namespace: envplane
    port: 8080
    authPersistence:
      createClaim: true
  project:
    configUrl: http://envplane-control-plane.envplane.svc:8080/api/v1/projects/envplane-e2e-fixture/runner-config
  rbac:
    featureEnvWriter:
      mode: preconfiguredNamespaces
      namespaces:
        - envplane-e2e-feature
