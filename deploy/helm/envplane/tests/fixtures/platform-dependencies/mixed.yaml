platformDependencies:
  ingress: {mode: existing, provider: nginx, existingClassName: nginx}
  dns:
    mode: managed
    provider: external-dns
    ownership: envplane
    credentials: {existingSecret: dns-credentials}
    domainFilters: [example.test]
    ownershipId: envplane
    policy: sync
    managed:
      chartRef: oci://ghcr.io/kubernetes-sigs/external-dns/external-dns
      version: 1.15.0
      releaseName: envplane-external-dns
  storage: {mode: existing, existingClassName: standard}
