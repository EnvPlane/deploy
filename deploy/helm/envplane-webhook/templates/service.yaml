apiVersion: v1
kind: Service
metadata:
  name: {{ include "envplane-webhook.fullname" . }}
  labels:
    {{- include "envplane-webhook.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "envplane-webhook.selectorLabels" . | nindent 4 }}
