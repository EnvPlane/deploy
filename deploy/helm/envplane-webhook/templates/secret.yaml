{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.allowUnsafePlaintext }}
{{- fail "secrets.existingSecret is required unless secrets.allowUnsafePlaintext=true for local use" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envplane-webhook.fullname" . }}
  labels:
    {{- include "envplane-webhook.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.controlPlaneTokenKey }}: {{ required "secrets.controlPlaneToken is required" .Values.secrets.controlPlaneToken | quote }}
  {{- with .Values.secrets.githubWebhookSecret }}
  {{ $.Values.secrets.githubWebhookSecretKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gitlabWebhookToken }}
  {{ $.Values.secrets.gitlabWebhookTokenKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
