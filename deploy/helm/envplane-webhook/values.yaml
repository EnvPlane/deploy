replicaCount: 1

image:
  repository: ghcr.io/envplane/webhook
  tag: "0.1.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

controlPlane:
  url: "http://envplane-control-plane:8080"

secrets:
  # Existing Secret is the production path for optional GitHub compatibility
  # settings. GitLab signing secrets remain in control-plane.
  existingSecret: "envplane-webhook-secrets"
  # The receiver credential is distinct from legacy provider/configuration
  # secrets and is valid only for control-plane receiver ingestion.
  receiverSecret: "envplane-webhook-receiver"
  receiverTokenKey: receiver-token
  controlPlaneTokenKey: control-plane-token
  githubWebhookSecretKey: github-webhook-secret
  # Local-rendering escape hatch only; never commit live values.
  allowUnsafePlaintext: false
  controlPlaneToken: ""
  githubWebhookSecret: ""

service:
  type: ClusterIP
  port: 8080

requestTimeout: 10s
readyStaleAfter: 2m
# Explicit removal deadline for the legacy control-plane-token fallback.
legacyFallbackUntil: "2026-12-31T23:59:59Z"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: webhook.envplane.local
      paths:
        - path: /
          pathType: Prefix
  # Public webhook ingress must always declare its TLS secret.
  tls:
    - hosts:
        - webhook.envplane.local
      secretName: envplane-webhook-tls

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
