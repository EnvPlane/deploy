# Uses an existing Gateway API Gateway; it does not install CRDs or a controller.
access:
  mode: gateway
  gateway:
    name: shared-gateway
    namespace: gateway-system
    sectionName: https
    hostnames:
      - envpilot.example.invalid
platformDependencies:
  ingress:
    mode: existing
    provider: gateway-api
    existingClassName: shared-gateway
  dns: { mode: disabled }
  storage: { mode: existing }
