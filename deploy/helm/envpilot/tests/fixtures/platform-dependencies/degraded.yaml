platformDependencies:
  ingress: {mode: existing, provider: nginx, existingClassName: orphan-nginx}
  dns:
    mode: existing
    provider: external-dns
    namespace: envpilot
    credentials: {existingSecret: dns-credentials}
    domainFilters: [example.test]
    ownershipId: envpilot
    policy: sync
  storage: {mode: existing, existingClassName: unavailable-storage}
