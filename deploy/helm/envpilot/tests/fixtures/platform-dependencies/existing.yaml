# The matrix runner executes this fixture on a cluster where a healthy,
# compatible ingress-nginx controller and IngressClass/nginx already exist.
# EnvPlane must detect it without adopting or reinstalling the provider.
platformDependencies:
  ingress:
    mode: existing
    provider: nginx
    existingClassName: nginx
    namespace: ingress-nginx
    ownership: external
  dns: {mode: disabled}
  storage: {mode: disabled}
