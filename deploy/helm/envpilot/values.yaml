    release: "sha-92f660b8569f09f54ffddb582c06fe33ecfbe3dd"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  controlPlane:
    endpointMode: sameCluster
    url: http://envpilot-control-plane:8080
