# Provider-neutral EnvPilot umbrella defaults. No ingress controller, DNS
# provider, domain, StorageClass, cloud load balancer, or Kubernetes provider is
# assumed. Configure environment-specific integration in a separate values file.

# Conditional child-chart switches. Child configuration remains under the
# canonical chart name so immutable selectors are not rewritten by aliases.
controlPlane:
  enabled: true
frontend:
  enabled: true
agent:
  enabled: false
runner:
  enabled: false

# Cross-child first-start registration for an Agent and Runner installed in
# this same release/cluster. `managed` creates one Helm-owned Secret and keeps
# its values stable across upgrades; `existing` consumes an operator-created
# Secret. The Secret is mounted only into the control plane and the matching
# runtime pods. It is never exposed through a bootstrap API response.
global:
  envpilot:
    # Lets the umbrella pass declared platform dependency metadata to the API
    # capabilities endpoint. It is configuration-only and performs no probes
    # or installation of controllers, DNS, StorageClasses or tunnels.
    platformDependencyStatus:
      enabled: true
    firstStartRegistration:
      mode: disabled # disabled | managed | existing
      secretName: envpilot-first-start-registration
      existingSecret: ""
      tokenTTLSeconds: 86400
      project:
        id: envpilot
        name: EnvPilot
        productId: generic
        appRepositoryId: envpilot/app
        gitopsRepositoryId: envpilot/gitops
      cluster:
        id: ""
      agent:
        id: envpilot-agent
      runner:
        id: envpilot-runner
        # Empty resolves to the umbrella release namespace at render time.
        namespace: ""
        deploymentMode: helm
    # Opt-in only. The local E2E profile creates a disposable base workload and
    # reconciles this reserved project through real Agent discovery, Runner
    # chart preflight and bootstrap compilation. It never affects user projects.
    e2eFixture:
      enabled: false
      # Test-only self-healing of a stale fixture Agent/Runner identity. This
      # does not apply to user projects and uses only the existing Secret-held
      # bootstrap claims; no credential is copied into session data.
      recovery:
        enabled: false
      baseNamespace: envpilot-e2e-base
      featureNamespace: envpilot-e2e-feature
      chartRef: oci://ghcr.io/envpilot/envpilot-e2e-workload
      chartVersion: "0.1.0"
      appRepositoryURL: https://github.com/envpilot/envpilot-e2e-workload
      gitopsRepositoryURL: https://github.com/envpilot/deploy
      scmProvider: github
      appDefaultBranch: main
      gitopsDefaultBranch: main

# Public access is opt-in. "ingress" creates an Ingress against an existing
# configured IngressClass; "gateway" creates an HTTPRoute against an existing
# Gateway. Neither mode installs a provider.
access:
  mode: disabled # disabled | ingress | gateway
  services:
    controlPlaneName: envpilot-control-plane
    frontendName: envpilot-frontend
  ingress:
    host: ""
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
    hostnames: []

# External platform capability contract. EnvPilot never adopts resources owned
# by a platform provider. `auto` detects a healthy compatible capability first
# and may install only the explicitly configured provider when detection fails.
platformDependencies:
  ingress:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingClassName: ""
    namespace: ""
    version: ""
    ownership: external # external | envpilot
    credentials:
      existingSecret: ""
    state: ""
    managed: {}

  dns:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingSecret: ""
    namespace: ""
    version: ""
    ownership: external
    credentials:
      existingSecret: ""
    state: ""
    managed: {}
  storage:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingClassName: ""
    namespace: ""
    version: ""
    ownership: external
    credentials:
      existingSecret: ""
    state: ""
    managed: {}

# Optional chart-owned reconciler. It only handles the three external
# capabilities above; EnvPilot core workloads remain ordinary chart children.
platformDependencyReconciler:
  enabled: true
  image:
    repository: ghcr.io/envpilot/platform-reconciler
    tag: "sha-1b49ab16f771ab21d3cd4bbe74ecfd79c8e7246c"
    digest: "sha256:39cf76427b0b8fd1f35c2c2b748c039400d80eb3ab27359806eb4d5708fb751c"
    pullPolicy: IfNotPresent
    sourceRevision: "1b49ab16f771ab21d3cd4bbe74ecfd79c8e7246c"
    release: "sha-1b49ab16f771ab21d3cd4bbe74ecfd79c8e7246c"
  # Required when the reconciler image is in a private registry.
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
  backoffLimit: 4
  activeDeadlineSeconds: 600
  cleanupManagedOnUninstall: true

envpilot-control-plane:
  fullnameOverride: envpilot-control-plane
  image:
    repository: ghcr.io/envpilot/api
    tag: "sha-f26074348aea348cafc0694b3bd931bd196c2803"
    digest: "sha256:3b64bbab039cab84e1abf5d53878e2fff1fc2b9e67c6f74dd43a05caab03c6b5"
    pullPolicy: IfNotPresent
    sourceRevision: "f26074348aea348cafc0694b3bd931bd196c2803"
    release: "sha-f26074348aea348cafc0694b3bd931bd196c2803"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  # Umbrella owns frontend separately; disable the standalone transitional
  # frontend dependency and route access resources to envpilot-frontend.
  frontend:
    enabled: false
    serviceName: envpilot-frontend
  # Public access is rendered by templates/access.yaml, not this child chart.
  ingress:
    enabled: false
    domain: ""
    className: ""
    annotations: {}
  env:
    ENVPILOT_API_CONTRACT_VERSION: "1"
  # Empty means the same-cluster Service FQDN. Set only for an Agent installed
  # in another cluster, where the endpoint must be explicitly pod-reachable.
  agentBootstrap:
    controlPlaneURL: ""
    image:
      repository: ghcr.io/envpilot/agent
      tag: "sha-7e03dde324a6f5fd095682177f547d9ad30e7f12"
    # This must match the envpilot-agent child dependency in Chart.yaml. The
    # release workflow signs it into compatibility/release.json and the
    # dependency update workflow changes both fields atomically.
    chart:
      ref: "oci://ghcr.io/envpilot/envpilot-agent"
      version: "0.2.2"
  remoteControlPlane:
    # Required only when Agent/Runner are installed in another cluster. Use a
    # stable target-pod-reachable HTTP(S) endpoint, never a tunnel or Service
    # DNS. For private TLS, the CA Secret/key must exist in target namespaces.
    url: ""
    caSecret: ""
    caKey: ca.crt
    clusterID: ""
  # internal creates in-release StatefulSets. external references a Secret
  # containing complete connection URLs. disabled leaves the corresponding
  # application variable unset for an externally injected configuration.
  postgres:
    # mode: internal | external | disabled. Omitted intentionally: the legacy
    # enabled=true contract selects internal and keeps existing values working.
    enabled: true
    image:
      repository: postgres
      tag: "16-alpine"
      digest: ""
      pullPolicy: IfNotPresent
    auth:
      database: envpilot
      username: envpilot
      password: envpilot # use auth.existingSecret in production
      existingSecret: ""
      passwordKey: password
    external:
      existingSecret: ""
      urlKey: database-url
    persistence:
      enabled: true
      size: 8Gi
      storageClassName: ""
  redis:
    # mode: internal | external | disabled. Omitted intentionally: the legacy
    # enabled=true contract selects internal and keeps existing values working.
    enabled: true
    image:
      repository: redis
      tag: "7-alpine"
      digest: ""
      pullPolicy: IfNotPresent
    external:
      existingSecret: ""
      urlKey: redis-url
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ""
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
  # Prefer existingSecret references above. secretEnv remains for compatibility
  # with prior releases and must not contain credentials in committed values.
  secretEnv: {}

envpilot-frontend:
  fullnameOverride: envpilot-frontend
  image:
    repository: ghcr.io/envpilot/frontend
    tag: "sha-c3d98aa66aa4e5153e93b8a7f816032357cde282"
    digest: "sha256:49eacc798e6e739b900b274836ffb6a668e7138e06020d705329c441bf95dbdd"
    pullPolicy: IfNotPresent
    sourceRevision: "c3d98aa66aa4e5153e93b8a7f816032357cde282"
    release: "sha-c3d98aa66aa4e5153e93b8a7f816032357cde282"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 3000
    nodePort: null

# Same-cluster execution targets are opt-in. Use existing project-scoped
# registration Secrets; never put bootstrap tokens into this values file.
envpilot-agent:
  fullnameOverride: envpilot-agent
  image:
    repository: ghcr.io/envpilot/agent
    tag: "sha-839e111bcac7a7a9f0e18de6cb3c429d89f296cb"
    digest: "sha256:a09d2473161be2d52a2c3fcdb9da87b6d758c070b6089a72d7e1930e999984da"
