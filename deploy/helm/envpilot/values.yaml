    digest: "sha256:77de18aee07124dd313446c1080d05480c9808284642fc0bf7cfb1b2eecc7ef7"
    pullPolicy: IfNotPresent
    sourceRevision: "3e7e9f26ffcae4dbc3a0a352d8760a46d89c85aa"
    release: "sha-3e7e9f26ffcae4dbc3a0a352d8760a46d89c85aa"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  controlPlane:
    url: http://envpilot-control-plane:8080
    existingSecret: ""
    registrationTokenKey: registration-token
  cluster:
    id: ""
  bootstrap:
    projectId: ""
  agent:
