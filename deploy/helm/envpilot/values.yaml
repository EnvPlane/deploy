# Provider-neutral EnvPilot umbrella defaults. No ingress controller, DNS
# provider, domain, StorageClass, cloud load balancer, or Kubernetes provider is
# assumed. Configure environment-specific integration in a separate values file.

# Conditional child-chart switches. Child configuration remains under the
# canonical chart name so immutable selectors are not rewritten by aliases.
controlPlane:
  enabled: true
frontend:
  enabled: true
agent:
  enabled: false
runner:
  enabled: false

# Cross-child first-start registration for an Agent and Runner installed in
# this same release/cluster. `managed` creates one Helm-owned Secret and keeps
# its values stable across upgrades; `existing` consumes an operator-created
# Secret. The Secret is mounted only into the control plane and the matching
# runtime pods. It is never exposed through a bootstrap API response.
global:
  envpilot:
    # Lets the umbrella pass declared platform dependency metadata to the API
    # capabilities endpoint. It is configuration-only and performs no probes
    # or installation of controllers, DNS, StorageClasses or tunnels.
    platformDependencyStatus:
      enabled: true
    firstStartRegistration:
      mode: disabled # disabled | managed | existing
      secretName: envpilot-first-start-registration
      existingSecret: ""
      tokenTTLSeconds: 86400
      project:
        id: envpilot
        name: EnvPilot
        productId: generic
        appRepositoryId: envpilot/app
        gitopsRepositoryId: envpilot/gitops
      cluster:
        id: ""
      agent:
        id: envpilot-agent
      runner:
        id: envpilot-runner
        # Empty resolves to the umbrella release namespace at render time.
        namespace: ""
        deploymentMode: helm

# Public access is opt-in. "ingress" creates an Ingress against an existing
# configured IngressClass; "gateway" creates an HTTPRoute against an existing
# Gateway. Neither mode installs a provider.
access:
  mode: disabled # disabled | ingress | gateway
  services:
    controlPlaneName: envpilot-control-plane
    frontendName: envpilot-frontend
  ingress:
    host: ""
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
    hostnames: []

# External platform capability contract. EnvPilot never adopts resources owned
# by a platform provider. `auto` detects a healthy compatible capability first
# and may install only the explicitly configured provider when detection fails.
platformDependencies:
  ingress:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingClassName: ""
    namespace: ""
    version: ""
    ownership: external # external | envpilot
    credentials:
      existingSecret: ""
    state: ""
    managed: {}

  dns:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingSecret: ""
    namespace: ""
    version: ""
    ownership: external
    credentials:
      existingSecret: ""
    state: ""
    managed: {}
  storage:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingClassName: ""
    namespace: ""
    version: ""
    ownership: external
    credentials:
      existingSecret: ""
    state: ""
    managed: {}

# Optional chart-owned reconciler. It only handles the three external
# capabilities above; EnvPilot core workloads remain ordinary chart children.
platformDependencyReconciler:
  enabled: true
  image:
    repository: ghcr.io/envpilot/platform-reconciler
    tag: "sha-ac5f0520d61c72306d8e92f4151d62cfc5e50ad8"
    digest: "sha256:b22d2be70e6c29989f0a3022190932642c4c196d63f5fe8697ae5a633f5ff81b"
    pullPolicy: IfNotPresent
    sourceRevision: "ac5f0520d61c72306d8e92f4151d62cfc5e50ad8"
    release: "sha-ac5f0520d61c72306d8e92f4151d62cfc5e50ad8"
  # Required when the reconciler image is in a private registry.
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
  backoffLimit: 4
  activeDeadlineSeconds: 600
  cleanupManagedOnUninstall: true

envpilot-control-plane:
  fullnameOverride: envpilot-control-plane
  image:
    repository: ghcr.io/envpilot/api
    tag: "sha-2d39707134dd7008771c4f6441fe852c3a10d8ee"
    digest: "sha256:de3eb5cc4301d6f525849b05daa49690635112d7b273c3ee2bc39a80a799399f"
    pullPolicy: IfNotPresent
    sourceRevision: "2d39707134dd7008771c4f6441fe852c3a10d8ee"
    release: "sha-2d39707134dd7008771c4f6441fe852c3a10d8ee"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  # Umbrella owns frontend separately; disable the standalone transitional
  # frontend dependency and route access resources to envpilot-frontend.
  frontend:
    enabled: false
    serviceName: envpilot-frontend
  # Public access is rendered by templates/access.yaml, not this child chart.
  ingress:
    enabled: false
    domain: ""
    className: ""
    annotations: {}
  env:
    ENVPILOT_API_CONTRACT_VERSION: "1"
    ENVPILOT_AGENT_HELM_CHART_REF: "oci://ghcr.io/envpilot/envpilot-agent"
    ENVPILOT_AGENT_HELM_CHART_VERSION: ""
  # internal creates in-release StatefulSets. external references a Secret
  # containing complete connection URLs. disabled leaves the corresponding
  # application variable unset for an externally injected configuration.
  postgres:
    # mode: internal | external | disabled. Omitted intentionally: the legacy
    # enabled=true contract selects internal and keeps existing values working.
    enabled: true
    image:
      repository: postgres
      tag: "16-alpine"
      digest: ""
      pullPolicy: IfNotPresent
    auth:
      database: envpilot
      username: envpilot
      password: envpilot # use auth.existingSecret in production
      existingSecret: ""
      passwordKey: password
    external:
      existingSecret: ""
      urlKey: database-url
    persistence:
      enabled: true
      size: 8Gi
      storageClassName: ""
  redis:
    # mode: internal | external | disabled. Omitted intentionally: the legacy
    # enabled=true contract selects internal and keeps existing values working.
    enabled: true
    image:
      repository: redis
      tag: "7-alpine"
      digest: ""
      pullPolicy: IfNotPresent
    external:
      existingSecret: ""
      urlKey: redis-url
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ""
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
  # Prefer existingSecret references above. secretEnv remains for compatibility
  # with prior releases and must not contain credentials in committed values.
  secretEnv: {}

envpilot-frontend:
  fullnameOverride: envpilot-frontend
  image:
    repository: ghcr.io/envpilot/frontend
    tag: "sha-a9acf0556b81cfd799eb1f414efcf79c1a144bcb"
    digest: "sha256:d474ed907cbe66eb7ee8540da43bc82f3ca4310bcdf533ba8c8945e0e188590c"
    pullPolicy: IfNotPresent
    sourceRevision: "a9acf0556b81cfd799eb1f414efcf79c1a144bcb"
    release: "sha-a9acf0556b81cfd799eb1f414efcf79c1a144bcb"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    port: 3000
    nodePort: null

# Same-cluster execution targets are opt-in. Use existing project-scoped
