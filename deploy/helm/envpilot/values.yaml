image:
  repository: ghcr.io/envpilot/install
  tag: "0.1.10"
  pullPolicy: Always
  createPullSecret: true
  pullSecretName: envpilot-ghcr
  pullSecrets: []

installer:
  namespace: envpilot
  createNamespace: true

install:
  mode: clean-install
  namespace: envpilot
  projectId: default
  clusterId: ""
  agentId: envpilot-agent
  runnerId: ""
  runnerNamespace: ""
  runnerReleaseName: ""
  runnerDeploymentMode: helm
  controlPlaneRelease: envpilot
  agentRelease: envpilot-agent
  runnerRelease: envpilot-runner
  chartsDir: /opt/envpilot/helm
  timeoutSeconds: 240
  seedProject: true
  preserveNamespaceCleanup: true

deployment:
  # Supported: helm_direct, fluxcd. Planned/not implemented: argocd.
  backend: helm_direct

# How users reach the browser UI after the installer Job completes.
# "ingress" preserves the production default. For Docker-based local minikube,
# use "nodeport" and obtain the reachable URL with `minikube service --url`.
access:
  mode: ingress
  nodePort: 0

project:
  productId: envpilot-smoke
  productChartPath: /var/lib/envpilot/charts/envpilot-smoke
  loadBalancerType: alb
  endpointDomain: tools.int
  ingressAnnotations: {}
  appRepositoryId: envpilot/app
  gitopsRepositoryId: envpilot/gitops

registry:
  secretName: ghcr-envpilot
  server: ghcr.io
  username: envpilot
  token: ""
  existingTokenSecret: ""
  existingTokenSecretKey: token
  skipSecret: false

images:
  # `tag` remains as a deprecated all-components override for existing Helm
  # callers. Published releases pin each runtime component independently.
  tag: ""
  api:
    repository: ghcr.io/envpilot/api
    tag: "0.1.5"
  frontend:
    repository: ghcr.io/envpilot/frontend
    tag: "0.1.5"
  agent:
    repository: ghcr.io/envpilot/agent
    tag: "0.1.1"
  runner:
    repository: ghcr.io/envpilot/runner
    tag: "0.1.3"
  pullPolicy: Always

agentInstall:
  helmChartRef: oci://ghcr.io/envpilot/envpilot-agent
  helmChartVersion: "0.1.1"

storage:
  className: ""

scheduling:
  nodeArch: ""
  toleration:
    key: ""
    value: ""
    effect: NoSchedule

postgres:
  password: envpilot

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

job:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1200
  annotations: {}
  podAnnotations: {}
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
