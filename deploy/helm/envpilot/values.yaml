    sourceRevision: "839e111bcac7a7a9f0e18de6cb3c429d89f296cb"
    release: "sha-839e111bcac7a7a9f0e18de6cb3c429d89f296cb"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  controlPlane:
    endpointMode: sameCluster
    url: http://envpilot-control-plane:8080
    serviceName: envpilot-control-plane
    namespace: ""
    port: 8080
    existingSecret: ""
    registrationTokenKey: registration-token
  cluster:
    id: ""
  bootstrap:
    projectId: ""
  agent:
    id: ""
    authPersistence:
      enabled: true
      existingClaim: ""
      existingSecret: ""
      storageClassName: ""

envpilot-runner:
  fullnameOverride: envpilot-runner
  image:
    repository: ghcr.io/envpilot/runner
    tag: "sha-716c686d4bb402f13cc35d6f1a791a381f8ae95f"
    digest: "sha256:2ecf6a637903a8e528e56c52910b51c4f4742d58868fb02a66aa392b5ac9adfb"
    pullPolicy: IfNotPresent
    sourceRevision: "716c686d4bb402f13cc35d6f1a791a381f8ae95f"
    release: "sha-716c686d4bb402f13cc35d6f1a791a381f8ae95f"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  controlPlane:
    endpointMode: sameCluster
    url: http://envpilot-control-plane:8080
    serviceName: envpilot-control-plane
    namespace: ""
    port: 8080
    existingSecret: ""
