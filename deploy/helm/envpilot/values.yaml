# Provider-neutral EnvPilot umbrella defaults. No ingress controller, DNS
# provider, domain, StorageClass, cloud load balancer, or Kubernetes provider is
# assumed until an access/dependency profile explicitly requests one. When
# access.mode=ingress and access.ingress.className=nginx, the umbrella detects a
# healthy existing ingress-nginx controller and otherwise reconciles the pinned
# provider chart. Other controller classes require an explicit dependency
# provider contract.

# Conditional child-chart switches. Child configuration remains under the
# canonical chart name so immutable selectors are not rewritten by aliases.
controlPlane:
  enabled: true
frontend:
  enabled: true
agent:
  enabled: false
runner:
  enabled: false
webhook:
  enabled: false

# Cross-child first-start registration for an Agent and Runner installed in
# this same release/cluster. `managed` creates one Helm-owned Secret and keeps
# its values stable across upgrades; `existing` consumes an operator-created
# Secret. The Secret is mounted only into the control plane and the matching
# runtime pods. It is never exposed through a bootstrap API response.
global:
  envpilot:
    # Runtime image registry contract. Set mode=existing and reference a
    # Secret containing .dockerconfigjson for private images. The Secret name
    # and pull references are safe metadata; credentials never enter values.
    registry:
      mode: disabled # disabled | existing
      existingSecret: ""
      imagePullSecrets: []
      preflight:
        enabled: true
        image:
          repository: busybox
          tag: "1.36"
          pullPolicy: IfNotPresent
    # Lets the umbrella pass declared platform dependency metadata to the API
    # capabilities endpoint. It is configuration-only and performs no probes
    # or installation of controllers, DNS, StorageClasses or tunnels.
    platformDependencyStatus:
      enabled: true
      # Defaults to a revision-scoped
      # <release>-platform-dependency-reconciler-status-r<revision> when empty.
      # Set an existing name only when an operator owns that observed-status
      # ConfigMap; the umbrella will then not create it.
      statusConfigMapName: ""
      # The control plane watches the reconciler-owned ConfigMap and overlays
      # observed capability state on this declarative contract. A missing map
      # keeps the declared state; an old observation becomes explicitly stale.
      staleAfterSeconds: 300
    # Remote clusters are configured through the API/UI and Secret references.
    # This flag only enables the management-cluster reconciler globally; it
    # contains no target-cluster endpoint or credential material.
    remoteClusterReconciler:
      enabled: false
    # DEPRECATED bootstrap source only. At first start it seeds the persisted,
    # API/UI-managed ManagementEndpointProfile and is never remote-cluster
    # configuration. New installs should use managementEndpointProfile.bootstrap
    # only for migration from an existing Helm-managed endpoint, then manage it
    # through Settings > Remote clusters.
    remoteControlPlane:
      endpoint: ""
      tls:
        caSecretRef:
          name: ""
          key: ca.crt
    # Optional one-time bootstrap source for the singleton API-managed
    # ManagementEndpointProfile. The endpoint must be a stable private or
    # public HTTPS DNS name reachable from target Pods. Values do not hold
    # kubeconfig, bearer token or certificate bytes.
    managementEndpointProfile:
      bootstrap:
        endpoint: ""
        tls:
          serverName: ""
          caSecretRef:
            name: ""
            key: ca.crt
    firstStartRegistration:
      mode: disabled # disabled | managed | existing
      secretName: envpilot-first-start-registration
      existingSecret: ""
      tokenTTLSeconds: 86400
      project:
        id: envpilot
        name: EnvPilot
        productId: generic
        appRepositoryId: envpilot/app
        gitopsRepositoryId: envpilot/gitops
      cluster:
        id: ""
      agent:
        id: envpilot-agent
      runner:
        id: envpilot-runner
        # Empty resolves to the umbrella release namespace at render time.
        namespace: ""
        deploymentMode: helm
    # Opt-in only. The local E2E profile creates a disposable base workload and
    # reconciles this reserved project through real Agent discovery, Runner
    # chart preflight and bootstrap compilation. It never affects user projects.
    e2eFixture:
      enabled: false
      # Test-only self-healing of a stale fixture Agent/Runner identity. This
      # does not apply to user projects and uses only the existing Secret-held
      # bootstrap claims; no credential is copied into session data.
      recovery:
        enabled: false
      baseNamespace: envpilot-e2e-base
      featureNamespace: envpilot-e2e-feature
      chartRef: oci://ghcr.io/envpilot/envpilot-e2e-workload
      chartVersion: "0.1.0"
      appRepositoryURL: https://github.com/envpilot/envpilot-e2e-workload
      gitopsRepositoryURL: https://github.com/envpilot/deploy
      scmProvider: github
      appDefaultBranch: main
      gitopsDefaultBranch: main

# Public access is opt-in. "ingress" creates an Ingress and, for className=nginx,
# asks the platform reconciler to detect or install ingress-nginx. "gateway"
# creates an HTTPRoute against an existing Gateway.
access:
  mode: disabled # disabled | ingress | gateway
  services:
    controlPlaneName: envpilot-control-plane
    frontendName: envpilot-frontend
  ingress:
    host: ""
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""
  gateway:
    name: ""
    namespace: ""
    sectionName: ""
    hostnames: []

# External platform capability contract. EnvPilot never adopts resources owned
# by a platform provider. `auto` detects a healthy compatible capability first
# and may install only the explicitly configured provider when detection fails.
platformDependencies:
  ingress:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingClassName: ""
    namespace: ""
    version: ""
    ownership: external # external | envpilot
    credentials:
      existingSecret: ""
    state: ""
    managed: {}

  dns:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingSecret: ""
    namespace: ""
    version: ""
    ownership: external
    credentials:
      existingSecret: ""
    state: ""
    managed: {}
  storage:
    mode: disabled # auto | managed | existing | disabled
    provider: ""
    existingClassName: ""
    namespace: ""
    version: ""
    ownership: external
    credentials:
      existingSecret: ""
    state: ""
    managed: {}

# Optional chart-owned reconciler. It only handles the three external
# capabilities above; EnvPilot core workloads remain ordinary chart children.
platformDependencyReconciler:
  # Opt-in only. With all platform dependency modes disabled, no reconciler
  # hooks/RBAC or private image are rendered.
  enabled: false
  image:
    repository: ghcr.io/envpilot/platform-reconciler
    tag: "sha-6adc8322c3bc3d051f19ab8407bc418c004d55d8"
    digest: "sha256:80242aeb7e222369eed170fe7f4f64b6a0a69b45eac6bed409ae45802a9fd75d"
    pullPolicy: IfNotPresent
    sourceRevision: "6adc8322c3bc3d051f19ab8407bc418c004d55d8"
    release: "sha-6adc8322c3bc3d051f19ab8407bc418c004d55d8"
  # Required when the reconciler image is in a private registry.
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
  backoffLimit: 4
  activeDeadlineSeconds: 600
  cleanupManagedOnUninstall: false
  cleanupDeadlineSeconds: 120
  cleanupTTLSeconds: 30

envpilot-control-plane:
  fullnameOverride: envpilot-control-plane
  # Keep the API startup dependency explicit at the umbrella boundary. The
  # child chart renders a least-privilege initContainer which waits for the
  # internal PostgreSQL/Redis readiness probes before starting migrations.
  # Helm still creates StatefulSets and Deployments in one release; this flag
  # prevents the API from racing the database during a cold install.
  dependencyWait:
    enabled: true
  image:
    repository: ghcr.io/envpilot/api
    tag: "sha-d2535cb6f69929af0f66ad1e8e49a1d841c771f5"
    digest: "sha256:a488c5ca4b4a2c06199e336e2a97ac5f63c2160878fef6da349fef75e86dc304"
    pullPolicy: IfNotPresent
    sourceRevision: "d2535cb6f69929af0f66ad1e8e49a1d841c771f5"
    release: "sha-d2535cb6f69929af0f66ad1e8e49a1d841c771f5"
  imagePullSecrets: []
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  rbac:
    # Enable only when RemoteCluster credential upload/rotation is required.
    # The chart then grants namespaced Secret get/create/update/patch, never a
    # ClusterRole or ConfigMap write. Add non-release namespaces explicitly.
    remoteClusterCredentials:
      enabled: false
      namespaces: []
    remoteClusterReconciler:
      enabled: false
  remoteClusterReconciler:
    compatibilityConfigMapName: ""
    leaderElection:
      namespace: ""
  service:
    type: ClusterIP
    port: 8080
    nodePort: null
  # Umbrella owns frontend separately; disable the standalone transitional
  # frontend dependency and route access resources to envpilot-frontend.
  frontend:
    enabled: false
    serviceName: envpilot-frontend
  # Public access is rendered by templates/access.yaml, not this child chart.
  ingress:
    enabled: false
    domain: ""
    className: ""
    annotations: {}
  env:
    ENVPILOT_API_CONTRACT_VERSION: "1"
  # Empty means the same-cluster Service FQDN. Set only for an Agent installed
  # in another cluster, where the endpoint must be explicitly pod-reachable.
  agentBootstrap:
    controlPlaneURL: ""
    image:
      repository: ghcr.io/envpilot/agent
      tag: "sha-7e03dde324a6f5fd095682177f547d9ad30e7f12"
    # This must match the envpilot-agent child dependency in Chart.yaml. The
    # release workflow signs it into compatibility/release.json and the
    # dependency update workflow changes both fields atomically.
    chart:
      ref: "oci://ghcr.io/envpilot/envpilot-agent"
      version: "0.2.5"
  remoteControlPlane:
    # Required only when Agent/Runner are installed in another cluster. Use a
    # stable target-pod-reachable HTTPS endpoint, never a tunnel or Service
    # DNS. For private TLS, the CA Secret/key must exist in target namespaces.
    url: ""
    caSecret: ""
    caKey: ca.crt
    clusterID: ""
  # internal creates in-release StatefulSets. external references a Secret
  # containing complete connection URLs. disabled leaves the corresponding
  # application variable unset for an externally injected configuration.
  postgres:
    # mode: internal | external | disabled. Omitted intentionally: the legacy
    # enabled=true contract selects internal and keeps existing values working.
    enabled: true
    image:
      repository: postgres
      tag: "16-alpine"
      digest: ""
      pullPolicy: IfNotPresent
    auth:
      database: envpilot
      username: envpilot
      password: envpilot # use auth.existingSecret in production
      existingSecret: ""
      passwordKey: password
    external:
      existingSecret: ""
      urlKey: database-url
    persistence:
      enabled: true
      size: 8Gi
      storageClassName: ""
  redis:
    # mode: internal | external | disabled. Omitted intentionally: the legacy
    # enabled=true contract selects internal and keeps existing values working.
    enabled: true
    image:
      repository: redis
      tag: "7-alpine"
      digest: ""
      pullPolicy: IfNotPresent
    external:
      existingSecret: ""
      urlKey: redis-url
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: ""
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
  # Prefer existingSecret references above. secretEnv remains for compatibility
  # with prior releases and must not contain credentials in committed values.
  secretEnv: {}

envpilot-frontend:
  fullnameOverride: envpilot-frontend
  image:
    repository: ghcr.io/envpilot/frontend
    tag: "sha-07c7414853046592a4759d2d79ddf14b9bfd8258"
    digest: "sha256:f6a11d84f30a715b069e6187c61bf4df855d51a91035d5eadb2de9eead60bf8b"
    pullPolicy: IfNotPresent
    sourceRevision: "07c7414853046592a4759d2d79ddf14b9bfd8258"
    release: "sha-07c7414853046592a4759d2d79ddf14b9bfd8258"
  imagePullSecrets: []
