{{- if .Values.installer.createNamespace -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.installer.namespace | quote }}
  annotations:
    # The installer operates in this namespace. A failed hook upgrade must
    # never make Helm delete the control-plane namespace and its workloads.
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: {{ include "envpilot.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: envpilot
{{- end }}
