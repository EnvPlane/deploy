{{- if .Values.platformDependencyReconciler.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-platform-dependency-reconciler
  labels:
    app.kubernetes.io/name: envpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
data:
  dependencies.json: {{ .Values.platformDependencies | toJson | quote }}
{{- end }}
