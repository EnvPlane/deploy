{{- if eq (include "envpilot.platformReconcilerEnabled" .) "true" }}
{{- $dependencies := include "envpilot.effectivePlatformDependencies" . | fromJson -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-platform-dependency-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
data:
  dependencies.json: {{ $dependencies | toJson | quote }}
---
# This status map is deliberately release-owned. The reconciler only updates
# its payload; Helm removes it with the rest of the support resources on
# uninstall and never touches external provider or registry objects.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-platform-dependency-reconciler-status
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: envpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
    app.kubernetes.io/managed-by: Helm
data:
  status.json: ""
{{- end }}
