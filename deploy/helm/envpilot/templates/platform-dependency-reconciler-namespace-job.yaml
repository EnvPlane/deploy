{{- if eq (include "envpilot.platformReconcilerEnabled" .) "true" }}
{{- $r := .Values.platformDependencyReconciler -}}
{{- $dependencies := include "envpilot.effectivePlatformDependencies" . | fromJson -}}
{{- $namespaces := list -}}
{{- range $name := list "ingress" "dns" "storage" }}
  {{- $dependency := index $dependencies $name -}}
  {{- if and (or (eq (default "disabled" $dependency.mode) "auto") (eq (default "disabled" $dependency.mode) "managed")) $dependency.namespace }}
    {{- $namespaces = append $namespaces $dependency.namespace -}}
  {{- end }}
{{- end }}
{{- if gt (len $namespaces) 0 }}
{{- $image := printf "%s:%s" $r.image.repository $r.image.tag -}}
{{- if $r.image.digest }}{{ $image = printf "%s@%s" $r.image.repository $r.image.digest }}{{ end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-platform-reconciler-namespaces
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-30"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
  labels:
    app.kubernetes.io/name: envpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: platform-reconciler
spec:
  backoffLimit: {{ default 4 $r.backoffLimit }}
  activeDeadlineSeconds: {{ default 120 $r.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envpilot
        app.kubernetes.io/component: platform-reconciler
    spec:
      {{- $registryPullSecrets := include "envpilot.registryImagePullSecrets" . -}}
      {{- if or $r.imagePullSecrets $registryPullSecrets }}
      imagePullSecrets:
        {{- with $r.imagePullSecrets }}{{ toYaml . | nindent 8 }}{{- end }}
        {{- if $registryPullSecrets }}{{ $registryPullSecrets | nindent 8 }}{{- end }}
      {{- end }}
      serviceAccountName: {{ default (printf "%s-platform-reconciler" .Release.Name) $r.serviceAccount.name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ensure-namespaces
          image: {{ $image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" $r.image.pullPolicy }}
          env:
            - name: ENVPILOT_RECONCILE_ACTION
              value: ensure-namespaces
            - name: ENVPILOT_RECONCILE_PROVIDER_NAMESPACES
              value: {{ join "," $namespaces | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
{{- end }}
{{- end }}
