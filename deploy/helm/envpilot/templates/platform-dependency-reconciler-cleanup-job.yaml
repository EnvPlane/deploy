{{- if and .Values.platformDependencyReconciler.enabled .Values.platformDependencyReconciler.cleanupManagedOnUninstall }}
{{- $r := .Values.platformDependencyReconciler -}}
{{- $sa := default (printf "%s-platform-reconciler" .Release.Name) $r.serviceAccount.name -}}
{{- $image := printf "%s:%s" $r.image.repository $r.image.tag -}}
{{- if $r.image.digest }}{{ $image = printf "%s@%s" $r.image.repository $r.image.digest }}{{ end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-platform-reconciler-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ default 4 $r.backoffLimit }}
  template:
    spec:
      {{- $registryPullSecrets := include "envpilot.registryImagePullSecrets" . }}
      {{- if or $r.imagePullSecrets $registryPullSecrets }}
      imagePullSecrets:
        {{- with $r.imagePullSecrets }}{{ toYaml . | nindent 8 }}{{- end }}
        {{- if $registryPullSecrets }}{{ $registryPullSecrets | nindent 8 }}{{- end }}
      {{- end }}
      serviceAccountName: {{ $sa }}
      restartPolicy: Never
      containers:
        - name: reconciler
          image: {{ $image | quote }}
          env:
            - name: ENVPILOT_RECONCILE_ACTION
              value: cleanup
            - name: ENVPILOT_RECONCILE_CONFIG_MAP
              value: {{ printf "%s-platform-dependency-reconciler" .Release.Name | quote }}
            - name: ENVPILOT_RECONCILE_CONFIG_JSON
              valueFrom:
                configMapKeyRef:
                  name: {{ printf "%s-platform-dependency-reconciler" .Release.Name }}
                  key: dependencies.json
            - name: ENVPILOT_RECONCILE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ENVPILOT_RECONCILE_RELEASE
              value: {{ .Release.Name | quote }}
            - name: ENVPILOT_RECONCILE_CLEANUP
              value: "true"
{{- end }}
