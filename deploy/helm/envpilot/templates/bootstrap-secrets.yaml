{{- if .Values.bootstrap.agent.createSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bootstrap.agent.secretName | quote }}
  labels:
    app.kubernetes.io/name: envpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  registration-token: {{ required "bootstrap.agent.registrationToken is required when bootstrap.agent.createSecret=true" .Values.bootstrap.agent.registrationToken | quote }}
{{- end }}
{{- if and .Values.bootstrap.agent.createSecret .Values.bootstrap.runner.createSecret }}
---
{{- end }}
{{- if .Values.bootstrap.runner.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bootstrap.runner.secretName | quote }}
  labels:
    app.kubernetes.io/name: envpilot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  token: {{ required "bootstrap.runner.registrationToken is required when bootstrap.runner.createSecret=true" .Values.bootstrap.runner.registrationToken | quote }}
  project-config-token: {{ required "bootstrap.runner.projectConfigToken is required when bootstrap.runner.createSecret=true" .Values.bootstrap.runner.projectConfigToken | quote }}
{{- end }}
