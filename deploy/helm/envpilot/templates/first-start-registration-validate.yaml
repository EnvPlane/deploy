{{- $global := default (dict) .Values.global -}}
{{- $envpilot := default (dict) (get $global "envpilot") -}}
{{- $registration := default (dict) (get $envpilot "firstStartRegistration") -}}
{{- $mode := default "disabled" $registration.mode -}}
{{- if and (ne $mode "disabled") (or (not .Values.agent.enabled) (not .Values.runner.enabled)) -}}
{{- fail "global.envpilot.firstStartRegistration requires agent.enabled=true and runner.enabled=true in the same umbrella release" -}}
{{- end -}}
{{- $fixture := default (dict) (get $envpilot "e2eFixture") -}}
{{- if and $fixture.enabled (eq $mode "disabled") -}}
{{- fail "global.envpilot.e2eFixture requires managed or existing firstStartRegistration" -}}
{{- end -}}
{{- if $fixture.enabled -}}
{{- $_fixtureChartRef := required "global.envpilot.e2eFixture.chartRef is required when the E2E fixture is enabled" $fixture.chartRef -}}
{{- $_fixtureBaseNamespace := required "global.envpilot.e2eFixture.baseNamespace is required when the E2E fixture is enabled" $fixture.baseNamespace -}}
{{- $_fixtureFeatureNamespace := required "global.envpilot.e2eFixture.featureNamespace is required when the E2E fixture is enabled" $fixture.featureNamespace -}}
{{- end -}}
