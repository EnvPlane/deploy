{{- $global := include "envpilot.globalConfig" . | fromJson -}}
{{- $executors := default (dict) (get $global "sameClusterProjectExecutors") -}}
{{- if $executors.enabled }}
{{- $namespace := required "global.envplane.sameClusterProjectExecutors.namespace is required when enabled" $executors.namespace -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: envplane
    envplane.io/managed-by: umbrella
  annotations:
    # Project executor Roles and RoleBindings live in this namespace. Keep it
    # across rollback/uninstall so Helm never deletes the namespace before
    # restoring those namespaced resources from an older release revision.
    helm.sh/resource-policy: keep
{{- end }}
