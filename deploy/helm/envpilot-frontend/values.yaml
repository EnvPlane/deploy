replicaCount: 1

image:
  repository: ghcr.io/EnvPlane/frontend
  pullPolicy: IfNotPresent
  tag: "0.1.5"
  # Digest is preferred over tag in rendered workloads. Keep source metadata
  # separate from the OCI reference so a release can be traced precisely.
  digest: ""
  sourceRevision: ""
  release: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Set this only while migrating the legacy frontend embedded in
# envpilot-control-plane. It preserves its immutable Deployment selector:
# app.kubernetes.io/name=envpilot-control-plane,
# app.kubernetes.io/component=frontend.
legacyControlPlaneSelector: false

service:
  type: ClusterIP
  port: 3000
  # Set only for Service type NodePort. Leave empty for an allocated port.
  nodePort: null

env:
  NEXT_PUBLIC_ENVPILOT_API_BASE_URL: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
