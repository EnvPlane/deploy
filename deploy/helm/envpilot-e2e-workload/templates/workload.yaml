apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envpilot-e2e-workload.fullname" . }}
  labels:
    {{- include "envpilot-e2e-workload.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "envpilot-e2e-workload.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "envpilot-e2e-workload.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: e2e-workload
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "envpilot-e2e-workload.fullname" . }}
  labels:
    {{- include "envpilot-e2e-workload.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "envpilot-e2e-workload.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
