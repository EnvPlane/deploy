{{- if and .Values.agent.authPersistence.enabled .Values.agent.authPersistence.createClaim (not .Values.agent.authPersistence.existingClaim) -}}
{{- $retentionPolicy := default "retain" .Values.agent.authPersistence.retentionPolicy -}}
{{- if not (has $retentionPolicy (list "retain" "purge")) }}{{ fail "agent.authPersistence.retentionPolicy must be retain or purge" }}{{ end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ default (printf "%s-auth" (include "envplane-agent.fullname" .)) .Values.agent.authPersistence.claimName }}
  labels:
    {{- include "envplane-agent.labels" . | nindent 4 }}
    {{- include "envplane-agent.managedRemoteLabels" . | nindent 4 }}
  annotations:
    {{- include "envplane-agent.managedRemoteMetadata" . | nindent 4 }}
    {{- if eq $retentionPolicy "retain" }}
    helm.sh/resource-policy: keep
    {{- end }}
    envplane.io/auth-pvc-retention: {{ $retentionPolicy | quote }}
spec:
  accessModes:
    {{- toYaml .Values.agent.authPersistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.agent.authPersistence.size | quote }}
  {{- if .Values.agent.authPersistence.storageClassName }}
  storageClassName: {{ .Values.agent.authPersistence.storageClassName | quote }}
  {{- end }}
{{- end }}
