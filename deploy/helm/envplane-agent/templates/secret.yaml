{{- if and .Values.controlPlane.token (not .Values.controlPlane.existingSecret) (not .Values.controlPlane.allowUnsafePlaintextTokens) -}}
{{- fail "controlPlane.token renders a plaintext bootstrap credential. Create the bootstrap Secret out-of-band and set controlPlane.existingSecret, or set controlPlane.allowUnsafePlaintextTokens=true only for local non-GitOps testing." -}}
{{- end -}}
{{- if and .Values.controlPlane.token (not .Values.controlPlane.existingSecret) .Values.controlPlane.allowUnsafePlaintextTokens -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envplane-agent.tokenSecretName" . }}
  labels:
    {{- include "envplane-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.controlPlane.registrationTokenKey }}: {{ .Values.controlPlane.token | quote }}
{{- end }}
