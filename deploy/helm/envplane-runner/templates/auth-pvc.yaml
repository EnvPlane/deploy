{{- $mode := include "envplane-runner.authPersistenceMode" . -}}
{{- if and .Values.controlPlane.authPersistence.enabled (eq $mode "managed") -}}
{{- $retentionPolicy := default "retain" .Values.controlPlane.authPersistence.retentionPolicy -}}
{{- if not (has $retentionPolicy (list "retain" "purge")) }}{{ fail "controlPlane.authPersistence.retentionPolicy must be retain or purge" }}{{ end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ default (printf "%s-auth" (include "envplane-runner.fullname" .)) .Values.controlPlane.authPersistence.claimName }}
  labels:
    {{- include "envplane-runner.labels" . | nindent 4 }}
    {{- include "envplane-runner.managedRemoteLabels" . | nindent 4 }}
  annotations:
    {{- include "envplane-runner.managedRemoteMetadata" . | nindent 4 }}
    {{- if eq $retentionPolicy "retain" }}
    helm.sh/resource-policy: keep
    {{- end }}
    envplane.io/auth-pvc-retention: {{ $retentionPolicy | quote }}
spec:
  accessModes:
    {{- toYaml .Values.controlPlane.authPersistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.controlPlane.authPersistence.size | quote }}
  {{- if .Values.controlPlane.authPersistence.storageClassName }}
  storageClassName: {{ .Values.controlPlane.authPersistence.storageClassName | quote }}
  {{- end }}
{{- end }}
