{{- $helmRegistry := default (dict) .Values.helmRegistry -}}
{{- $global := default (dict) .Values.global -}}
{{- $globalEnvPlane := include "envplane-runner.globalConfig" . | fromJson -}}
{{- $firstStart := default (dict) (get $globalEnvPlane "firstStartRegistration") -}}
{{- $firstStartEnabled := eq (include "envplane-runner.usesFirstStartRegistration" .) "true" -}}
{{- $controlPlaneEndpoint := include "envplane-runner.controlPlaneEndpoint" . -}}
{{- /* A legacy release can have controlPlane without the later tls map. Use
      get rather than dotted lookup so --reuse-values never dereferences it. */ -}}
{{- $controlPlane := default (dict) .Values.controlPlane -}}
{{- $controlPlaneTLS := default (dict) (get $controlPlane "tls") -}}
{{- $featureEnvWriter := default (dict) .Values.rbac.featureEnvWriter -}}
{{- $featureEnvWriterMode := default "releaseNamespace" $featureEnvWriter.mode -}}
{{- $managedRemote := default (dict) .Values.managedRemote -}}
{{- $managedRemoteEnabled := eq (include "envplane-runner.managedRemoteEnabled" .) "true" -}}
{{- $sameClusterProjectExecutors := default (dict) (get $globalEnvPlane "sameClusterProjectExecutors") -}}
{{- $bootstrapRuntime := default (dict) (get $sameClusterProjectExecutors "bootstrapRuntime") -}}
{{- $bootstrapRuntimeRetirementEnabled := and $firstStartEnabled (default false (get $bootstrapRuntime "retirementEnabled")) -}}
{{- $bootstrapRuntimeRetired := false -}}
{{- if $bootstrapRuntimeRetirementEnabled -}}
{{- $stateName := required "sameClusterProjectExecutors.bootstrapRuntime.stateConfigMap is required when retirement is enabled" (get $bootstrapRuntime "stateConfigMap") -}}
{{- $state := lookup "v1" "ConfigMap" .Release.Namespace $stateName -}}
{{- if $state -}}
{{- $bootstrapRuntimeRetired = eq (default "" (get $state.data "status")) "retired" -}}
{{- end -}}
{{- end -}}
{{- $podAnnotations := mergeOverwrite (deepCopy (default (dict) .Values.podAnnotations)) (include "envplane-runner.imageMetadata" . | fromYaml) (include "envplane-runner.managedRemoteMetadata" . | fromYaml) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envplane-runner.fullname" . }}
  labels:
    {{- include "envplane-runner.labels" . | nindent 4 }}
    {{- if $bootstrapRuntimeRetirementEnabled }}
    envplane.io/bootstrap-runtime: "true"
    envplane.io/bootstrap-runtime-component: runner
    {{- end }}
spec:
  replicas: {{ ternary 0 .Values.replicaCount $bootstrapRuntimeRetired }}
  selector:
    matchLabels:
      {{- include "envplane-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "envplane-runner.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "envplane-runner.serviceAccountName" . }}
      {{- $pullSecrets := include "envplane-runner.imagePullSecrets" . }}
      {{- if $pullSecrets }}
      imagePullSecrets:
        {{ $pullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.dependencyWait.enabled }}
      initContainers:
        - name: control-plane-preflight
          image: {{ include "envplane-runner.image" . | quote }}
          imagePullPolicy: {{ include "envplane-runner.imagePullPolicy" . }}
          workingDir: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - runner-connectivity-check
          env:
            - name: ENVPLANE_CONTROL_PLANE_URL
              value: {{ $controlPlaneEndpoint | quote }}
            - name: ENVPLANE_CONTROL_PLANE_ENDPOINT_MODE
              value: {{ default "sameCluster" (get $controlPlane "endpointMode") | quote }}
            - name: ENVPLANE_CONTROL_PLANE_CONNECTIVITY_MAX_ATTEMPTS
              value: {{ .Values.dependencyWait.connectivity.maxAttempts | quote }}
            - name: ENVPLANE_CONTROL_PLANE_CONNECTIVITY_INITIAL_BACKOFF_SECONDS
              value: {{ .Values.dependencyWait.connectivity.initialBackoffSeconds | quote }}
            - name: ENVPLANE_CONTROL_PLANE_CONNECTIVITY_MAX_BACKOFF_SECONDS
              value: {{ .Values.dependencyWait.connectivity.maxBackoffSeconds | quote }}
            - name: ENVPLANE_CONTROL_PLANE_CONNECTIVITY_DEADLINE_SECONDS
              value: {{ .Values.dependencyWait.connectivity.deadlineSeconds | quote }}
            {{- if $controlPlaneTLS.caSecret }}
            - name: ENVPLANE_CONTROL_PLANE_CA_FILE
              value: {{ printf "%s/%s" ($controlPlaneTLS.mountPath | trimSuffix "/") $controlPlaneTLS.caKey | quote }}
            {{- end }}
            {{ if $controlPlaneTLS.serverName }}
            - name: ENVPLANE_CONTROL_PLANE_TLS_SERVER_NAME
              value: {{ $controlPlaneTLS.serverName | quote }}
            {{ end }}
          {{- if $controlPlaneTLS.caSecret }}
          volumeMounts:
            - name: control-plane-ca
              mountPath: {{ $controlPlaneTLS.mountPath | quote }}
              readOnly: true
          {{- end }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "envplane-runner.image" . | quote }}
          imagePullPolicy: {{ include "envplane-runner.imagePullPolicy" . }}
          workingDir: /tmp
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # The runner image has a read-only root filesystem. Helm writes
            # cache and config files during chart preflight, so keep every
            # HOME/XDG path under the explicit writable /tmp emptyDir.
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            - name: XDG_DATA_HOME
              value: /tmp/.local/share
            - name: ENVPLANE_CONTROL_PLANE_URL
              value: {{ $controlPlaneEndpoint | quote }}
            - name: ENVPLANE_CONTROL_PLANE_ENDPOINT_MODE
              value: {{ default "sameCluster" (get $controlPlane "endpointMode") | quote }}
            {{- if $controlPlaneTLS.caSecret }}
            - name: ENVPLANE_CONTROL_PLANE_CA_FILE
              value: {{ printf "%s/%s" ($controlPlaneTLS.mountPath | trimSuffix "/") $controlPlaneTLS.caKey | quote }}
            {{- end }}
            {{ if $controlPlaneTLS.serverName }}
            - name: ENVPLANE_CONTROL_PLANE_TLS_SERVER_NAME
              value: {{ $controlPlaneTLS.serverName | quote }}
            {{ end }}
            {{ if $managedRemoteEnabled }}
            - name: ENVPLANE_REMOTE_GENERATION
              value: {{ get $managedRemote "generation" | quote }}
            {{ end }}
            - name: ENVPLANE_CLUSTER_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.cluster.id | quote }}{{ else if $managedRemoteEnabled }}{{ get $managedRemote "remoteClusterId" | quote }}{{ else }}{{ default .Release.Name .Values.project.clusterId | quote }}{{ end }}
            - name: ENVPLANE_PROJECT_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.project.id | quote }}{{ else if $managedRemoteEnabled }}{{ get $managedRemote "projectId" | quote }}{{ else }}{{ .Values.project.id | quote }}{{ end }}
            - name: ENVPLANE_RUNNER_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.runner.id | quote }}{{ else }}{{ default (include "envplane-runner.fullname" .) .Values.project.runnerId | quote }}{{ end }}
            - name: ENVPLANE_RUNNER_NAMESPACE
              value: {{ if $firstStartEnabled }}{{ default .Release.Namespace $firstStart.runner.namespace | quote }}{{ else }}{{ .Values.project.namespace | quote }}{{ end }}
            - name: ENVPLANE_RUNNER_DEPLOYMENT_MODE
              value: {{ if $firstStartEnabled }}{{ $firstStart.runner.deploymentMode | quote }}{{ else }}{{ .Values.project.deploymentMode | quote }}{{ end }}
            # Keep the runtime admission check aligned with the exact
            # namespace-scoped Roles rendered below. This is metadata only;
            # the runner never receives a wildcard or a credential here.
            - name: ENVPLANE_FEATURE_ENV_WRITER_MODE
              value: {{ $featureEnvWriterMode | quote }}
            - name: ENVPLANE_FEATURE_ENV_WRITER_NAMESPACES
              {{- if eq $featureEnvWriterMode "releaseNamespace" }}
              value: {{ default .Release.Namespace $featureEnvWriter.namespace | quote }}
              {{- else if eq $featureEnvWriterMode "preconfiguredNamespaces" }}
              value: {{ join "," $featureEnvWriter.namespaces | quote }}
              {{- else }}
              value: {{ join "," $featureEnvWriter.generatedNamespaces | quote }}
              {{- end }}
            - name: ENVPLANE_PROJECT_CONFIG_URL
              value: {{ .Values.project.configUrl | quote }}
            {{- if or $firstStartEnabled .Values.controlPlane.existingSecret (and .Values.controlPlane.configToken .Values.controlPlane.allowUnsafePlaintextTokens) }}
            - name: ENVPLANE_PROJECT_CONFIG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "envplane-runner.tokenSecretName" . }}
                  key: {{ if $firstStartEnabled }}runner-project-config-token{{ else }}{{ .Values.controlPlane.configTokenKey }}{{ end }}
            {{- end }}
            - name: ENVPLANE_RUNNER_HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.controlPlane.heartbeatIntervalSeconds | quote }}
            - name: ENVPLANE_RUNNER_REPORT_TIMEOUT_SECONDS
              value: {{ .Values.controlPlane.reportTimeoutSeconds | quote }}
            - name: ENVPLANE_RUNNER_HEALTH_ADDR
              value: {{ printf ":%d" (.Values.health.port | int) | quote }}
            - name: ENVPLANE_RUNNER_VERSION
              value: {{ .Chart.AppVersion | quote }}
            {{- if $helmRegistry.existingSecret }}
            - name: HELM_REGISTRY_CONFIG
              value: {{ printf "%s/config.json" $helmRegistry.mountPath | quote }}
            {{- end }}
            {{- if .Values.controlPlane.authPersistence.existingSecret }}
            - name: ENVPLANE_RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.authPersistence.existingSecret | quote }}
                  key: {{ .Values.controlPlane.authPersistence.runnerAuthTokenKey | quote }}
            {{- end }}
            {{- if .Values.controlPlane.authPersistence.enabled }}
            - name: ENVPLANE_RUNNER_AUTH_TOKEN_FILE
              value: {{ printf "%s/%s" .Values.controlPlane.authPersistence.mountPath .Values.controlPlane.authPersistence.fileName | quote }}
            {{- end }}
            {{- if or $firstStartEnabled .Values.controlPlane.existingSecret (and .Values.controlPlane.token .Values.controlPlane.allowUnsafePlaintextTokens) }}
            - name: ENVPLANE_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "envplane-runner.tokenSecretName" . }}
                  key: {{ if $firstStartEnabled }}runner-registration-token{{ else }}{{ .Values.controlPlane.tokenKey }}{{ end }}
            {{- end }}
          volumeMounts:
            - name: runner-work
              mountPath: /tmp
          {{- if $controlPlaneTLS.caSecret }}
            - name: control-plane-ca
              mountPath: {{ $controlPlaneTLS.mountPath | quote }}
              readOnly: true
          {{- end }}
          {{- if .Values.controlPlane.authPersistence.enabled }}
            - name: {{ .Values.controlPlane.authPersistence.volumeName }}
              mountPath: {{ .Values.controlPlane.authPersistence.mountPath | quote }}
          {{- end }}
          {{- if $helmRegistry.existingSecret }}
            - name: helm-registry-config
              mountPath: {{ $helmRegistry.mountPath | quote }}
              readOnly: true
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              # Readiness reports a stale bootstrap identity as unavailable,
              # but liveness must keep the pod running for an in-place token
              # rotation and rollout recovery.
              path: /livez
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: runner-work
          emptyDir: {}
      {{- if $controlPlaneTLS.caSecret }}
        - name: control-plane-ca
          secret:
            secretName: {{ $controlPlaneTLS.caSecret | quote }}
            items:
              - key: {{ $controlPlaneTLS.caKey | quote }}
                path: {{ $controlPlaneTLS.caKey | quote }}
      {{- end }}
      {{- if .Values.controlPlane.authPersistence.enabled }}
        - name: {{ .Values.controlPlane.authPersistence.volumeName }}
          {{- if .Values.controlPlane.authPersistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.controlPlane.authPersistence.existingClaim | quote }}
          {{- else if .Values.controlPlane.authPersistence.createClaim }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-auth" (include "envplane-runner.fullname" .)) .Values.controlPlane.authPersistence.claimName | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- if $helmRegistry.existingSecret }}
        - name: helm-registry-config
          secret:
            secretName: {{ $helmRegistry.existingSecret | quote }}
            items:
              - key: {{ $helmRegistry.configKey | quote }}
                path: config.json
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
