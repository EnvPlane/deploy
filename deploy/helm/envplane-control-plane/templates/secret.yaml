{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envplane-control-plane.fullname" . }}-env
  labels:
    {{- include "envplane-control-plane.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
# Empty container for future installation-wide authentication state. Helm owns
# its lifecycle; neither this chart nor the control plane writes credentials
# during install. The name is fixed to this release unless a safe DNS-label
# override is supplied.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "envplane-control-plane.authenticationManagedSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "envplane-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: authentication
    envplane.io/managed-secret: authentication
  annotations:
    envplane.io/purpose: authentication-managed-store
type: Opaque
{{- $postgresMode := default (ternary "internal" "disabled" .Values.postgres.enabled) .Values.postgres.mode -}}
{{- if and (eq $postgresMode "internal") (not .Values.postgres.auth.existingSecret) }}
{{- $postgresSecretName := include "envplane-control-plane.postgresName" . -}}
{{- $existingPostgresSecret := lookup "v1" "Secret" .Release.Namespace $postgresSecretName -}}
{{- $postgresPassword := randAlphaNum 32 -}}
{{- if and $existingPostgresSecret (hasKey (default (dict) $existingPostgresSecret.data) .Values.postgres.auth.passwordKey) }}
{{- $postgresPassword = index $existingPostgresSecret.data .Values.postgres.auth.passwordKey | b64dec -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $postgresSecretName }}
  labels:
    {{- include "envplane-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  {{ .Values.postgres.auth.passwordKey }}: {{ $postgresPassword | quote }}
{{- end }}
