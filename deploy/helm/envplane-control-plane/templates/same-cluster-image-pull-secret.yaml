{{- $globalEnvPlane := include "envplane-control-plane.globalConfig" . | fromJson -}}
{{- $executors := default (dict) (get $globalEnvPlane "sameClusterProjectExecutors") -}}
{{- if default false $executors.enabled -}}
{{- $namespace := trim (default "" $executors.namespace) -}}
{{- $registry := default (dict) (get $executors "registry") -}}
{{- $globalRegistry := default (dict) (get $globalEnvPlane "registry") -}}
{{- $name := trim (default (default "" (get $globalRegistry "existingSecret")) (get $registry "imagePullSecret")) -}}
{{- $source := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $target := lookup "v1" "Secret" $namespace $name -}}
{{- if and $namespace $name $source (not $target) -}}
# Kubernetes Secrets are namespace-scoped. Mirror only the Helm-visible
# operator Secret into the dedicated executor namespace so child Pods can pull
# private images on the first project install. No secret bytes enter values or
# the control-plane API.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "envplane-control-plane.labels" . | nindent 4 }}
    envplane.io/managed-by: same-cluster-project-executors
type: {{ default "kubernetes.io/dockerconfigjson" $source.type | quote }}
data:
  {{- toYaml $source.data | nindent 2 }}
{{- end -}}
{{- end -}}
