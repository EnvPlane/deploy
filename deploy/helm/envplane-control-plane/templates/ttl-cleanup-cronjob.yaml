{{- if .Values.ttlCleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "envplane-control-plane.fullname" . }}-ttl-cleanup
  labels:
    {{- include "envplane-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: ttl-cleanup
spec:
  schedule: {{ .Values.ttlCleanup.schedule | quote }}
  concurrencyPolicy: {{ .Values.ttlCleanup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.ttlCleanup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.ttlCleanup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.ttlCleanup.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.ttlCleanup.ttlSecondsAfterFinished }}
      template:
        metadata:
          labels:
            {{- include "envplane-control-plane.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: ttl-cleanup
          {{- with .Values.ttlCleanup.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          serviceAccountName: {{ include "envplane-control-plane.serviceAccountName" . }}
          restartPolicy: OnFailure
          containers:
            - name: ttl-cleanup
              image: {{ include "envplane-control-plane.image" . | quote }}
              imagePullPolicy: {{ include "envplane-control-plane.imagePullPolicy" . }}
              args: ["ttl-cleanup"]
              env:
                - name: ENVPLANE_CONTROL_PLANE_URL
                  value: {{ printf "http://%s:%d" (include "envplane-control-plane.fullname" .) (.Values.service.port | int) | quote }}
                - name: ENVPLANE_TTL_CLEANUP_TIMEOUT_SECONDS
                  value: {{ .Values.ttlCleanup.timeoutSeconds | quote }}
                {{- if .Values.ttlCleanup.existingSecret }}
                - name: ENVPLANE_TTL_CLEANUP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.ttlCleanup.existingSecret | quote }}
                      key: {{ .Values.ttlCleanup.tokenKey | quote }}
                {{- else if .Values.ttlCleanup.token }}
                - name: ENVPLANE_TTL_CLEANUP_TOKEN
                  value: {{ .Values.ttlCleanup.token | quote }}
                {{- end }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.ttlCleanup.resources | nindent 16 }}
{{- end }}
