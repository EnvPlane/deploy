{{- if not .Values.credentialEncryption.existingSecret }}
{{- $name := include "envplane-control-plane.credentialEncryptionSecretName" . -}}
{{- $keyName := .Values.credentialEncryption.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := default (dict) $existing.data -}}
{{- if not (hasKey $data $keyName) -}}
{{- $_ := set $data $keyName (randAlphaNum 64 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "envplane-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-credentials
  annotations:
    envplane.io/purpose: credential-encryption
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
