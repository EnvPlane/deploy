replicaCount: 1

image:
  repository: ghcr.io/envplane/api
  pullPolicy: IfNotPresent
  tag: "0.1.6"
  # When set, digest takes precedence over tag.
  digest: ""
  # Optional immutable build metadata rendered on the Pod template. CI sets
  # these independently from the image reference so operators can trace a
  # running workload back to its source revision and release.
  sourceRevision: ""
  release: ""

frontend:
  enabled: true
  # The control-plane chart consumes the canonical envplane-frontend child
  # chart. These values preserve the existing standalone release resource
  # names and immutable selectors during an in-place upgrade from <= 0.1.x.
  fullnameOverride: envplane-control-plane-frontend
  legacyControlPlaneSelector: true
  # Used by ingress.yaml; it must match fullnameOverride above.
  serviceName: envplane-control-plane-frontend

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
# Explicit opt-in required for the insecure local-development cookie/HTTP mode.
allowInsecureLocalDevelopment: false

command: []
args: []

service:
  type: ClusterIP
  port: 8080
  nodePort: null

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /api/v1/metrics

ingress:
  enabled: false
  # Configure domain, className and provider-specific annotations explicitly
  # in an environment values file. The chart has no platform routing default.
  domain: ""
  className: ""
  annotations: {}
  certManager:
    enabled: false
    clusterIssuer: selfsigned-cluster-issuer
  apiPaths:
    - path: /api
      pathType: Prefix
    - path: /auth
      pathType: Prefix
    - path: /webhook
      pathType: Prefix
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls:
    enabled: true
    secretName: envplane-tls
    hosts: []

env:
  ENVPLANE_API_CONTRACT_VERSION: "1"
  ENVPLANE_PRODUCT_TELEMETRY_EXPORT_ENABLED: "false"
  ENVPLANE_ADDR: ":8080"
  ENVPLANE_DATA_DIR: "/var/lib/envplane/data"
  ENVPLANE_GITOPS_DIR: "/var/lib/envplane/data/gitops"
  ENVPLANE_POSTGRES_MIGRATIONS_DIR: "/var/lib/envplane/migrations/postgres"
  ENVPLANE_GITHUB_WEBHOOK_DEBUG_PAYLOAD_LOG: "false"
  ENVPLANE_DEPENDENCY_WAIT_TIMEOUT_SECONDS: "120"
  ENVPLANE_DEPENDENCY_WAIT_INTERVAL_SECONDS: "2"
  ENVPLANE_POSTGRES_MIGRATION_TIMEOUT_SECONDS: "1200"

# Interactive OAuth is disabled unless the legacy operator-managed Secret path
# is selected explicitly. The chart never renders credential values.
auth:
  mode: disabled
  existingSecret: ""
  # Helm owns one empty Opaque Secret in the release namespace. Its name may
  # be overridden only as a DNS label; namespace is always the release namespace.
  managedSecret:
    nameOverride: ""

  github:
    authURL: ""
    tokenURL: ""
    userURL: ""
  gitlab:
    authURL: ""
    tokenURL: ""
    userURL: ""
  oidc:
    authURL: ""
    tokenURL: ""
    userURL: ""
    scopes: ""

# Canonical browser-facing origin. Empty is valid while OAuth is disabled.
publicURL: ""

# A claimed Runner command has a bounded lease. On expiry the control plane
# requeues it with a new attempt ID; after maxAttempts delete becomes a visible
# retryable failure rather than an indefinitely claimed record.
runnerCommand:
  # Must exceed the default Helm execution timeout (300s). The runner may
  # still renew this lease while a long command is active.
  leaseSeconds: 360
  maxAttempts: 3

ttlCleanup:
  enabled: false
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  timeoutSeconds: 30
  token: ""
  existingSecret: ""
  tokenKey: ttl-cleanup-token
  podAnnotations: {}
  podLabels: {}
  resources: {}

# Endpoint and image used in generated bootstrap Agent instructions. An empty
# endpoint resolves at render time to this chart's Service FQDN in the release
# namespace (for example http://envplane-control-plane.envplane.svc:8080).
# Set controlPlaneURL explicitly only for a remote Agent cluster.
agentBootstrap:
  controlPlaneURL: ""
  image:
    repository: ghcr.io/envplane/agent
    tag: "0.1.4"
  # Standalone control-plane installs must explicitly provide a remote Agent
  # chart contract. The umbrella injects its signed release-compatible child
  # chart version into these fields.
  chart:
    ref: ""
    version: ""

# Standalone deployments may opt into a default Helm Direct chart for new
# bootstrap sessions. The umbrella supplies its release-compatible default.
bootstrapDefaults:
  helmDirect:
    chartRef: ""
    chartVersion: ""

# Deprecated compatibility bootstrap source. The umbrella's
# managementEndpointProfile.bootstrap is preferred and is migrated once into
# the API/UI-managed singleton profile; it is never RemoteCluster config.
remoteControlPlane:
  url: ""
  caSecret: ""
  caKey: ca.crt
  clusterID: ""

dependencyWait:
  enabled: true

# A fresh install gets a stable, chart-owned encryption key. Set
# existingSecret to delegate key lifecycle to an external secret manager.
credentialEncryption:
  existingSecret: ""
  key: ENVPLANE_CREDENTIAL_ENCRYPTION_KEY

secretEnv: {}

# Commercialization settings use the canonical EnvPlane aliases. Legacy
# ENVPLANE_* variables remain accepted by the application for upgrades.
commercialization:
  ai:
    enabled: false
    airGap: false
    offlineModelBundle: ""
    provider: openai
    model: ""
    allowedHosts:
      - api.openai.com
    apiKeySecretRef:
      name: ""
      key: api-key
    maxContextBytes: 65536
    maxOutputTokens: 512
    timeoutSeconds: 10
    maxRetries: 2
    # Zero disables the monthly reservation guard. Set explicitly for production.
    maxMonthlyTokens: 0
    routing:
      # Routing remains fail-closed until an evaluated model/schema pin is set.
      requiredEvalGateVersion: ""
      schemaVersionPin: ""
      allowedRegions: []
      maxFallbacks: 0
      probeTimeoutSeconds: 3
  billing:
    provider: ""
    baseURL: ""
    apiKeySecretRef:
      name: ""
      key: api-key
    webhookSecretRef:
      name: ""
      key: webhook-secret
  license:
    publicKeysJSON: "{}"
    graceDays: 14

postgres:
  # Empty preserves legacy postgres.enabled semantics. Set explicitly to
  # internal, external or disabled for the provider-neutral umbrella contract.
  mode: ""
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
    digest: ""
  auth:
    database: envplane
    username: envplane
    password: ""
    existingSecret: ""
    passwordKey: password
  tls:
    # Production deployments must provide a Secret containing the CA and
    # server certificate. Set enabled=false only for an explicitly local
    # development PostgreSQL instance.
    enabled: true
    caSecret: ""
    caKey: ca.crt
    serverSecret: ""
    serverCertKey: tls.crt
    serverKeyKey: tls.key
  service:
    port: 5432
  persistence:
    enabled: true
    size: 8Gi
    storageClassName: ""
  external:
    # existingSecret must contain a complete PostgreSQL connection URL.
    existingSecret: ""
    urlKey: database-url
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  # Empty preserves legacy redis.enabled semantics. Set explicitly to
  # internal, external or disabled for the provider-neutral umbrella contract.
  mode: ""
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
    digest: ""
  service:
    port: 6379
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""
  external:
    # existingSecret must contain a complete Redis connection URL.
    existingSecret: ""
    urlKey: redis-url
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""

networkPolicy:
  enabled: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  annotations: {}
  # Namespace-scoped read-only access used only when the control plane resolves
  # Kubernetes/external-secret references. Empty means this release namespace.
  # Add namespaces deliberately; no ClusterRole is created by this chart.
  secretReader:
    # Opt in only for legacy named external Secret references. The managed
    # authentication store uses its own resourceName-scoped Role below.
    enabled: false
    namespaces: []
  # Management-cluster Secret access used exclusively by the RemoteCluster API.
  # It can create/update only explicitly referenced credential Secrets; no
  # ConfigMap or cluster-wide secret permission is granted.
  remoteClusterCredentials:
    enabled: false
    namespaces: []
  remoteClusterReconciler:
    enabled: false
  # Allows the control plane to reconcile project-owned Agent/Runner releases
  # only inside this chart-owned executor namespace. It never creates a
  # ClusterRole. Public EnvPlane OCI artifacts need no registry Secret; supply
  # one only for a private mirror or private project workload.
  sameClusterProjectExecutors:
    enabled: false
    namespace: ""
    # Finite operator-approved base namespaces. Project Agents use named
    # namespace GETs and namespaced Roles for this list; empty intentionally
    # keeps discovery blocked until an allowlist is configured.
    discovery:
      namespaces: []

remoteClusterReconciler:
  compatibilityConfigMapName: ""
  # Empty uses POD_NAMESPACE from the Downward API. Set only when an operator
  # intentionally keeps the leader-election Lease in another namespace; the
  # chart creates the matching namespaced Role and RoleBinding there.
  leaderElection:
    namespace: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

runtime:
  # Go accepts binary memory suffixes only when they include the B (for
  # example MiB). "1600Mi" makes the runtime abort during process startup.
  gomemlimit: 1600MiB

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

livenessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /api/v1/health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
