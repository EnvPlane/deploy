# This chart intentionally has no application credentials or external service
# dependencies. The default is a pinned HTTP responder. Registry-only
# fixtures can continue overriding the image and disabling probes.
image:
  repository: docker.io/library/busybox
  tag: "1.37.0-musl"
  digest: ""
  pullPolicy: IfNotPresent
  sourceRevision: ""
  release: ""

imagePullSecrets: []

replicaCount: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Custom images retain the configurable TCP probe contract; the built-in
# fixture serves and probes HTTP.
probes:
  enabled: true
  port: 8080
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

service:
  port: 80
