{{- $podAnnotations := mergeOverwrite (deepCopy (default (dict) .Values.podAnnotations)) (include "envplane-e2e-workload.imageMetadata" . | fromYaml) -}}
{{- $image := include "envplane-e2e-workload.image" . -}}
{{- $builtInHTTP := eq $image "docker.io/library/busybox@sha256:f6a95d611e0a8780fabdb2aec43e31275b2720dfefa3e41b16835bfc42454478" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envplane-e2e-workload.fullname" . }}
  labels:
    {{- include "envplane-e2e-workload.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "envplane-e2e-workload.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "envplane-e2e-workload.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: e2e-workload
          image: {{ include "envplane-e2e-workload.image" . | quote }}
          {{- if $builtInHTTP }}
          command: ["/bin/busybox", "httpd", "-f", "-p", "8080", "-h", "/fixture"]
          volumeMounts:
            - name: http-content
              mountPath: /fixture
              readOnly: true
          {{- end }}
          imagePullPolicy: {{ include "envplane-e2e-workload.imagePullPolicy" . }}
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            {{- if $builtInHTTP }}
            runAsUser: 65534
            runAsGroup: 65534
            {{- end }}
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.probes.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.probes.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            {{- if $builtInHTTP }}
            httpGet:
              path: /
              port: http
            {{- else }}
            tcpSocket:
              port: {{ .Values.probes.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if $builtInHTTP }}
      volumes:
        - name: http-content
          configMap:
            name: {{ include "envplane-e2e-workload.fullname" . }}
      {{- end }}
{{- if $builtInHTTP }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "envplane-e2e-workload.fullname" . }}
data:
  index.html: "envplane helm-direct http fixture"
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "envplane-e2e-workload.fullname" . }}
  labels:
    {{- include "envplane-e2e-workload.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "envplane-e2e-workload.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
