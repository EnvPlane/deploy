replicaCount: 1

image:
  repository: ghcr.io/envpilot/runner
  pullPolicy: IfNotPresent
  tag: "0.2.0"
  digest: ""
  sourceRevision: ""
  release: ""

imagePullSecrets: []

command: []
args: []

nameOverride: ""
# New releases use <release>-<chart> resource names. Existing releases from
# chart <= 0.1.2 used the fixed name envpilot-runner-chart; preserve their
# Deployment, RBAC and auth PVC on upgrade with:
#   --set fullnameOverride=envpilot-runner-chart \
#   --set legacyChartName=envpilot-runner-chart
fullnameOverride: ""
# The legacy chart name also preserves the immutable Deployment selector when
# migrating from the retired oci://ghcr.io/envpilot/envpilot-runner-chart name.
legacyChartName: ""

# managedRemote is populated only by the management-cluster Remote Cluster
# Reconciler. It is deliberately opt-in so existing standalone and same-cluster
# releases keep their current contract. Auth values are safe revisions only;
# the actual one-time registration/config credentials stay in existingSecret.
managedRemote:
  enabled: false
  remoteClusterId: ""
  projectId: ""
  authRevision: ""
  authRotation: ""
  # SHA-256 of the signed umbrella compatibility manifest selected by the
  # management reconciler. It makes upgrades/rollback generation-aware.
  compatibilityPin: ""
  generation: 0
  # Only an explicit audited RemoteCluster migration may take over a matching
  # legacy release; normal reconciliation always rejects unmanaged releases.
  allowLegacyMigration: false
  # Exact project feature namespaces where this Runner may create/status/
  # recreate/delete Helm releases. No wildcard or cluster-wide writer is
  # available in managed remote mode.
  targetNamespaces: []

controlPlane:
  # sameCluster derives a Service DNS endpoint from this release. remote
  # requires an explicit URL reachable from the target Runner pod.
  endpointMode: sameCluster # sameCluster | remote
  url: ""
  serviceName: ""
  namespace: ""
  port: 8080
  tls:
    # For a remote HTTPS control plane, mount a CA bundle from an existing
    # Secret in this namespace. Empty keeps system trust only.
    caSecret: ""
    caKey: ca.crt
    mountPath: /var/run/envpilot/control-plane-ca
  # GitOps-safe bootstrap:
  # create the Secret out-of-band with the control plane generated kubectl command,
  # then set existingSecret. Do not commit live bootstrap tokens in values files.
  token: ""
  configToken: ""
  existingSecret: ""
  # Unsafe local-only escape hatch for rendering token/configToken into a Secret.
  allowUnsafePlaintextTokens: false
  tokenKey: token
  configTokenKey: project-config-token
  heartbeatIntervalSeconds: 30
  authPersistence:
    # Persist the post-registration runnerAuthToken on a writable volume so
    # normal container/pod restarts do not reuse the one-time bootstrap token.
    enabled: true
    mountPath: /var/lib/envpilot-runner/auth
    fileName: runner-auth-token
    volumeName: runner-auth
    # Create a small PVC by default. This keeps the runtime auth token across
    # rollout-created pod replacements. Set createClaim=false to use emptyDir.
    createClaim: true
    claimName: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 1Mi
    existingClaim: ""
    # Optional post-registration credential Secret for externally managed
    # persistence. If set, the runner reads runnerAuthToken from this Secret.
    existingSecret: ""
    runnerAuthTokenKey: runner-auth-token

# Helm uses its own registry credentials for private OCI charts; imagePullSecrets
# only authenticate Kubernetes image pulls. Point this at a dockerconfigjson or
# Helm registry-config Secret already available in the runner namespace.
helmRegistry:
  existingSecret: ""
  configKey: .dockerconfigjson
  mountPath: /var/run/envpilot/helm-registry

dependencyWait:
  enabled: true

project:
  id: ""
  configUrl: ""
  namespace: envpilot-system
  clusterId: ""
  deploymentMode: helm
  runnerId: ""

service:
  targetPort: 8080

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  annotations: {}
  discovery:
    # cluster keeps read-only discovery across the cluster. Set to "namespace"
    # to render a namespace-scoped Role/RoleBinding instead.
    scope: cluster
    namespace: ""
    # Kubernetes RBAC cannot grant secret metadata-only access. Keep this false
    # unless the runner explicitly needs to discover Secret objects.
    readSecrets: false
  featureEnvWriter:
    enabled: true
    # Helm v3 persists release state in Secrets. Keep this enabled for a
    # functional Helm Direct runner; permission is limited to each configured
    # feature-environment namespace, never granted cluster-wide.
    helmReleaseStorage: true
    # Writer mode makes feature namespace write permissions explicit.
    # releaseNamespace: least-privilege default; writer Role/RoleBinding is
    #   rendered only in the Helm release namespace.
    # preconfiguredNamespaces: render one namespace-scoped writer Role/RoleBinding
    #   for each namespace listed in namespaces.
    # generatedFeatureNamespaces: render one namespace-scoped writer Role/RoleBinding
    #   for each namespace listed in generatedNamespaces. The control plane/runner
    #   should populate this list when feature namespaces are generated ahead of
    #   deployment. Do not broaden to cluster-wide writes for generated namespaces.
    mode: releaseNamespace
    # Legacy override used only by releaseNamespace mode. Empty means .Release.Namespace.
    namespace: ""
    namespaces: []
    generatedNamespaces: []
    allowNetworkPolicies: false
    allowFluxResources: false
  secretManager:
    enabled: false
    namespace: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
