{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "envpilot-runner.fullname" . }}
  labels:
    {{- include "envpilot-runner.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "envpilot-runner.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: health
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
