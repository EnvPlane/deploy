{{- $helmRegistry := default (dict) .Values.helmRegistry -}}
{{- $global := default (dict) .Values.global -}}
{{- $globalEnvPilot := default (dict) (get $global "envpilot") -}}
{{- $firstStart := default (dict) (get $globalEnvPilot "firstStartRegistration") -}}
{{- $firstStartEnabled := eq (include "envpilot-runner.usesFirstStartRegistration" .) "true" -}}
{{- $controlPlaneEndpoint := include "envpilot-runner.controlPlaneEndpoint" . -}}
{{- $controlPlaneTLS := default (dict) .Values.controlPlane.tls -}}
{{- $podAnnotations := mergeOverwrite (deepCopy (default (dict) .Values.podAnnotations)) (include "envpilot-runner.imageMetadata" . | fromYaml) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envpilot-runner.fullname" . }}
  labels:
    {{- include "envpilot-runner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "envpilot-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "envpilot-runner.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "envpilot-runner.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.dependencyWait.enabled }}
      initContainers:
        - name: control-plane-preflight
          image: {{ include "envpilot-runner.image" . | quote }}
          imagePullPolicy: {{ include "envpilot-runner.imagePullPolicy" . }}
          workingDir: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          args:
            - runner-connectivity-check
          env:
            - name: ENVPILOT_CONTROL_PLANE_URL
              value: {{ $controlPlaneEndpoint | quote }}
            {{- if $controlPlaneTLS.caSecret }}
            - name: ENVPILOT_CONTROL_PLANE_CA_FILE
              value: {{ printf "%s/%s" ($controlPlaneTLS.mountPath | trimSuffix "/") $controlPlaneTLS.caKey | quote }}
            {{- end }}
          {{- if $controlPlaneTLS.caSecret }}
          volumeMounts:
            - name: control-plane-ca
              mountPath: {{ $controlPlaneTLS.mountPath | quote }}
              readOnly: true
          {{- end }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "envpilot-runner.image" . | quote }}
          imagePullPolicy: {{ include "envpilot-runner.imagePullPolicy" . }}
          workingDir: /tmp
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # The runner image has a read-only root filesystem. Helm writes
            # cache and config files during chart preflight, so keep every
            # HOME/XDG path under the explicit writable /tmp emptyDir.
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            - name: XDG_DATA_HOME
              value: /tmp/.local/share
            - name: ENVPILOT_CONTROL_PLANE_URL
              value: {{ $controlPlaneEndpoint | quote }}
            {{- if $controlPlaneTLS.caSecret }}
            - name: ENVPILOT_CONTROL_PLANE_CA_FILE
              value: {{ printf "%s/%s" ($controlPlaneTLS.mountPath | trimSuffix "/") $controlPlaneTLS.caKey | quote }}
            {{- end }}
            - name: ENVPILOT_CLUSTER_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.cluster.id | quote }}{{ else }}{{ default .Release.Name .Values.project.clusterId | quote }}{{ end }}
            - name: ENVPILOT_PROJECT_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.project.id | quote }}{{ else }}{{ .Values.project.id | quote }}{{ end }}
            - name: ENVPILOT_RUNNER_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.runner.id | quote }}{{ else }}{{ default (include "envpilot-runner.fullname" .) .Values.project.runnerId | quote }}{{ end }}
            - name: ENVPILOT_RUNNER_NAMESPACE
              value: {{ if $firstStartEnabled }}{{ default .Release.Namespace $firstStart.runner.namespace | quote }}{{ else }}{{ .Values.project.namespace | quote }}{{ end }}
            - name: ENVPILOT_RUNNER_DEPLOYMENT_MODE
              value: {{ if $firstStartEnabled }}{{ $firstStart.runner.deploymentMode | quote }}{{ else }}{{ .Values.project.deploymentMode | quote }}{{ end }}
            - name: ENVPILOT_PROJECT_CONFIG_URL
              value: {{ .Values.project.configUrl | quote }}
            {{- if or $firstStartEnabled .Values.controlPlane.existingSecret (and .Values.controlPlane.configToken .Values.controlPlane.allowUnsafePlaintextTokens) }}
            - name: ENVPILOT_PROJECT_CONFIG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "envpilot-runner.tokenSecretName" . }}
                  key: {{ if $firstStartEnabled }}runner-project-config-token{{ else }}{{ .Values.controlPlane.configTokenKey }}{{ end }}
            {{- end }}
            - name: ENVPILOT_RUNNER_HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.controlPlane.heartbeatIntervalSeconds | quote }}
            - name: ENVPILOT_RUNNER_HEALTH_CHECK_URL
              value: "/health"
            {{- if $helmRegistry.existingSecret }}
            - name: HELM_REGISTRY_CONFIG
              value: {{ printf "%s/config.json" $helmRegistry.mountPath | quote }}
            {{- end }}
            {{- if .Values.controlPlane.authPersistence.existingSecret }}
            - name: ENVPILOT_RUNNER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controlPlane.authPersistence.existingSecret | quote }}
                  key: {{ .Values.controlPlane.authPersistence.runnerAuthTokenKey | quote }}
            {{- end }}
            {{- if .Values.controlPlane.authPersistence.enabled }}
            - name: ENVPILOT_RUNNER_AUTH_TOKEN_FILE
              value: {{ printf "%s/%s" .Values.controlPlane.authPersistence.mountPath .Values.controlPlane.authPersistence.fileName | quote }}
            {{- end }}
            {{- if or $firstStartEnabled .Values.controlPlane.existingSecret (and .Values.controlPlane.token .Values.controlPlane.allowUnsafePlaintextTokens) }}
            - name: ENVPILOT_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "envpilot-runner.tokenSecretName" . }}
                  key: {{ if $firstStartEnabled }}runner-registration-token{{ else }}{{ .Values.controlPlane.tokenKey }}{{ end }}
            {{- end }}
          volumeMounts:
            - name: runner-work
              mountPath: /tmp
          {{- if $controlPlaneTLS.caSecret }}
            - name: control-plane-ca
              mountPath: {{ $controlPlaneTLS.mountPath | quote }}
              readOnly: true
          {{- end }}
          {{- if .Values.controlPlane.authPersistence.enabled }}
            - name: {{ .Values.controlPlane.authPersistence.volumeName }}
              mountPath: {{ .Values.controlPlane.authPersistence.mountPath | quote }}
          {{- end }}
          {{- if $helmRegistry.existingSecret }}
            - name: helm-registry-config
              mountPath: {{ $helmRegistry.mountPath | quote }}
              readOnly: true
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              # Readiness reports a stale bootstrap identity as unavailable,
              # but liveness must keep the pod running for an in-place token
              # rotation and rollout recovery.
              path: /livez
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: runner-work
          emptyDir: {}
      {{- if $controlPlaneTLS.caSecret }}
        - name: control-plane-ca
          secret:
            secretName: {{ $controlPlaneTLS.caSecret | quote }}
            items:
              - key: {{ $controlPlaneTLS.caKey | quote }}
                path: {{ $controlPlaneTLS.caKey | quote }}
      {{- end }}
      {{- if .Values.controlPlane.authPersistence.enabled }}
        - name: {{ .Values.controlPlane.authPersistence.volumeName }}
          {{- if .Values.controlPlane.authPersistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.controlPlane.authPersistence.existingClaim | quote }}
          {{- else if .Values.controlPlane.authPersistence.createClaim }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-auth" (include "envpilot-runner.fullname" .)) .Values.controlPlane.authPersistence.claimName | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- if $helmRegistry.existingSecret }}
        - name: helm-registry-config
          secret:
            secretName: {{ $helmRegistry.existingSecret | quote }}
            items:
              - key: {{ $helmRegistry.configKey | quote }}
                path: config.json
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
