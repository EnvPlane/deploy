{{- $global := default (dict) .Values.global -}}
{{- $globalEnvPilot := default (dict) (get $global "envpilot") -}}
{{- $firstStart := default (dict) (get $globalEnvPilot "firstStartRegistration") -}}
{{- $firstStartEnabled := eq (include "envpilot-agent.usesFirstStartRegistration" .) "true" -}}
{{- $discoveryScope := default "cluster" .Values.rbac.discovery.scope -}}
{{- $watchNamespaces := .Values.watch.namespaces -}}
{{- if eq $discoveryScope "namespace" -}}
{{- $watchNamespaces = .Values.rbac.discovery.namespaces -}}
{{- end -}}
{{- $podAnnotations := mergeOverwrite (deepCopy (default (dict) .Values.podAnnotations)) (include "envpilot-agent.imageMetadata" . | fromYaml) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envpilot-agent.fullname" . }}
  labels:
    {{- include "envpilot-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "envpilot-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "envpilot-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- toYaml $podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ include "envpilot-agent.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.dependencyWait.enabled }}
      initContainers:
        - name: wait-control-plane
          image: {{ include "envpilot-agent.image" . | quote }}
          imagePullPolicy: {{ include "envpilot-agent.imagePullPolicy" . }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          command:
            - sh
            - -ec
            - |
              until wget -q -O- {{ trimSuffix "/" .Values.controlPlane.url }}{{ default "/api/v1/health" .Values.dependencyWait.healthPath }} >/dev/null; do
                echo "waiting for control-plane"
                sleep 2
              done
      {{- end }}
      containers:
        - name: agent
          image: {{ include "envpilot-agent.image" . | quote }}
          imagePullPolicy: {{ include "envpilot-agent.imagePullPolicy" . }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: ENVPILOT_CONTROL_PLANE_URL
              value: {{ .Values.controlPlane.url | quote }}
            - name: ENVPILOT_CLUSTER_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.cluster.id | quote }}{{ else }}{{ default .Release.Name .Values.cluster.id | quote }}{{ end }}
            - name: ENVPILOT_BOOTSTRAP_PROJECT_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.project.id | quote }}{{ else }}{{ .Values.bootstrap.projectId | quote }}{{ end }}
            - name: ENVPILOT_AGENT_ID
              value: {{ if $firstStartEnabled }}{{ $firstStart.agent.id | quote }}{{ else }}{{ default (include "envpilot-agent.fullname" .) .Values.agent.id | quote }}{{ end }}
            - name: ENVPILOT_AGENT_VERSION
              value: {{ default .Chart.AppVersion .Values.image.tag | quote }}
            - name: ENVPILOT_AGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ENVPILOT_WATCH_NAMESPACE_SELECTOR
              value: {{ .Values.watch.namespaceLabelSelector | quote }}
            - name: ENVPILOT_WATCH_EXCLUDED_NAMESPACES
              value: {{ join "," .Values.watch.excludeNamespaces | quote }}
            - name: ENVPILOT_DISCOVERY_READ_SECRETS
              value: {{ .Values.rbac.discovery.readSecrets | quote }}
            - name: ENVPILOT_AGENT_RESYNC_SECONDS
              value: {{ .Values.watch.resyncSeconds | quote }}
            - name: ENVPILOT_AGENT_REPORT_TIMEOUT_SECONDS
              value: {{ .Values.controlPlane.reportTimeoutSeconds | quote }}
            - name: ENVPILOT_AGENT_HEARTBEAT_SECONDS
              value: {{ .Values.agent.heartbeatSeconds | quote }}
            - name: ENVPILOT_FLUX_NAMESPACE
              value: {{ .Values.flux.namespace | quote }}
            {{- if .Values.agent.authPersistence.enabled }}
            - name: ENVPILOT_AGENT_AUTH_TOKEN_FILE
              value: {{ printf "%s/%s" (.Values.agent.authPersistence.mountPath | trimSuffix "/") .Values.agent.authPersistence.fileName | quote }}
            {{- end }}
            {{- if .Values.agent.authPersistence.existingSecret }}
            - name: ENVPILOT_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.authPersistence.existingSecret | quote }}
                  key: {{ .Values.agent.authPersistence.agentAuthTokenKey | quote }}
            {{- end }}
            {{- with $watchNamespaces }}
            - name: ENVPILOT_WATCH_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if or (eq (include "envpilot-agent.usesFirstStartRegistration" .) "true") .Values.controlPlane.existingSecret }}
            - name: ENVPILOT_AGENT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "envpilot-agent.tokenSecretName" . }}
                  key: {{ if eq (include "envpilot-agent.usesFirstStartRegistration" .) "true" }}agent-registration-token{{ else }}{{ .Values.controlPlane.registrationTokenKey }}{{ end }}
            {{- else if and .Values.controlPlane.token .Values.controlPlane.allowUnsafePlaintextTokens }}
            - name: ENVPILOT_AGENT_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "envpilot-agent.tokenSecretName" . }}
                  key: {{ .Values.controlPlane.registrationTokenKey }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.agent.authPersistence.enabled }}
          volumeMounts:
            - name: {{ .Values.agent.authPersistence.volumeName | quote }}
              mountPath: {{ .Values.agent.authPersistence.mountPath | quote }}
          {{- end }}
      {{- if .Values.agent.authPersistence.enabled }}
      volumes:
        - name: {{ .Values.agent.authPersistence.volumeName | quote }}
          {{- if .Values.agent.authPersistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.agent.authPersistence.existingClaim | quote }}
          {{- else if .Values.agent.authPersistence.createClaim }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-auth" (include "envpilot-agent.fullname" .)) .Values.agent.authPersistence.claimName | quote }}
          {{- else }}
          emptyDir:
            {{- toYaml .Values.agent.authPersistence.emptyDir | nindent 12 }}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
