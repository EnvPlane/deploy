replicaCount: 1

image:
  repository: ghcr.io/EnvPlane/agent
  pullPolicy: IfNotPresent
  tag: "0.1.4"
  digest: ""
  sourceRevision: ""
  release: ""

imagePullSecrets: []
nameOverride: ""
# New installations derive resource names from the Helm release. Existing
# releases which used the fixed envpilot-agent name can keep it during upgrade
# with fullnameOverride and legacyChartName; see NOTES.txt.
fullnameOverride: ""
legacyChartName: ""

# managedRemote is set only by the management-cluster Remote Cluster
# Reconciler. It keeps a remote installation project-scoped, forces an
# explicit pod-reachable HTTPS control-plane endpoint and makes auth rotation
# visible to the Deployment without ever placing credentials in values.
# Standalone and same-cluster installations leave this disabled.
managedRemote:
  enabled: false
  remoteClusterId: ""
  projectId: ""
  # Bump either safe value after the referenced bootstrap Secret is rotated to
  # restart the pod. These are fingerprints/revisions, never token values.
  authRevision: ""
  authRotation: ""
  # SHA-256 of the signed umbrella compatibility manifest selected by the
  # management reconciler. It makes upgrades/rollback generation-aware.
  compatibilityPin: ""
  generation: 0
  # Only an explicit audited RemoteCluster migration may take over a matching
  # legacy release; normal reconciliation always rejects unmanaged releases.
  allowLegacyMigration: false
  # Exact base namespaces the project is permitted to discover. Managed remote
  # mode renders Roles only in these namespaces and never a ClusterRole.
  targetNamespaces: []

# Set only by the management-cluster project reconciler. It deliberately
# bypasses umbrella firstStartRegistration so this release uses its own
# project-scoped Secret and identity instead of the singleton bootstrap one.
managedSameCluster:
  enabled: false

command: []
args:
  - agent

controlPlane:
  # sameCluster derives a Service DNS endpoint from this release. remote
  # requires an explicit URL reachable from the target Agent pod.
  endpointMode: sameCluster # sameCluster | remote
  url: ""
  serviceName: ""
  namespace: ""
  port: 8080
  tls:
    # For a remote HTTPS control plane, mount a CA bundle from an existing
    # Secret in this namespace. Empty keeps system trust only.
    caSecret: ""
    caKey: ca.crt
    mountPath: /var/run/envpilot/control-plane-ca
  # GitOps-safe bootstrap:
  # create the Secret out-of-band with the control plane generated kubectl command,
  # then set existingSecret. Do not commit live bootstrap tokens in values files.
  token: ""
  existingSecret: ""
  # Unsafe local-only escape hatch for rendering token into a Secret.
  allowUnsafePlaintextTokens: false
  tokenKey: token
  registrationTokenKey: registration-token
  reportTimeoutSeconds: 10
  # LOCAL DEVELOPMENT ONLY: permits an explicitly configured HTTP control
  # plane endpoint. Production releases must retain the default.
  allowInsecure: false

dependencyWait:
  enabled: true
  connectivity:
    maxAttempts: 12
    initialBackoffSeconds: 1
    maxBackoffSeconds: 5
    deadlineSeconds: 120

cluster:
  id: ""

bootstrap:
  projectId: ""

agent:
  id: ""
  heartbeatSeconds: 30
  authPersistence:
    enabled: true
    # Writable path used by ENVPILOT_AGENT_AUTH_TOKEN_FILE. The agent writes the
    # issued agentAuthToken here after the one-time registration exchange and
    # reads it on restart instead of reusing the consumed bootstrap token.
    mountPath: /var/lib/envpilot-agent/auth
    fileName: agent-auth-token
    volumeName: agent-auth-token
    # Create a small PVC by default so rollout-created pods do not reuse the
    # consumed one-time bootstrap token. Set createClaim=false to use emptyDir.
    createClaim: true
    claimName: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 1Mi
    # Set existingClaim to use an externally managed PVC.
    existingClaim: ""
    emptyDir: {}
    # Optional externally managed Secret with an already issued agentAuthToken.
    # Use this when moving the agent between namespaces without reusing the
    # one-time bootstrap token.
    existingSecret: ""
    agentAuthTokenKey: agent-auth-token

installValidation:
  enabled: true
  backoffLimit: 0
  timeoutSeconds: 30
  podAnnotations: {}
  podLabels: {}
  resources: {}

watch:
  namespaces: []
  # Empty means discover every namespace except excludeNamespaces. Set a
  # Kubernetes label selector only when discovery must be narrowed explicitly.
  namespaceLabelSelector: ""
  excludeNamespaces:
    - default
    - kube-system
    - kube-public
    - kube-node-lease
    - envpilot
    - envpilot-system
  resyncSeconds: 30

flux:
  namespace: flux-system

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  annotations: {}
  discovery:
    # cluster grants read-only visibility across the selected namespaces plus
    # cluster capability probes. namespace renders one Role per listed
    # namespace. Project-owned same-cluster Agents additionally opt into the
    # three read-only cluster capability probes below; they remain unable to
    # discover arbitrary cluster workloads.
    scope: namespace # namespace | cluster; cluster requires explicit opt-in
    namespaces:
      - default
    clusterCapabilityRead: false
    # Allows a bootstrap Agent to list Namespace objects before the user has
    # selected the finite set of namespaces whose workloads it may discover.
    # This does not grant workload or Secret access outside selected namespaces.
    namespaceInventoryRead: false
    # Secret reads are sensitive and disabled by default. Set true only when
    # manifest discovery must include Secret metadata for selected namespaces.
    readSecrets: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
