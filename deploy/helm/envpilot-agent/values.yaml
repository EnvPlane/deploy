replicaCount: 1

image:
  repository: ghcr.io/envpilot/agent
  pullPolicy: IfNotPresent
  tag: "0.1.4"
  digest: ""
  sourceRevision: ""
  release: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

command: []
args:
  - agent

controlPlane:
  url: ""
  # GitOps-safe bootstrap:
  # create the Secret out-of-band with the control plane generated kubectl command,
  # then set existingSecret. Do not commit live bootstrap tokens in values files.
  token: ""
  existingSecret: ""
  # Unsafe local-only escape hatch for rendering token into a Secret.
  allowUnsafePlaintextTokens: false
  tokenKey: token
  registrationTokenKey: registration-token
  reportTimeoutSeconds: 10

dependencyWait:
  enabled: true
  healthPath: /api/v1/health

cluster:
  id: ""

bootstrap:
  projectId: ""

agent:
  id: ""
  heartbeatSeconds: 30
  authPersistence:
    enabled: true
    # Writable path used by ENVPILOT_AGENT_AUTH_TOKEN_FILE. The agent writes the
    # issued agentAuthToken here after the one-time registration exchange and
    # reads it on restart instead of reusing the consumed bootstrap token.
    mountPath: /var/lib/envpilot-agent/auth
    fileName: agent-auth-token
    volumeName: agent-auth-token
    # Create a small PVC by default so rollout-created pods do not reuse the
    # consumed one-time bootstrap token. Set createClaim=false to use emptyDir.
    createClaim: true
    claimName: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 1Mi
    # Set existingClaim to use an externally managed PVC.
    existingClaim: ""
    emptyDir: {}
    # Optional externally managed Secret with an already issued agentAuthToken.
    # Use this when moving the agent between namespaces without reusing the
    # one-time bootstrap token.
    existingSecret: ""
    agentAuthTokenKey: agent-auth-token

installValidation:
  enabled: true
  backoffLimit: 0
  timeoutSeconds: 30
  podAnnotations: {}
  podLabels: {}
  resources: {}

ttlCleanup:
  # TTL cleanup remains a control-plane responsibility; the standalone agent
  # image deliberately exposes only agent and agent-install-check commands.
  enabled: false
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  timeoutSeconds: 30
  podAnnotations: {}
  podLabels: {}
  resources: {}

watch:
  namespaces: []
  # Empty means discover every namespace except excludeNamespaces. Set a
  # Kubernetes label selector only when discovery must be narrowed explicitly.
  namespaceLabelSelector: ""
  excludeNamespaces:
    - default
    - kube-system
    - kube-public
    - kube-node-lease
    - envpilot
    - envpilot-system
  resyncSeconds: 30

flux:
  namespace: flux-system

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  annotations: {}
  discovery:
    # cluster grants read-only visibility across the selected namespaces plus
    # cluster capability probes. namespace renders one Role per listed
    # namespace and deliberately omits cluster-scoped probes.
    scope: cluster # namespace | cluster
    namespaces: []
    # Secret reads are sensitive and disabled by default. Set true only when
    # manifest discovery must include Secret metadata for selected namespaces.
    readSecrets: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
