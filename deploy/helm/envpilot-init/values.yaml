image:
  repository: ghcr.io/envpilot/install
  tag: "0.1.0"
  pullPolicy: Always
  createPullSecret: true
  pullSecretName: envpilot-init-ghcr
  pullSecrets: []

install:
  mode: clean-install
  namespace: envpilot
  projectId: default
  clusterId: ""
  agentId: envpilot-agent
  runnerId: ""
  runnerNamespace: ""
  runnerReleaseName: ""
  runnerDeploymentMode: helm
  controlPlaneRelease: envpilot
  agentRelease: envpilot-agent
  runnerRelease: envpilot-runner
  chartsDir: /opt/envpilot/helm
  timeoutSeconds: 240
  seedProject: true

project:
  productId: default
  appRepositoryId: envpilot/app
  gitopsRepositoryId: envpilot/gitops

registry:
  secretName: ghcr-envpilot
  server: ghcr.io
  username: envpilot
  token: ""
  existingTokenSecret: ""
  existingTokenSecretKey: token
  skipSecret: false

images:
  api: ghcr.io/envpilot/api
  frontend: ghcr.io/envpilot/frontend
  agent: ghcr.io/envpilot/agent
  runner: ghcr.io/envpilot/runner
  tag: "0.1.0"
  pullPolicy: Always

storage:
  className: ""

scheduling:
  nodeArch: ""
  toleration:
    key: ""
    value: ""
    effect: NoSchedule

postgres:
  password: envpilot

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

job:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 1200
  annotations: {}
  podAnnotations: {}
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    capabilities:
      drop:
        - ALL
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
