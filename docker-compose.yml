services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: envplane
      POSTGRES_USER: envplane
      POSTGRES_PASSWORD: envplane
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envplane -d envplane"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: golang:1.25-alpine
    working_dir: /workspace
    command: ["go", "run", "./apps/api"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVPLANE_ADDR: ":8080"
      ENVPLANE_DATA_DIR: /workspace/.envplane/dev
      ENVPLANE_GITOPS_DIR: /workspace/.envplane/dev/gitops
      ENVPLANE_DATABASE_URL: postgres://envplane:envplane@postgres:5432/envplane?sslmode=disable
      ENVPLANE_POSTGRES_MIGRATIONS_DIR: /workspace/migrations/postgres
      ENVPLANE_REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod

volumes:
  postgres-data:
  redis-data:
  go-build-cache:
  go-mod-cache:
