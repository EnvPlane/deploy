# Published-artifact compatibility contract. Runner readiness is delegated to
# Helm so release-aware runner resource names remain supported.
version: "0.1.9"
runnerCommandAPI:
  version: "1"
  requestHeader: X-EnvPlane-Runner-Command-API-Version
images:
  api: ghcr.io/envplane/api:0.1.3
  frontend: ghcr.io/envplane/frontend:0.1.5
  agent: ghcr.io/envplane/agent:0.1.1
  runner: ghcr.io/envplane/runner:0.1.3
charts:
  controlPlane: oci://ghcr.io/envplane/envplane-control-plane:0.1.2
  agent: oci://ghcr.io/envplane/envplane-agent:0.1.1
  runner: oci://ghcr.io/envplane/envplane-runner-chart:0.1.5
