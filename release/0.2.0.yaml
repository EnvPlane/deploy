# Immutable compatibility contract for the first direct Helm umbrella release.
# No ghcr.io/envplane/install image is part of this release.
version: "0.2.0"
apiContract:
  version: "1"
  features:
    scmOfflineBootstrap: true
runnerCommandAPI:
  version: "1"
  requestHeader: X-EnvPlane-Runner-Command-API-Version
images:
  api: ghcr.io/envplane/api:0.1.6
  frontend: ghcr.io/envplane/frontend:0.1.5
  agent: ghcr.io/envplane/agent:0.1.4
  runner: ghcr.io/envplane/runner:0.1.4
charts:
  umbrella: oci://ghcr.io/envplane/envplane:0.2.0
  controlPlane: oci://ghcr.io/envplane/envplane-control-plane:0.2.0
  frontend: oci://ghcr.io/envplane/envplane-frontend:0.1.0
  agent: oci://ghcr.io/envplane/envplane-agent:0.1.2
  runner: oci://ghcr.io/envplane/envplane-runner:0.2.0
sameCluster:
  namespace: envplane
  agentRunnerDefault: disabled
  installerImage: absent
