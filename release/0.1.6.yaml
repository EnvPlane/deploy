# Published-artifact compatibility contract. This release uses the verified
# frontend route image and an installer that supports legacy image values.
version: "0.1.6"
runnerCommandAPI:
  version: "1"
  requestHeader: X-EnvPlane-Runner-Command-API-Version
images:
  api: ghcr.io/envpilot/api:0.1.3
  frontend: ghcr.io/envpilot/frontend:0.1.5
  agent: ghcr.io/envpilot/agent:0.1.1
  runner: ghcr.io/envpilot/runner:0.1.3
charts:
  controlPlane: oci://ghcr.io/envpilot/envpilot-control-plane:0.1.2
  agent: oci://ghcr.io/envpilot/envpilot-agent:0.1.1
  runner: oci://ghcr.io/envpilot/envpilot-runner-chart:0.1.5
