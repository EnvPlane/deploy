# Published-artifact compatibility contract. Installers must use this set as a
# unit; the runner command API is not backwards-compatible with API images that
# predate command polling.
version: "0.1.2"
runnerCommandAPI:
  version: "1"
  requestHeader: X-EnvPlane-Runner-Command-API-Version
images:
  api: ghcr.io/envplane/api:0.1.2
  frontend: ghcr.io/envplane/frontend:0.1.2
  agent: ghcr.io/envplane/agent:0.1.1
  runner: ghcr.io/envplane/runner:0.1.2
charts:
  controlPlane: oci://ghcr.io/envplane/envplane-control-plane:0.1.2
  agent: oci://ghcr.io/envplane/envplane-agent:0.1.1
  runner: oci://ghcr.io/envplane/envplane-runner-chart:0.1.2
