name: Publish control-plane Helm chart

on:
  push:
    tags:
      - "control-plane-chart-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package chart
        run: helm package deploy/helm/envpilot-control-plane --destination dist
      - name: Authenticate to GHCR
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish OCI chart
        run: helm push dist/envpilot-control-plane-*.tgz oci://ghcr.io/${{ github.repository_owner }}
