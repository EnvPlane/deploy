name: Brand guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: ./scripts/test-check-brand.sh
      - name: Check new human-readable brand usage
        run: ./scripts/check-brand.sh --diff-base
