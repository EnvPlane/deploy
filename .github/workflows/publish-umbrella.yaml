name: Publish EnvPilot umbrella release

on:
  push:
    tags:
      - "envpilot-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version, for example 0.1.4
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: docker/setup-buildx-action@v3
      - id: release
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#envpilot-v}"
          fi
          [[ -f "release/${version}.yaml" ]]
          [[ "$(awk -F'"' '/^version:/{print $2; exit}' "release/${version}.yaml")" == "$version" ]]
          [[ "$(awk '/^version:/{print $2; exit}' deploy/helm/envpilot/Chart.yaml)" == "$version" ]]
          [[ "$(awk '/^appVersion:/{gsub(/\"/, "", $2); print $2; exit}' deploy/helm/envpilot/Chart.yaml)" == "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate umbrella chart contract
        run: |
          go test ./deploy/helm/envpilot/tests
          helm lint deploy/helm/envpilot
          helm package deploy/helm/envpilot --destination dist
      - name: Authenticate to GHCR
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: installer
        name: Publish immutable installer image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/install:${{ steps.release.outputs.version }}
      - name: Publish OCI umbrella chart
        run: helm push dist/envpilot-${{ steps.release.outputs.version }}.tgz oci://ghcr.io/${{ github.repository_owner }}
      - name: Record artifact digests
        run: |
          {
            echo "## EnvPilot ${{ steps.release.outputs.version }}"
            echo
            echo "- installer: \`${{ steps.installer.outputs.digest }}\`"
            echo "- chart: \`oci://ghcr.io/${{ github.repository_owner }}/envpilot:${{ steps.release.outputs.version }}\`"
            echo "- release contract: \`release/${{ steps.release.outputs.version }}.yaml\`"
          } >> "$GITHUB_STEP_SUMMARY"
