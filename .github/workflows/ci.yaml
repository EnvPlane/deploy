name: Deploy CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan Go dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
      - run: helm lint deploy/helm/envpilot
      - run: helm lint deploy/helm/envpilot-control-plane
      - run: helm lint deploy/helm/envpilot-agent
      - run: helm lint deploy/helm/envpilot-runner
      - run: bash scripts/check-vendored-chart-drift.sh
      - run: bash scripts/check-env-parity.sh
