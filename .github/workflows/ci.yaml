name: Deploy CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Scan Go dependencies
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/govulncheck.txt"
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -format text ./... >"$report" 2>&1
          status=$?
          set -e
          cat "$report"
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          # Helm still imports x/crypto/openpgp transitively. The package is
          # unmaintained and has no fixed release; keep this single advisory
          # explicit while failing closed for every other vulnerability.
          ids="$(sed -nE 's/.*Vulnerability #[0-9]+: (GO-[0-9-]+)$/\1/p' "$report" | sort -u)"
          if [[ "$ids" == "GO-2026-5932" ]]; then
            exit 0
          fi
          exit "$status"
      - run: helm lint deploy/helm/envpilot
      - run: helm lint deploy/helm/envpilot-control-plane
      - run: helm lint deploy/helm/envpilot-agent
      - run: helm lint deploy/helm/envpilot-runner
      - run: bash scripts/check-vendored-chart-drift.sh
      - run: bash scripts/check-env-parity.sh
      - run: bash scripts/check-base-image-digests.sh
