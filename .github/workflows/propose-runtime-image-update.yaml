name: Propose runtime image update

on:
  repository_dispatch:
    types: [component-image-published]
  workflow_dispatch:
    inputs:
      component:
        description: Runtime component
        required: true
        type: choice
        options: [control-plane, frontend, agent, runner, platform-reconciler]
      repository:
        description: Canonical GHCR repository
        required: true
        type: string
      tag:
        description: Immutable full-SHA tag
        required: true
        type: string
      digest:
        description: Multi-architecture manifest digest
        required: true
        type: string
      source_revision:
        description: Full source commit SHA
        required: true
        type: string
      source_repository:
        description: Canonical source repository (owner/name)
        required: true
        type: string

# The workflow itself has no write-capable GITHUB_TOKEN. A dedicated PR App
# token is minted only inside this trusted repository_dispatch/manual job.
permissions:
  contents: read
  packages: read

concurrency:
  # All updates share one branch/PR. Serialising the complete read/modify/test
  # transaction prevents two component pins from overwriting each other.
  group: propose-runtime-image-pins
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'EnvPlane/deploy' && (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - id: payload
        name: Validate trusted payload
        env:
          COMPONENT: ${{ github.event.client_payload.component || inputs.component }}
          REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          DIGEST: ${{ github.event.client_payload.digest || inputs.digest }}
          SOURCE_REVISION: ${{ github.event.client_payload.source_revision || inputs.source_revision }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository }}
        run: |
          set -euo pipefail
          source_repository_normalized="${SOURCE_REPOSITORY,,}"
          repository_normalized="${REPOSITORY,,}"
          case "$COMPONENT" in control-plane|frontend|agent|runner|platform-reconciler) ;; *) echo "invalid component" >&2; exit 1;; esac
          [[ "$TAG" =~ ^sha-[0-9a-f]{40}$ ]] || { echo "invalid immutable tag" >&2; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid digest" >&2; exit 1; }
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid source revision" >&2; exit 1; }
          case "$COMPONENT:$source_repository_normalized" in
            control-plane:envplane/control-plane|frontend:envplane/frontend|agent:envplane/agent|runner:envplane/runner) ;;
            platform-reconciler:envplane/deploy) ;;
            *) echo "source repository is not canonical for component" >&2; exit 1 ;;
          esac
          case "$COMPONENT:$repository_normalized" in
            control-plane:ghcr.io/envplane/api|frontend:ghcr.io/envplane/frontend|agent:ghcr.io/envplane/agent|runner:ghcr.io/envplane/runner) ;;
            platform-reconciler:ghcr.io/envplane/platform-reconciler) ;;
            *) echo "repository is not canonical for component" >&2; exit 1;;
          esac
          {
            echo "component=$COMPONENT"
            echo "repository=$repository_normalized"
            echo "tag=$TAG"
            echo "digest=$DIGEST"
            echo "source_revision=$SOURCE_REVISION"
            echo "source_repository=$SOURCE_REPOSITORY"
          } >> "$GITHUB_OUTPUT"
      - id: auth_method
        name: Select deploy PR authentication
        env:
          CLIENT_ID: ${{ secrets.ENVPLANE_AUTOMATION_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ENVPLANE_AUTOMATION_APP_PRIVATE_KEY }}
          FALLBACK_PAT: ${{ secrets.ENVPLANE_AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          if [[ -n "$CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "method=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$FALLBACK_PAT" ]]; then
            echo "method=pat" >> "$GITHUB_OUTPUT"
          else
            echo "Neither GitHub App credentials nor fallback PAT is configured." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - id: deploy_pr_app
        if: steps.auth_method.outputs.method == 'app'
        run: ./scripts/obtain-github-app-token.sh
        env:
          ENVPLANE_AUTOMATION_APP_CLIENT_ID: ${{ secrets.ENVPLANE_AUTOMATION_APP_CLIENT_ID }}
          ENVPLANE_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.ENVPLANE_AUTOMATION_APP_PRIVATE_KEY }}
          GH_APP_OWNER: EnvPlane
          GH_APP_REPOSITORY: deploy
          GH_APP_TOKEN_PERMISSIONS: '{"contents":"write","pull_requests":"write","packages":"read"}'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Authenticate to GHCR with deploy workflow token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Canonical packages remain under ghcr.io/EnvPlane after the
          # repository-owner migration. Use the dedicated registry credential
          # before the repository App token, which cannot access that package
          # namespace. Digest verification below remains mandatory.
          password: ${{ github.token }}
      - name: Verify immutable GHCR artifact and digest
        env:
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          TAG: ${{ steps.payload.outputs.tag }}
          DIGEST: ${{ steps.payload.outputs.digest }}
        run: |
          set -euo pipefail
          repository_normalized="${REPOSITORY,,}"
          docker buildx imagetools inspect "$repository_normalized:$TAG" | tee /tmp/image-inspect.txt
          grep -Fq "$DIGEST" /tmp/image-inspect.txt || {
            echo "GHCR tag exists but does not resolve to the supplied digest" >&2
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPLANE_AUTOMATION_PAT }}
          ref: main
          fetch-depth: 0
      - name: Restore the shared update branch
        env:
          PUSH_TOKEN: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPLANE_AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          # The shared automation branch may need a merge commit before its
          # pending component pins can be refreshed. GitHub-hosted runners do
          # not provide a committer identity by default, so declare the
          # release bot explicitly before that merge.
          git config user.name "envplane-release-automation[bot]"
          git config user.email "envplane-release-automation[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/EnvPlane/deploy.git"
          git fetch origin main
          git checkout -B main origin/main
          if git fetch origin refs/heads/automation/runtime-image-pins:refs/remotes/origin/automation/runtime-image-pins; then
            git merge --no-edit origin/automation/runtime-image-pins
          fi
      - name: Update immutable image pin
        run: |
          scripts/update-runtime-image-values.sh \
            --component '${{ steps.payload.outputs.component }}' \
            --repository '${{ steps.payload.outputs.repository }}' \
            --tag '${{ steps.payload.outputs.tag }}' \
            --digest '${{ steps.payload.outputs.digest }}' \
            --source-revision '${{ steps.payload.outputs.source_revision }}' \
            --report-file "$RUNNER_TEMP/image-update-report.json"
      - id: report
        name: Capture old and new references for the PR
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/image-update-report.json"
          echo "old_reference=$(jq -r .oldReference "$RUNNER_TEMP/image-update-report.json")" >> "$GITHUB_OUTPUT"
          echo "old_digest=$(jq -r .oldDigest "$RUNNER_TEMP/image-update-report.json")" >> "$GITHUB_OUTPUT"
      - name: Verify component update isolation
        run: scripts/test-update-runtime-image-values.sh
      - name: Validate umbrella render
        run: |
          helm dependency build --skip-refresh deploy/helm/envplane
          helm lint deploy/helm/envplane
          # The child chart intentionally requires a password and, when TLS
          # is enabled, a CA Secret.  The proposal gate only validates chart
          # structure; use disposable render-only values and keep runtime
          # secret validation unchanged.
          helm template envplane deploy/helm/envplane \
            --set-string envplane-control-plane.postgres.auth.password=ci-render-only-password \
            --set envplane-control-plane.postgres.tls.enabled=false \
            >/dev/null
      - uses: peter-evans/create-pull-request@v8
        id: pull_request
        with:
          token: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPLANE_AUTOMATION_PAT }}
          add-paths: |
            deploy/helm/envplane/values.yaml
          base: main
          branch: automation/runtime-image-pins
          delete-branch: false
          commit-message: "chore(release): pin ${{ steps.payload.outputs.component }} image ${{ steps.payload.outputs.tag }}"
          title: "chore(release): pin ${{ steps.payload.outputs.component }} ${{ steps.payload.outputs.tag }}"
          body: |
            Automated immutable runtime image update.

            - component: `${{ steps.payload.outputs.component }}`
            - source repository: `${{ steps.payload.outputs.source_repository }}`
            - source commit: `${{ steps.payload.outputs.source_revision }}`
            - old reference: `${{ steps.report.outputs.old_reference }}`
            - new reference: `${{ steps.payload.outputs.repository }}@${{ steps.payload.outputs.digest }}` (tag `${{ steps.payload.outputs.tag }}`)
            - compatibility metadata: updated in the matching `values.yaml`

            The payload was validated against the component allowlist and the
            immutable GHCR tag was inspected before this PR was refreshed. The
            next atomic umbrella release generates the signed compatibility
            manifest from these source values.
      - name: Merge validated runtime image pin
        if: steps.pull_request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPLANE_AUTOMATION_PAT }}
          PR_NUMBER: ${{ steps.pull_request.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # The immutable artifact and complete umbrella render were verified
          # above. Do not leave a successful publication pending on a
          # repository-wide auto-merge setting.
          gh pr merge "$PR_NUMBER" --squash --delete-branch --repo EnvPlane/deploy
