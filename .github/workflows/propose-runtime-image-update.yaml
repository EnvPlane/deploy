name: Propose runtime image update

on:
  repository_dispatch:
    types: [component-image-published]
  workflow_dispatch:
    inputs:
      component:
        description: Runtime component
        required: true
        type: choice
        options: [control-plane, frontend, agent, runner]
      repository:
        description: Canonical GHCR repository
        required: true
        type: string
      tag:
        description: Immutable full-SHA tag
        required: true
        type: string
      digest:
        description: Multi-architecture manifest digest
        required: true
        type: string
      source_revision:
        description: Full source commit SHA
        required: true
        type: string
      source_repository:
        description: Canonical source repository (owner/name)
        required: true
        type: string

# The workflow itself has no write-capable GITHUB_TOKEN. A dedicated PR App
# token is minted only inside this trusted repository_dispatch/manual job.
permissions:
  contents: read
  packages: read

concurrency:
  # All updates share one branch/PR. Serialising the complete read/modify/test
  # transaction prevents two component pins from overwriting each other.
  group: propose-runtime-image-pins
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'envpilot/deploy' && (github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - id: payload
        name: Validate trusted payload
        env:
          COMPONENT: ${{ github.event.client_payload.component || inputs.component }}
          REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          DIGEST: ${{ github.event.client_payload.digest || inputs.digest }}
          SOURCE_REVISION: ${{ github.event.client_payload.source_revision || inputs.source_revision }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.source_repository }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in control-plane|frontend|agent|runner) ;; *) echo "invalid component" >&2; exit 1;; esac
          [[ "$TAG" =~ ^sha-[0-9a-f]{40}$ ]] || { echo "invalid immutable tag" >&2; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid digest" >&2; exit 1; }
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid source revision" >&2; exit 1; }
          case "$COMPONENT:$SOURCE_REPOSITORY" in
            control-plane:envpilot/control-plane|frontend:envpilot/frontend|agent:envpilot/agent|runner:envpilot/runner) ;;
            *) echo "source repository is not canonical for component" >&2; exit 1 ;;
          esac
          case "$COMPONENT:$REPOSITORY" in
            control-plane:ghcr.io/envpilot/api|frontend:ghcr.io/envpilot/frontend|agent:ghcr.io/envpilot/agent|runner:ghcr.io/envpilot/runner) ;;
            *) echo "repository is not canonical for component" >&2; exit 1;;
          esac
          {
            echo "component=$COMPONENT"
            echo "repository=$REPOSITORY"
            echo "tag=$TAG"
            echo "digest=$DIGEST"
            echo "source_revision=$SOURCE_REVISION"
            echo "source_repository=$SOURCE_REPOSITORY"
          } >> "$GITHUB_OUTPUT"
      - id: auth_method
        name: Select deploy PR authentication
        env:
          CLIENT_ID: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          FALLBACK_PAT: ${{ secrets.ENVPILOT_AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          if [[ -n "$CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "method=app" >> "$GITHUB_OUTPUT"
          elif [[ -n "$FALLBACK_PAT" ]]; then
            echo "method=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using fine-grained PAT fallback; configure the GitHub App secrets."
          else
            echo "Neither GitHub App credentials nor fallback PAT is configured." >&2
            exit 1
          fi
      - id: deploy_pr_app
        if: steps.auth_method.outputs.method == 'app'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          owner: envpilot
          repositories: deploy,frontend,control-plane,agent,runner
          permission-contents: write
          permission-pull-requests: write
          permission-packages: read
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Authenticate to GHCR with immutable-artifact verifier token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
      - name: Verify immutable GHCR artifact and digest
        env:
          REPOSITORY: ${{ steps.payload.outputs.repository }}
          TAG: ${{ steps.payload.outputs.tag }}
          DIGEST: ${{ steps.payload.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$REPOSITORY:$TAG" | tee /tmp/image-inspect.txt
          grep -Fq "$DIGEST" /tmp/image-inspect.txt || {
            echo "GHCR tag exists but does not resolve to the supplied digest" >&2
            exit 1
          }
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
          ref: main
          fetch-depth: 0
      - name: Restore the shared update branch
        env:
          PUSH_TOKEN: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/envpilot/deploy.git"
          git fetch origin main
          if git fetch origin refs/heads/automation/runtime-image-pins:refs/remotes/origin/automation/runtime-image-pins; then
            git checkout -B automation/runtime-image-pins origin/automation/runtime-image-pins
            git merge --no-edit origin/main
          else
            git checkout -B automation/runtime-image-pins origin/main
          fi
      - id: release
        name: Select the current compatibility manifest
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" {gsub(/[\"'"'"']/,"",$2); print $2; exit}' deploy/helm/envpilot/Chart.yaml)"
          test -n "$version"
          test -f "release/$version.yaml"
          echo "file=release/$version.yaml" >> "$GITHUB_OUTPUT"
      - name: Update immutable image pin
        run: |
          scripts/update-runtime-image-values.sh \
            --component '${{ steps.payload.outputs.component }}' \
            --repository '${{ steps.payload.outputs.repository }}' \
            --tag '${{ steps.payload.outputs.tag }}' \
            --digest '${{ steps.payload.outputs.digest }}' \
            --source-revision '${{ steps.payload.outputs.source_revision }}' \
            --release-file '${{ steps.release.outputs.file }}' \
            --report-file "$RUNNER_TEMP/image-update-report.json"
      - id: report
        name: Capture old and new references for the PR
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/image-update-report.json"
          echo "old_reference=$(jq -r .oldReference "$RUNNER_TEMP/image-update-report.json")" >> "$GITHUB_OUTPUT"
          echo "old_digest=$(jq -r .oldDigest "$RUNNER_TEMP/image-update-report.json")" >> "$GITHUB_OUTPUT"
      - name: Verify component update isolation
        run: scripts/test-update-runtime-image-values.sh
      - name: Validate umbrella render
        run: |
          helm dependency build --skip-refresh deploy/helm/envpilot
          helm lint deploy/helm/envpilot
          helm template envpilot deploy/helm/envpilot >/dev/null
      - uses: peter-evans/create-pull-request@v7
        id: pull_request
        with:
          token: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
          add-paths: |
            deploy/helm/envpilot/values.yaml
            ${{ steps.release.outputs.file }}
          branch: automation/runtime-image-pins
          delete-branch: false
          commit-message: "chore(release): pin ${{ steps.payload.outputs.component }} image ${{ steps.payload.outputs.tag }}"
          title: "chore(release): pin ${{ steps.payload.outputs.component }} ${{ steps.payload.outputs.tag }}"
          body: |
            Automated immutable runtime image update.

            - component: `${{ steps.payload.outputs.component }}`
            - source repository: `${{ steps.payload.outputs.source_repository }}`
            - source commit: `${{ steps.payload.outputs.source_revision }}`
            - old reference: `${{ steps.report.outputs.old_reference }}`
            - new reference: `${{ steps.payload.outputs.repository }}@${{ steps.payload.outputs.digest }}` (tag `${{ steps.payload.outputs.tag }}`)
            - compatibility manifest: `${{ steps.release.outputs.file }}`

            The payload was validated against the component allowlist and the
            immutable GHCR tag was inspected before this PR was refreshed.
      - name: Enable auto-merge after passing tests
        if: steps.pull_request.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.deploy_pr_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
          PR_NUMBER: ${{ steps.pull_request.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --repo envpilot/deploy
