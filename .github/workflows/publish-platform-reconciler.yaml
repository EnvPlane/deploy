name: Publish platform reconciler image

on:
  push:
    branches: [main]
    paths:
      - 'cmd/platform-reconciler/**'
      - 'Dockerfile.platform-reconciler'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/publish-platform-reconciler.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-platform-reconciler-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'EnvPlane/deploy' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.published.outputs.repository }}
      tag: ${{ steps.published.outputs.tag }}
      digest: ${{ steps.published.outputs.digest }}
      source_revision: ${{ steps.published.outputs.source_revision }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test platform reconciler
        run: go test ./cmd/platform-reconciler
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/envpilot/platform-reconciler
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.platform-reconciler
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - id: published
        name: Emit immutable image metadata
        env:
          REPOSITORY: ghcr.io/envpilot/platform-reconciler
          TAG: sha-${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^sha-[0-9a-f]{40}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -cn \
            --arg component platform-reconciler \
            --arg repository "$REPOSITORY" \
            --arg tag "$TAG" \
            --arg digest "$DIGEST" \
            --arg source_revision "$SOURCE_REVISION" \
            '{component:$component,repository:$repository,tag:$tag,digest:$digest,source_revision:$source_revision}' \
            | tee platform-reconciler-image-metadata.json
          {
            echo "repository=$REPOSITORY"
            echo "tag=$TAG"
            echo "digest=$DIGEST"
            echo "source_revision=$SOURCE_REVISION"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: platform-reconciler-image-metadata
          path: platform-reconciler-image-metadata.json
          if-no-files-found: error
