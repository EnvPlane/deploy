name: Publish deploy image and charts (main)

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'cmd/**'
      - 'deploy/helm/**'
      - 'release/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/publish-main.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-deploy-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test deploy tooling
        run: go test ./...
      - uses: azure/setup-helm@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Lint and package charts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for chart in deploy/helm/*; do
            [[ -f "$chart/Chart.yaml" ]] || continue
            helm lint "$chart"
            base_version="$(awk -F': ' '$1 == "version" {print $2; exit}' "$chart/Chart.yaml")"
            version="${base_version}-main.${GITHUB_RUN_NUMBER}"
            helm package "$chart" --destination dist --version "$version" --app-version "$version"
          done
      - name: Publish OCI charts
        shell: bash
        run: |
          set -euo pipefail
          for package in dist/*.tgz; do
            helm push "$package" oci://ghcr.io/${{ github.repository_owner }}
          done
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/install
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
