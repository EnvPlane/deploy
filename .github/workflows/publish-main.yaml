name: Publish deploy image and charts (main)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - 'release/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/resolve-latest-published-artifacts.sh'
      - 'deploy/helm/envpilot/values.yaml'
      - 'deploy/helm/envpilot/Chart.yaml'
      - '.github/workflows/publish-main.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-deploy-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test deploy tooling
        run: go test ./...
      - uses: azure/setup-helm@v4
      - uses: oras-project/setup-oras@v1
      - name: Authenticate to GHCR
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Authenticate ORAS to GHCR
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Verify canonical Helm chart sources
        run: ./scripts/check-canonical-chart-sources.sh --deploy "$GITHUB_WORKSPACE"
      - name: Verify remote-cluster credential RBAC contract
        run: ./scripts/tests/remote-cluster-credential-contract.sh
      - name: Verify published remote-cluster lifecycle contract
        run: ./scripts/tests/published-remote-cluster-lifecycle-contract.sh
      - name: Verify published two-cluster RemoteCluster contract
        run: ./scripts/tests/published-remote-cluster-two-cluster-contract.sh
      - name: Lint and package charts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for chart in deploy/helm/*; do
            [[ -f "$chart/Chart.yaml" ]] || continue
            helm dependency build --skip-refresh "$chart"
            helm lint "$chart"
            base_version="$(awk -F': ' '$1 == "version" {print $2; exit}' "$chart/Chart.yaml")"
            version="${base_version}-main.${GITHUB_RUN_NUMBER}"
            helm package "$chart" --destination dist --version "$version" --app-version "$version"
          done
      - name: Publish OCI charts
        shell: bash
        run: |
          set -euo pipefail
          for package in dist/*.tgz; do
            helm push "$package" oci://ghcr.io/${{ github.repository_owner }}
          done
      - name: Resolve and verify the published compatibility set
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/resolve-latest-published-artifacts.sh \
            --values-file deploy/helm/envpilot/values.yaml \
            --chart-file deploy/helm/envpilot/Chart.yaml \
            --output "$RUNNER_TEMP/latest-artifacts.json"
          jq -e \
            '.schemaVersion == 1 and (.sourceRevision | test("^[0-9a-f]{40}$")) and
             (.images | length == 5) and (.charts | length == 4) and
             all(.images[]; (.tag | test("^sha-[0-9a-f]{40}$")) and
               (.digest | test("^sha256:[0-9a-f]{64}$"))) and
             all(.charts[]; (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))' \
            "$RUNNER_TEMP/latest-artifacts.json" >/dev/null
      - name: Upload confirmed compatibility manifest
        uses: actions/upload-artifact@v4
        with:
          name: envpilot-compatible-artifacts
          path: ${{ runner.temp }}/latest-artifacts.json
          if-no-files-found: error
          retention-days: 14
