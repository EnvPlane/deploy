name: Publish agent Helm chart

on:
  push:
    tags:
      - 'agent-chart-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Verify canonical chart sources
        run: ./scripts/check-canonical-chart-sources.sh --deploy "$GITHUB_WORKSPACE"
      - name: Package chart
        run: helm package deploy/helm/envpilot-agent --destination dist
      - name: Authenticate to GHCR
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish OCI chart
        run: helm push dist/envpilot-agent-*.tgz oci://ghcr.io/${{ github.repository_owner }}
