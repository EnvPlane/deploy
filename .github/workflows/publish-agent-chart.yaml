name: Publish agent Helm chart

on:
  push:
    tags:
      - 'agent-chart-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - id: chart
        run: echo "version=$(awk '/^version:/{print $2; exit}' deploy/helm/envpilot-agent/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - name: Verify canonical chart sources
        run: ./scripts/check-canonical-chart-sources.sh --deploy "$GITHUB_WORKSPACE"
      - name: Package chart
        run: helm package deploy/helm/envpilot-agent --destination dist
      - name: Authenticate to GHCR
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Reject an existing OCI version
        run: ./scripts/check-oci-chart-version-available.sh --repository oci://ghcr.io/envpilot/envpilot-agent --version '${{ steps.chart.outputs.version }}'
      - name: Publish OCI chart
        id: push
        run: |
          set -euo pipefail
          output="$(helm push dist/envpilot-agent-*.tgz oci://ghcr.io/envpilot 2>&1 | tee /dev/stderr)"
          digest="$(printf '%s\n' "$output" | awk '/^Digest:/{print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: dispatch_auth
        env:
          CLIENT_ID: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          PAT: ${{ secrets.ENVPILOT_AUTOMATION_PAT }}
        run: |
          if [[ -n "$CLIENT_ID" && -n "$APP_KEY" ]]; then echo method=app >> "$GITHUB_OUTPUT"; elif [[ -n "$PAT" ]]; then echo method=pat >> "$GITHUB_OUTPUT"; else exit 1; fi
      - id: dispatch_app
        if: steps.dispatch_auth.outputs.method == 'app'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          owner: EnvPlane
          repositories: deploy
          permission-contents: write
      - name: Dispatch chart publication
        env:
          GH_TOKEN: ${{ steps.dispatch_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
        run: ./scripts/dispatch-chart-published.sh --component agent --chart envpilot-agent --version '${{ steps.chart.outputs.version }}' --digest '${{ steps.push.outputs.digest }}'
