name: Publish latest compatible EnvPlane umbrella release

on:
  workflow_run:
    workflows: ["Publish deploy image and charts (main)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful Publish deploy image and charts run to consume"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: envplane-umbrella-main-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'EnvPlane/deploy' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download confirmed compatibility manifest
        uses: actions/download-artifact@v8
        with:
          name: envplane-compatible-artifacts
          path: ${{ runner.temp }}/confirmed-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.artifact_run_id }}
      - name: Refresh compatibility manifest to current deploy main
        env:
          REPORT: ${{ runner.temp }}/confirmed-artifacts/latest-artifacts.json
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          current_main="${WORKFLOW_RUN_SHA:-$(git ls-remote origin refs/heads/main | awk '{print $1}')}"
          ./scripts/resolve-compatible-manifest.sh \
            --report "$REPORT" \
            --main-revision "$current_main"
      - name: Ensure selected compatibility set is current deploy main
        env:
          REPORT: ${{ runner.temp }}/confirmed-artifacts/latest-artifacts.json
          WORKFLOW_RUN_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          main_revision="${WORKFLOW_RUN_SHA:-$(git ls-remote origin refs/heads/main | awk '{print $1}')}"
          ./scripts/ensure-current-compatible-artifact.sh \
            --report "$REPORT" --main-revision "$main_revision"
      - name: Select the artifact source revision
        id: source
        env:
          REPORT: ${{ runner.temp }}/confirmed-artifacts/latest-artifacts.json
        run: |
          set -euo pipefail
          test -s "$REPORT"
          jq -e \
            '.schemaVersion == 1 and (.sourceRevision | test("^[0-9a-f]{40}$")) and
             (.images | length == 6) and (.charts | length == 6) and
             all(.charts[]; (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
               (.digest | test("^sha256:[0-9a-f]{64}$")) and
               (.sourceRevision | test("^[0-9a-f]{40}$")))' \
            "$REPORT" >/dev/null
          source_revision="$(jq -er '.sourceRevision' "$REPORT")"
          git fetch --no-tags origin "$source_revision"
          git checkout --detach "$source_revision"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          echo "revision=$source_revision" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v5
      - uses: oras-project/setup-oras@v2
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Authenticate Helm to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Authenticate ORAS to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify canonical chart sources
        run: ./scripts/check-canonical-chart-sources.sh --deploy "$GITHUB_WORKSPACE"
      - name: Verify automatic release workflow contract
        run: ./scripts/tests/release-on-main-contract.sh
      - name: Select Secret materialization lifecycle gate source
        id: secret_lifecycle
        env:
          REPORT: ${{ steps.source.outputs.report }}
        run: |
          set -euo pipefail
          revision="$(jq -er '.images.agent.sourceRevision' "$REPORT")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "agent_revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout release-compatible Agent source
        uses: actions/checkout@v7
        with:
          repository: EnvPlane/agent
          ref: ${{ steps.secret_lifecycle.outputs.agent_revision }}
          path: release-gate-agent
          token: ${{ github.token }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: release-gate-agent/go.mod
          cache-dependency-path: release-gate-agent/go.sum
      - name: Run Secret materialization executor lifecycle gate
        working-directory: release-gate-agent
        run: |
          set -euo pipefail
          go mod edit -dropreplace=github.com/envplane/contracts
          go test ./agent -run '^TestSecretMaterializationReleaseGate$' -count=1
      - name: Verify confirmed immutable artifacts
        id: artifacts
        run: |
          set -euo pipefail
          report="${{ steps.source.outputs.report }}"
          test -s "$report"
          jq -e \
            '.schemaVersion == 1 and (.sourceRevision | test("^[0-9a-f]{40}$")) and
             (.images | length == 6) and (.charts | length == 6) and
             all(.images[]; (.tag | test("^sha-[0-9a-f]{40}$")) and
               (.digest | test("^sha256:[0-9a-f]{64}$"))) and
             all(.charts[]; (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
               (.digest | test("^sha256:[0-9a-f]{64}$")) and
               (.sourceRevision | test("^[0-9a-f]{40}$")))' \
            "$report" >/dev/null
          cp "$report" "$RUNNER_TEMP/latest-artifacts.json"
          echo "report=$RUNNER_TEMP/latest-artifacts.json" >> "$GITHUB_OUTPUT"
      - name: Smoke-check editable Draft component controls in frontend image
        env:
          REPORT: ${{ steps.artifacts.outputs.report }}
        run: |
          set -euo pipefail
          ./scripts/verify-frontend-component-repair-controls.sh \
            --image "$(jq -er '.images.frontend.repository + ":" + .images.frontend.tag' "$REPORT")" \
            --digest "$(jq -er '.images.frontend.digest' "$REPORT")"
      - name: Apply latest image pins in the ephemeral release workspace
        env:
          REPORT: ${{ steps.artifacts.outputs.report }}
        run: |
          set -euo pipefail
          for mapping in controlPlane:control-plane frontend:frontend agent:agent runner:runner webhook:webhook; do
            report_component="${mapping%%:*}"
            component="${mapping##*:}"
            repository="$(jq -er --arg component "$report_component" '.images[$component].repository' "$REPORT")"
            tag="$(jq -er --arg component "$report_component" '.images[$component].tag' "$REPORT")"
            digest="$(jq -er --arg component "$report_component" '.images[$component].digest' "$REPORT")"
            revision="$(jq -er --arg component "$report_component" '.images[$component].sourceRevision' "$REPORT")"
            ./scripts/update-runtime-image-values.sh \
              --component "$component" --repository "$repository" --tag "$tag" \
              --digest "$digest" --source-revision "$revision"
          done
          ./scripts/update-runtime-image-values.sh \
            --component platform-reconciler \
            --repository "$(jq -er '.images.platformReconciler.repository' "$REPORT")" \
            --tag "$(jq -er '.images.platformReconciler.tag' "$REPORT")" \
            --digest "$(jq -er '.images.platformReconciler.digest' "$REPORT")" \
            --source-revision "$(jq -er '.images.platformReconciler.sourceRevision' "$REPORT")"
      - name: Select latest child chart versions and use OCI dependencies
        env:
          REPORT: ${{ steps.artifacts.outputs.report }}
        run: |
          set -euo pipefail
          for mapping in controlPlane:control-plane frontend:frontend agent:agent runner:runner webhook:webhook e2eWorkload:e2e-workload; do
            report_component="${mapping%%:*}"
            component="${mapping##*:}"
            ./scripts/update-umbrella-chart-dependency.sh \
              --component "$component" \
              --version "$(jq -er --arg component "$report_component" '.charts[$component].version' "$REPORT")"
          done
          # Source directories remain the canonical development sources. The
          # published release resolves the exact selected OCI archives so its
          # vendored dependencies cannot drift from the compatibility report.
          sed -i.bak \
            -e 's#repository: file://../envplane-control-plane#repository: oci://ghcr.io/envplane#' \
            -e 's#repository: file://../envplane-frontend#repository: oci://ghcr.io/envplane#' \
            -e 's#repository: file://../envplane-agent#repository: oci://ghcr.io/envplane#' \
            -e 's#repository: file://../envplane-runner#repository: oci://ghcr.io/envplane#' \
            -e 's#repository: file://../envplane-webhook#repository: oci://ghcr.io/envplane#' \
            -e 's#repository: file://../envplane-e2e-workload#repository: oci://ghcr.io/envplane#' \
            deploy/helm/envplane/Chart.yaml
          rm -f deploy/helm/envplane/Chart.yaml.bak
          rm -f deploy/helm/envplane/Chart.lock deploy/helm/envplane/charts/*.tgz
          helm dependency build --skip-refresh deploy/helm/envplane
      - name: Bump umbrella patch version in the build workspace
        id: version
        env:
          REPORT: ${{ steps.artifacts.outputs.report }}
        run: |
          set -euo pipefail
          current="$(awk '/^version:/{print $2; exit}' deploy/helm/envplane/Chart.yaml)"
          previous="$(jq -er '.previousUmbrellaVersion' "$REPORT")"
          # Read the registry tag set once and derive the next patch directly.
          # Probing versions one by one makes every release walk through all
          # historical tags (and can issue hundreds of registry requests).
          published="$(oras repo tags ghcr.io/envplane/envplane 2>/dev/null \
            | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ {print}' \
            | sort -V | tail -n1 || true)"
          base="$(printf '%s\n' "$current" "$previous" "$published" | sort -V | tail -n1)"
          # Start the new major-minor release line once, then keep patch
          # increments within 0.4.x. This prevents stale 0.3.x tags from
          # colliding with the current EnvPlane release line.
          minimum="0.4.0"
          if [[ "$(printf '%s\n' "$base" "$minimum" | sort -V | tail -n1)" == "$minimum" && "$base" != "$minimum" ]]; then
            version="$minimum"
          else
            IFS=. read -r major minor patch <<< "$base"
            version="$major.$minor.$((patch + 1))"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sed -i.bak -E "0,/^version: .*/s//version: $version/; 0,/^appVersion: .*/s//appVersion: \"$version\"/" deploy/helm/envplane/Chart.yaml
          rm -f deploy/helm/envplane/Chart.yaml.bak
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - name: Generate immutable compatibility manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPORT: ${{ steps.artifacts.outputs.report }}
        run: |
          set -euo pipefail
          ./scripts/generate-umbrella-compatibility-manifest.sh \
            --version "$VERSION" --source-revision "${{ steps.source.outputs.revision }}" \
            --artifact-report "$REPORT" \
            --output deploy/helm/envplane/compatibility/release.json
          jq -e --arg version "$VERSION" \
            '.umbrella.version == $version and (.images | length == 6) and (.childCharts | length == 6) and
             all(.childCharts[]; (.digest | test("^sha256:[0-9a-f]{64}$")) and
               (.sourceRevision | test("^[0-9a-f]{40}$")))' \
            deploy/helm/envplane/compatibility/release.json >/dev/null
      - name: Select deploy Go toolchain for umbrella validation
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Validate and package the complete umbrella
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          go test ./deploy/helm/envplane/tests
          helm lint deploy/helm/envplane
          # This is a structural release check, not an installation. Supply
          # disposable values for credentials that remain required at runtime.
          helm template envplane deploy/helm/envplane \
            --set-string envplane-control-plane.postgres.auth.password=ci-render-only-password \
            --set envplane-control-plane.postgres.tls.enabled=false \
            >/dev/null
          mkdir -p dist
          helm package deploy/helm/envplane --destination dist --version "$VERSION" --app-version "$VERSION"
      - name: Generate JSON attestation predicate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          jq -n --arg version "$VERSION" \
            --arg sourceRevision "$GITHUB_SHA" \
            --slurpfile compatibility deploy/helm/envplane/compatibility/release.json \
            '{schemaVersion:1,releaseVersion:$version,sourceRevision:$sourceRevision,compatibility:$compatibility[0]}' \
            > "$RUNNER_TEMP/compatibility-predicate.json"
          jq -e 'has("schemaVersion") and has("compatibility")' "$RUNNER_TEMP/compatibility-predicate.json" >/dev/null
      - name: Publish umbrella OCI chart
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          output="$(helm push "dist/envplane-$VERSION.tgz" oci://ghcr.io/envplane 2>&1 | tee /dev/stderr)"
          digest="$(awk '/^Digest:/{print $2; exit}' <<< "$output")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "umbrella push did not return an immutable digest" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign and attest the published umbrella
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          ref="ghcr.io/envplane/envplane@$DIGEST"
          cosign sign --yes "$ref"
          cosign attest --yes --predicate "$RUNNER_TEMP/compatibility-predicate.json" \
            --type https://envplane.dev/compatibility/v1 "$ref"
      - name: Verify predecessor compatibility set
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          if [[ "$PREVIOUS" == "0.0.0" ]]; then
            echo "no predecessor umbrella exists; skipping initial-release reinstall check"
            exit 0
          fi
          helm pull "oci://ghcr.io/envplane/envplane" --version "$PREVIOUS" --destination "$RUNNER_TEMP"
          ./scripts/verify-umbrella-reinstall-compatibility.sh \
            "$RUNNER_TEMP/envplane-$PREVIOUS.tgz"
      - name: Publish GitHub Release and machine-readable metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n --arg version "$VERSION" --arg digest "$DIGEST" \
            --arg chart "oci://ghcr.io/envplane/envplane:$VERSION" \
            --slurpfile compatibility deploy/helm/envplane/compatibility/release.json \
            '{schemaVersion:1,chart:$chart,version:$version,digest:$digest,compatibility:$compatibility[0]}' \
            > "dist/envplane-$VERSION-release.json"
          tag="envplane-v$VERSION"
          assets=(
            "dist/envplane-$VERSION.tgz"
            "deploy/helm/envplane/compatibility/release.json"
            "dist/envplane-$VERSION-release.json"
          )
          if gh release view "$tag" --repo EnvPlane/deploy >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo EnvPlane/deploy --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo EnvPlane/deploy --title "EnvPlane umbrella $VERSION" --generate-notes \
              --notes "OCI chart: oci://ghcr.io/envplane/envplane:$VERSION\nDigest: $DIGEST"
          fi
