name: Publish runner Helm chart

on:
  push:
    tags:
      - "runner-chart-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package chart
        run: helm package deploy/helm/envpilot-runner --destination dist
      - name: Authenticate to GHCR
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish OCI chart
        run: helm push dist/envpilot-runner-*.tgz oci://ghcr.io/${{ github.repository_owner }}
