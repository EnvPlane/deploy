name: Publish runner Helm chart

on:
  push:
    tags:
      - "runner-chart-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - id: chart
        run: echo "version=$(awk '/^version:/{print $2; exit}' deploy/helm/envpilot-runner/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - name: Verify canonical Helm chart sources
        run: ./scripts/check-canonical-chart-sources.sh --deploy "$GITHUB_WORKSPACE"
      - name: Lint and render the canonical Runner chart
        run: |
          set -euo pipefail
          go test ./deploy/helm/envpilot-runner/tests
          helm lint deploy/helm/envpilot-runner
          helm template envpilot-runner deploy/helm/envpilot-runner >/dev/null
      - name: Package chart
        run: helm package deploy/helm/envpilot-runner --destination dist
      - name: Authenticate to GHCR
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Reject an existing OCI version
        run: ./scripts/check-oci-chart-version-available.sh --repository oci://ghcr.io/envpilot/envpilot-runner --version '${{ steps.chart.outputs.version }}'
      - name: Publish OCI chart
        id: push
        run: |
          set -euo pipefail
          output="$(helm push dist/envpilot-runner-*.tgz oci://ghcr.io/${{ github.repository_owner }} 2>&1 | tee /dev/stderr)"
          digest="$(printf '%s\n' "$output" | awk '/^Digest:/{print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Authenticate cosign to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Sign and attest the published Runner chart
        env:
          CHART_REF: ghcr.io/envpilot/envpilot-runner@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$CHART_REF"
          cosign attest --yes --predicate deploy/helm/envpilot-runner/Chart.yaml --type https://envpilot.dev/chart/v1 "$CHART_REF"
      - name: Create isolated Kubernetes test cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: runner-chart-upgrade
      - name: Test published legacy remote upgrade
        env:
          ENVPILOT_RUNNER_UPGRADE_CONTEXT: kind-runner-chart-upgrade
          ENVPILOT_RUNNER_UPGRADE_CHART: oci://ghcr.io/envpilot/envpilot-runner
          ENVPILOT_RUNNER_UPGRADE_VERSION: ${{ steps.chart.outputs.version }}
        run: ./scripts/test-published-runner-legacy-upgrade.sh
      - id: dispatch_auth
        env:
          CLIENT_ID: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          PAT: ${{ secrets.ENVPILOT_AUTOMATION_PAT }}
        run: |
          if [[ -n "$CLIENT_ID" && -n "$APP_KEY" ]]; then echo method=app >> "$GITHUB_OUTPUT"; elif [[ -n "$PAT" ]]; then echo method=pat >> "$GITHUB_OUTPUT"; else exit 1; fi
      - id: dispatch_app
        if: steps.dispatch_auth.outputs.method == 'app'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.ENVPILOT_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENVPILOT_AUTOMATION_APP_PRIVATE_KEY }}
          owner: envpilot
          repositories: deploy
          permission-contents: write
      - name: Dispatch chart publication
        env:
          GH_TOKEN: ${{ steps.dispatch_app.outputs.token || secrets.ENVPILOT_AUTOMATION_PAT }}
        run: ./scripts/dispatch-chart-published.sh --component runner --chart envpilot-runner --version '${{ steps.chart.outputs.version }}' --digest '${{ steps.push.outputs.digest }}'
